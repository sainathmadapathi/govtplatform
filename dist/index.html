 Number, Name, Father Name, Mother Name, and Date of Birth strictly matching Class 10 (Matriculation) Certificate.","Authenticate via Mobile OTP and Email OTP to generate your unique 11-digit OTR Registration Number."],mandatoryFields:["Aadhaar Number / Govt Photo ID","Class 10 Roll Number & Year of Passing","Active Mobile Number (for OTP)","Active Email ID"],commonMistakesToAvoid:["Do NOT enter initials if your Class 10 marksheet contains your full name.","Do NOT use third-party cyber café phone numbers or temporary emails; OTPs for admit cards and results are delivered here."]},{stepNumber:2,title:"Candidate Profile & Additional Category Details",portalUrl:"https://ssc.gov.in",instructions:["Log in with your OTR credentials and set a strong permanent password.","Specify Category (UR / OBC / EWS / SC / ST / PwBD) and Nationality.",'Provide Visible Identification Marks (e.g. "A mole on right side of neck").',"Enter Permanent and Correspondence Address along with PIN Code and State Domicile."],mandatoryFields:["Category Claim","Permanent Address with State/PIN","Visible Identification Mark"],commonMistakesToAvoid:["Claiming OBC without possessing a valid Non-Creamy Layer (NCL) certificate issued for the crucial financial year leads to cancellation during Document Verification.","Claiming EWS without the valid Income & Asset Certificate for FY 2025-26 leads to treating candidate as General (UR)."]},{stepNumber:3,title:"Live Webcam Photo Capture & Signature Upload",portalUrl:"https://ssc.gov.in",instructions:["Open live camera capture via desktop webcam or official SSC MyGov Mobile App.","Ensure background is plain white or light-colored, face is well-lit, and both ears are clearly visible.","Look straight into the camera lens with a neutral facial expression (No caps, masks, dark sunglasses, or spectacles).","Upload scanned Signature image in JPEG/JPG format (Size 10 KB to 20 KB, Width ~4.0 cm x Height ~2.0 cm)."],mandatoryFields:["Live Camera Capture Photo","Scanned Signature (10-20 KB JPEG)"],commonMistakesToAvoid:["Over 40% of rejected applications in SSC occur due to improper live selfies (blurry lighting, tilted face, or wearing spectacles).","Uploading tiny, blurred, or vertical signature crops will lead to automatic software disqualification."]},{stepNumber:4,title:"Post Preference, Exam Center Selection & Fee Payment",portalUrl:"https://ssc.gov.in",instructions:["Select 3 preferred examination center cities within the same SSC Regional Zone.","Indicate whether you possess the educational qualification for Junior Statistical Officer (JSO) or Statistical Investigator.","Preview the complete draft application form and verify spelling across all columns.","Pay application fee of ₹100 via UPI, Net Banking, or Debit Card (Exempted for Women, SC, ST, PwBD, and ESM candidates).","Download and save the PDF of the Final Submitted Application Form with Transaction ID."],mandatoryFields:["Exam City Preferences (3 cities)","Educational Qualification details","Online Fee Payment / Exemption Claim"],commonMistakesToAvoid:['Submitting the application without completing fee payment (status showing "Pending" or "Initiated" instead of "Completed"). Check payment double-verification link if amount was debited.',"Not saving the final PDF with timestamp; this is required during Tier-2 Document Verification."]}],photoRules:{documentType:"Live Webcam / App Capture Photograph",dimensions:"Automatic face boundary detection by SSC portal",fileFormat:"Live Portal Capture via WebRTC / Android App",fileSize:"Live Capture stream",rules:["Must be taken in bright frontal natural or white light.","Background MUST be plain white or uniform light grey/off-white.","Both ears and entire face must be clearly visible without shadows.","No caps, hats, scarves, masks, religious headgear covering face, or sunglasses.","Spectacles/Glasses must be removed during capture to avoid flash glare reflections."],sampleDescription:"A sharp, frontal portrait photo with clear neutral expression on a plain white backdrop."},signatureRules:{documentType:"Scanned Specimen Signature",dimensions:"Width 4.0 cm × Height 2.0 cm (Aspect Ratio 2:1)",fileFormat:"JPEG / JPG only",fileSize:"10 KB to 20 KB (Resolution ~100-200 DPI)",rules:["Sign with black or blue ink on clear unruled white paper.","Crop tightly around the signature without leaving huge blank margins.","Do NOT sign in ALL CAPITAL letters (Running handwriting only).","Ensure the image is sharp and not pixelated or compressed below 10 KB."],sampleDescription:"Clear black running ink signature centered on an unlined white background."},certificateRules:[{category:"OBC_NCL",title:"Other Backward Classes (Non-Creamy Layer) Certificate",issuingAuthority:["District Magistrate / Additional DM","Collector / Deputy Commissioner","Tehsildar / Sub-Divisional Magistrate (SDM)"],financialYearValidity:"Certificate issued based on income of FY 2023-24, FY 2024-25, and FY 2025-26",crucialDate:"Must be issued within 3 years prior to the closing date of application (or on or before 27-09-2026)",officialAnnexure:"Annexure-VI of SSC CGL 2026 Notification",keyConditions:["Caste MUST be listed in the Central List of OBCs published by National Commission for Backward Classes (NCBC). State-only OBC certificates are NOT accepted for Central Government posts.","Must explicitly contain the Non-Creamy Layer exclusion clause citing DoP&T OM No. 36012/22/93-Estt.(SCT)."]},{category:"EWS",title:"Economically Weaker Sections (EWS) Income & Asset Certificate",issuingAuthority:["District Magistrate / ADM / Collector","Sub-Divisional Magistrate / Tehsildar","Taluka Magistrate"],financialYearValidity:"Financial Year 2025-26 based on gross annual family income for the preceding FY 2024-25",crucialDate:"Valid for the year 2026-2027 (Issued between 01-04-2026 and 27-09-2026)",officialAnnexure:"Annexure-VII of SSC CGL 2026 Notification",keyConditions:["Gross annual family income must be below ₹8 Lakhs from all sources.","Must not possess 5 acres of agricultural land or 1000 sq ft residential flat.","Certificate must be valid for the recruitment year 2026-27."]},{category:"SC_ST",title:"Scheduled Caste / Scheduled Tribe Certificate",issuingAuthority:["District Magistrate / Deputy Commissioner","Revenue Officer not below rank of Tehsildar","Sub-Divisional Officer"],financialYearValidity:"Permanent Validity (No financial year expiration)",crucialDate:"Must be issued on or before Document Verification date in standard Central Government format",officialAnnexure:"Annexure-V of SSC CGL 2026 Notification",keyConditions:["Must specify the Presidential Order / Constitution (Scheduled Castes/Tribes) Order under which the caste/tribe is recognized.","Must be in bilingual English/Hindi central format."]},{category:"PwBD",title:"Persons with Benchmark Disabilities (PwBD) Certificate",issuingAuthority:["Duly constituted Medical Board of a State/Central Govt Hospital","UDID Card (Unique Disability ID)"],financialYearValidity:"Permanent for non-progressive disabilities / Specified validity for temporary conditions",crucialDate:"Valid UDID or Certificate with minimum 40% benchmark disability",officialAnnexure:"Annexure-VIII / IX / X of SSC CGL 2026 Notification",keyConditions:["Disability percentage must be 40% or higher.","Scribe permission and compensatory time (20 mins/hr) require Annexure-I/IA certificate declaration during application."]}],rejectionPitfalls:[{pitfall:"Blurry / Inappropriate Live Webcam Photograph",consequence:"Immediate Application Rejection without correction opportunity.",prevention:"Use bright front lighting, plain white wall background, remove spectacles, and keep eyes wide open looking into camera lens."},{pitfall:"State-List Only OBC Certificate",consequence:"Category cancelled during Document Verification; candidate converted to UR or disqualified.",prevention:"Verify that your caste is included in the Central OBC Gazette list via ncbc.nic.in before selecting OBC category arget: 145+ Marks)"},{weekNumber:7,weekTitle:"Week 7: Computer Awareness & Tier-2 Section III Prep",goals:["Study MS Office 365, Shortcut keys, Networking, and Cyber Security modules","Practice 15 minutes of daily touch-typing on English keyboard (Target: 30 WPM)","Continue 3 Tier-1 full mocks per week"],suggestedDailyHours:8,milestoneTest:"Full-Length Mock Test #05 & Computer Qualifying Quiz"},{weekNumber:8,weekTitle:"Week 8: High-Difficulty Shift Question Mastery",goals:["Attempt toughest 10% questions from past shifts in Quant & Reasoning","Intensive Vocab and Cloze test revision","Target score threshold: 155+ in UR category"],suggestedDailyHours:8,milestoneTest:"Advanced Full-Length Mock Test #06"}]},{phaseNumber:3,phaseTitle:"Phase 3: Final 14-Day Exam Conditioning & Revision (Weeks 9 to 12)",durationWeeks:4,focusArea:"Calm mental conditioning, formula handbook drills, current affairs roundups, and zero new theory.",weeklySchedule:[{weekNumber:9,weekTitle:"Week 9: Comprehensive Formula & Rule Drills",goals:["Revise all Quant arithmetic and geometry formulas twice","Review 500 rule notes from English error notebook","Daily 1 mock test in morning shift matching real exam slot"],suggestedDailyHours:6,milestoneTest:"Pre-Exam Mock Test #07"},{weekNumber:10,weekTitle:"Week 10: Current Affairs & Static GK Marathon",goals:["Review 12-month Current Affairs compendium (Sports, Awards, Summits, Appointments)","Quick-fire revision of Articles, Amendments and History battles","Take Mock #08"],suggestedDailyHours:6,milestoneTest:"Pre-Exam Mock Test #08"},{weekNumber:11,weekTitle:"Week 11: Exam Simulation & Time Management Polish",goals:["Final 2 mock tests strictly adhering to question skipping strategy","Ensure negative marks stay below 4 marks per paper","Print Admit card and assemble verified photo ID proof"],suggestedDailyHours:5,milestoneTest:"Final Confidence Booster Mock Test"},{weekNumber:12,weekTitle:"Week 12: Light Revision & Rest before Exam Day",goals:["Review quick formula cheat-sheets only","No heavy mocks in last 48 hours to prevent mental fatigue","Sleep 8 hours, stay hydrated, and verify exam center location"],suggestedDailyHours:4,milestoneTest:"Ready for SSC CGL Tier-1 Exam Hall"}]}]},{id:"TRACK_180_DAYS",name:"180-Day Comprehensive Foundation",subtitle:"Complete zero-to-advanced mastery roadmap for first-time aspirants (4-5 hours/day)",targetDailyHours:5,suitableFor:"First-time graduate applicants and college final-year students preparing systematically over 6 months.",dailyTimetable:[{timeSlot:"07:00 – 09:00 (2 hrs)",activity:"Concept Learning & Notes",focus:"Fundamental theory chapters in Quant or English"},{timeSlot:"11:00 – 12:30 (1.5 hrs)",activity:"Topic-wise Question Practice",focus:"50-60 graded practice questions (Easy to Hard)"},{timeSlot:"17:00 – 18:00 (1 hr)",activity:"General Awareness & Newspaper",focus:"Static GK chapter + Daily Editorial / Current Affairs"},{timeSlot:"19:30 – 20:30 (1 hr)",activity:"Reasoning & Logic Drill",focus:"30 questions across verbal & non-verbal reasoning"}],phases:[{phaseNumber:1,phaseTitle:"Phase 1: Basic Foundations & Concept Building (Months 1 & 2)",durationWeeks:8,focusArea:"Building thorough subject clarity across NCERT Class 9-10 Mathematics, English Grammar fundamentals, and General Awareness basics.",weeklySchedule:[{weekNumber:1,weekTitle:"Weeks 1-4: Basic Mathematics & English Grammar Rules",goals:["Master calculation tables up to 30, squares up to 50, cubes up to 30","Complete Percentages, Ratios, Averages and Profit & Loss","Grammar parts of speech: Nouns, Pronouns, Verbs, Adjectives, Adverbs"],suggestedDailyHours:4,milestoneTest:"Monthly Concept Benchmark Test #01"},{weekNumber:2,weekTitle:"Weeks 5-8: Advanced Mathematics & Indian Polity Foundations",goals:["Algebraic identities and linear/quadratic equations","Trigonometric ratios and identities","Indian Constitution: Preamble, Fundamental Rights, Parliament and Judiciary"],suggestedDailyHours:5,milestoneTest:"Monthly Concept Benchmark Test #02"}]},{phaseNumber:2,phaseTitle:"Phase 2: Intermediate Topic Mastery & PYQ Drilling (Months 3 & 4)",durationWeeks:8,focusArea:"Solving chapter-wise previous 5 years questions and mastering speed calculation shortcuts.",weeklySchedule:[{weekNumber:3,weekTitle:"Weeks 9-12: Geometry, Mensuration & Modern History",goals:["Comprehensive Geometry: Triangle theorems, circles, quadrilaterals","2D & 3D Mensuration formulas and derivations","Ancient, Medieval and Modern Indian History chronology"],suggestedDailyHours:5,milestoneTest:"Mid-Term Comprehensive Mock #01"},{weekNumber:4,weekTitle:"Weeks 13-16: General Science, Geography & Full Vocab Builder",goals:["Physics, Chemistry and Biology standard textbook topics","Indian & World Geography: Rivers, Climate, Agriculture and Mineral maps","1000 high-frequency SSC vocabulary words"],suggestedDailyHours:5,milestoneTest:"Mid-Term Comprehensive Mock #02"}]},{phaseNumber:3,phaseTitle:"Phase 3: Full-Length Mocks & Tier-2 Dual Preparation (Months 5 & 6)",durationWeeks:8,focusArea:"Full CBT mocks, Computer Knowledge Test preparation, Typing practice, and Tier 2 high-level questions.",weeklySchedule:[{weekNumber:5,weekTitle:"Weeks 17-20: Tier-1 Intensive Mock Sprint & Typing Drills",goals:["2 full mocks per week with 2-hour post-mock analysis","Daily 20 mins keyboard typing practice (Target 30 WPM)","Computer Knowledge fundamentals (MS Office, Networking, Security)"],suggestedDailyHours:5,milestoneTest:"Full-Length Tier-1 Mock #07"},{weekNumber:6,weekTitle:"Weeks 21-24: Final 30-Day Peak Conditioning",goals:["Solve 10 actual past shift papers","Target 160+ marks in Tier-1 practice tests","Final formula sheets and mistake log consolidation"],suggestedDailyHours:6,milestoneTest:"Pre-Exam Grand All-India Mock Test"}]}]},{id:"TRACK_WORKING_PRO",name:"Working Professional 3-Hours/Day Track",subtitle:"Smart high-yield efficiency roadmap tailored for working candidates (2.5 - 3.5 hours/day + Weekend Deep Sprints)",targetDailyHours:3,suitableFor:"Employed individuals balancing full-time jobs with weekend study surges.",dailyTimetable:[{timeSlot:"06:00 – 07:30 (1.5 hrs Morning)",activity:"High-Focus Quantitative Aptitude",focus:"30 difficult questions + formula revision when mind is fresh"},{timeSlot:"Lunch Break / Commute (30 mins)",activity:"Mobile Vocab & Current Affairs Flashcards",focus:"Quick 30 vocab words / Daily current affairs digest"},{timeSlot:"21:00 – 22:30 (1.5 hrs Evening)",activity:"Reasoning or English Practice",focus:"Sectional test + review"},{timeSlot:"Saturday / Sunday (6-8 hrs)",activity:"Weekend Deep Sprint",focus:"2 Full-length CBT mocks + in-depth weak area revision"}],phases:[{phaseNumber:1,phaseTitle:"Phase 1: High-Yield Core Focus (Weeks 1 to 8)",durationWeeks:8,focusArea:"Prioritizing only the top 80% scoring areas across all 4 subjects to maximize ROI per study hour.",weeklySchedule:[{weekNumber:1,weekTitle:"Weeks 1-4: Arithmetic & English Grammar Essentials",goals:["Complete Percentage, Profit & Loss, Ratio, Time & Work","Subject-Verb Agreement, Tenses, Preposition rules","Weekend: 2 Sectional Mocks"],suggestedDailyHours:3,milestoneTest:"Weekend Sectional Test (Quant + English)"},{weekNumber:2,weekTitle:"Weeks 5-8: Algebra, Geometry & High-Yield Polity/Science",goals:["Algebra x+1/x patterns, Basic Triangle & Circle geometry","Constitution Articles 1-51A, Fundamental Rights, Science basics","Weekend: Full Tier-1 Mock"],suggestedDailyHours:3,milestoneTest:"Weekend Full Mock #01"}]},{phaseNumber:2,phaseTitle:"Phase 2: Weekend Mock Marathons & Error Analysis (Weeks 9 to 16)",durationWeeks:8,focusArea:"Using weekends for rigorous full-length CBT tests and weekdays for targeted error remediation.",weeklySchedule:[{weekNumber:3,weekTitle:"Weeks 9-16: Consistent Weekend Mock Testing",goals:["Attempt 2 full mocks every weekend (Total 16 mocks)","Maintain strict mistake notebook for commute revisions","Practice 15 mins typing on weekends"],suggestedDailyHours:3,milestoneTest:"Weekend Pro Mock Series"}]}]}],practiceQuestions:[{id:"pyq-cgl-2024-q1",topicId:"syl-quant-arithmetic",subject:"Quantitative Aptitude",topicName:"Arithmetic: Profit & Loss and Successive Discounts",tier:"TIER_1",shiftInfo:"SSC CGL 2024 Tier-1 (Shift 2, 12-Sep-2024)",questionType:"OFFICIAL_PYQ",year:2024,difficulty:"MEDIUM",questionText:"A shopkeeper marks an article at 40% above its cost price and allows a discount of 20% on the marked price. In addition, during a festival sale, he offers an additional cash discount of 5% on the discounted price. If the cost price of the article is ₹1,500, what is the shopkeeper's net profit or loss in rupees?",options:[{id:0,text:"Profit of ₹96"},{id:1,text:"Profit of ₹144"},{id:2,text:"Profit of ₹180"},{id:3,text:"Loss of ₹72"}],correctOptionIndex:0,explanation:`Step 1: Cost Price (CP) = ₹1,500.
Step 2: Marked Price (MP) = 1500 × (1 + 0.40) = 1500 × 1.40 = ₹2,100.
Step 3: First discounted price after 20% discount = 2100 × (1 - 0.20) = 2100 × 0.80 = ₹1,680.
Step 4: Selling Price (SP) after additional 5% cash discount = 1680 × (1 - 0.05) = 1680 × 0.95 = ₹1,596.
Step 5: Net Profit = SP - CP = ₹1,596 - ₹1,500 = ₹96 Profit.
Hence, Option A (Profit of ₹96) is correct.`,provenance:_},{id:"pyq-cgl-2024-q2",topicId:"syl-quant-algebra",subject:"Quantitative Aptitude",topicName:"Algebra: Symmetric Identities (x + 1/x)",tier:"TIER_1",shiftInfo:"SSC CGL 2024 Tier-1 (Shift 1, 14-Sep-2024)",questionType:"OFFICIAL_PYQ",year:2024,difficulty:"EASY",questionText:"If x + (1 / x) = 4, where x > 0, find the value of x⁴ + (1 / x⁴).",options:[{id:0,text:"194"},{id:1,text:"196"},{id:2,text:"142"},{id:3,text:"144"}],correctOptionIndex:0,explanation:`Step 1: Using identity (x + 1/x)² = x² + 1/x² + 2:
x² + 1/x² = 4² - 2 = 16 - 2 = 14.
Step 2: Squaring again:
(x² + 1/x²)² = x⁴ + 1/x⁴ + 2
14² = x⁴ + 1/x⁴ + 2
196 = x⁴ + 1/x⁴ + 2
x⁴ + 1/x⁴ = 196 - 2 = 194.
Hence, Option A (194) is the correct answer.`,provenance:_},{id:"pyq-cgl-2024-q3",topicId:"syl-ga-polity",subject:"General Awareness",topicName:"Indian Polity: Constitutional Articles",tier:"TIER_1",shiftInfo:"SSC CGL 2024 Tier-1 (Shift 3, 16-Sep-2024)",questionType:"OFFICIAL_PYQ",year:2024,difficulty:"EASY",questionText:"Which Article of the Constitution of India provides that the law declared by the Supreme Court shall be binding on all courts within the territory of India?",options:[{id:0,text:"Article 141"},{id:1,text:"Article 142"},{id:2,text:"Article 136"},{id:3,text:"Article 124"}],correctOptionIndex:0,explanation:`Article 141 of the Constitution of India explicitly mandates: "The law declared by the Supreme Court shall be binding on all courts within the territory of India."
• Article 142 deals with enforcement of decrees and orders of Supreme Court to do complete justice.
• Article 136 deals with Special Leave to Appeal (SLP).
• Article 124 deals with establishment and constitution of the Supreme Court.`,provenance:_},{id:"pyq-cgl-2024-q4",topicId:"syl-eng-grammar",subject:"English Comprehension",topicName:"Grammar: Error Spotting & Subject-Verb Agreement",tier:"TIER_1",shiftInfo:"SSC CGL 2024 Tier-1 (Shift 2, 18-Sep-2024)",questionType:"OFFICIAL_PYQ",year:2024,difficulty:"MEDIUM",questionText:`Identify the segment in the sentence which contains a grammatical error:

"Neither the team captain (A) / nor the members of the committee (B) / was present at the annual prize distribution ceremony (C) / yesterday evening (D)."`,options:[{id:0,text:"was present at the annual prize"},{id:1,text:"Neither the team captain"},{id:2,text:"nor the members of the committee"},{id:3,text:"yesterday evening"}],correctOptionIndex:0,explanation:`Rule: When two subjects are joined by "neither... nor", "either... or", or "not only... but also", the verb must agree in number with the NEARER subject.

Correct Sentence: "Neither the team captain nor the members of the committee were present..."

Conclusions: I. Some books are pens. II. No marker is a pen. III. Some papers are not markers.`,options:["Only II and III follow","Only I follows","Only I and III follow","All follow"],correct:0,exp:"Conclusion II follows directly from statement 3 (contrapositive). Conclusion III follows since pens that are papers cannot be markers."},{topic:"Analogy & Classification",text:"Select the related word from the given alternatives: Epistemology : Knowledge :: Ontology : ?",options:["Being / Reality","History","Language","Plants"],correct:0,exp:"Epistemology is the philosophical study of Knowledge. Ontology is the philosophical study of Being and Reality."},{topic:"Coded Blood Relations",text:"If A + B means A is the father of B; A - B means A is the wife of B; A × B means A is the brother of B; then in P + Q × R - S, how is P related to S?",options:["Wife's Father (Father-in-law)","Father","Brother-in-law","Uncle"],correct:0,exp:"P is father of Q. Q is brother of R. R is wife of S. Thus, P is the father of S’s wife (Father-in-law)."},{topic:"Number Series & Missing Terms",text:"Find the missing number in the series: 7, 11, 19, 35, 67, ?",options:["131","129","135","140"],correct:0,exp:"Pattern: × 2 - 3. 7×2-3=11, 11×2-3=19, 19×2-3=35, 35×2-3=67, 67×2-3=131."},{topic:"Mirror & Water Images",text:'Select the correct mirror image of the given alphanumeric combination when the mirror is placed on the right (MN): "SSC2026"',options:["6202CSS (reversed)","CSS2026","6202SSC","SSC6202"],correct:0,exp:"Mirror reflection reverses left-to-right ordering and inverts individual glyphs."},{topic:"Dice & Cube Projections",text:"Two positions of a standard dice are shown. Which number is opposite to the face showing 4?",options:["3","2","5","1"],correct:0,exp:"In a standard fair dice, the sum of opposite faces is always 7. Hence opposite of 4 is 7 - 4 = 3."},{topic:"Direction Sense & Vectors",text:"A person walks 15m North, turns right and walks 20m, then turns right again and walks 15m. In which direction and distance is he from the starting point?",options:["20m East","20m West","15m East","35m North-East"],correct:0,exp:"Vertical displacements cancel (+15 -15 = 0). Horizontal displacement = 20m East."},{topic:"Mathematical Operators & BODMAS",text:'If "+" means "÷", "-" means "×", "×" means "+", and "÷" means "-", find value of: 36 + 6 - 3 × 8 ÷ 4',options:["22","24","18","20"],correct:0,exp:"Substitute operators: 36 ÷ 6 × 3 + 8 - 4 = 6 × 3 + 8 - 4 = 18 + 8 - 4 = 22."},{topic:"Venn Diagrams",text:"Which Venn diagram best represents the relationship between: Reptiles, Lizards, and Mammals?",options:["Lizards enclosed in Reptiles, Mammals completely separate","Three intersecting circles","All concentric circles","All separate circles"],correct:0,exp:"All lizards are reptiles (complete subset). Mammals belong to a distinct biological class with zero overlap."},{topic:"Statement & Assumptions",text:`Statement: "Use electric vehicles to reduce urban air pollution."

 annually to eligible farmer families in three equal instalments?",options:["₹6,000 per year","₹10,000 per year","₹8,000 per year","₹12,000 per year"],correct:0,exp:"PM-KISAN provides ₹6,000 per year in 3 equal instalments of ₹2,000 each directly into bank accounts."}],Jl=[{topic:"Arithmetic: Profit, Loss & Discount",text:"A dealer marks his goods 40% above the cost price and allows a discount of 20% on the marked price. Furthermore, he gives an additional cash discount of 5%. What is his net profit percentage?",options:["6.4%","8.0%","5.0%","7.2%"],correct:0,exp:"Let CP = 100. MP = 140. After 20% discount: 140 × 0.80 = 112. After 5% cash discount: 112 × 0.95 = 106.4. Net Profit = 106.4 - 100 = 6.4%."},{topic:"Algebra: Symmetric Polynomials (x + 1/x)",text:"If x + 1/x = 5, find the exact numerical value of x³ + 1/x³.",options:["110","125","115","140"],correct:0,exp:"Formula: x³ + 1/x³ = (x + 1/x)³ - 3(x + 1/x) = 5³ - 3(5) = 125 - 15 = 110."},{topic:"Geometry: Circle Tangents & Secants",text:"Two circles of radii 9 cm and 4 cm have their centers 13 cm apart. What is the length of their Direct Common Tangent (DCT)?",options:["12 cm","10 cm","11.5 cm","14 cm"],correct:0,exp:"Formula: DCT = √(d² - (r₁ - r₂)²) = √(13² - (9 - 4)²) = √(169 - 25) = √144 = 12 cm."},{topic:"Trigonometry: Heights & Distances",text:"If sin θ + cos θ = √2 cos θ, find the value of cos θ - sin θ.",options:["√2 sin θ","√2 cos θ","sin θ","1"],correct:0,exp:"Formula: If a sin θ + b cos θ = c, then b sin θ - a cos θ = √(a² + b² - c²). Here a=1, b=1, c=√2 cos θ. Result = √(1 + 1 - 2 cos²θ) = √(2 sin²θ) = √2 sin θ."},{topic:"Arithmetic: Time & Work (Efficiency)",text:"A is twice as efficient as B and together they can complete a piece of work in 18 days. In how many days can A alone finish the work?",options:["27 days","36 days","24 days","54 days"],correct:0,exp:"Efficiency ratio A : B = 2 : 1. Total daily work = 3 units. Total work = 18 × 3 = 54 units. Time for A = 54 / 2 = 27 days."},{topic:"Arithmetic: Simple & Compound Interest",text:"The difference between Compound Interest (compounded annually) and Simple Interest on a principal sum P at 10% per annum for 2 years is ₹65. What is the value of P?",options:["₹6,500","₹6,000","₹7,200","₹5,500"],correct:0,exp:"Formula: CI - SI for 2 years = P(R/100)² ⇒ 65 = P(10/100)² ⇒ 65 = P(1/100) ⇒ P = ₹6,500."},{topic:"Mensuration: 3D Solids (Cylinder & Cone)",text:"A solid metallic sphere of radius 6 cm is melted and recast into a right circular cone of base radius 6 cm. What is the height of the cone?",options:["24 cm","18 cm","12 cm","36 cm"],correct:0,exp:"Volume of Sphere = Volume of Cone ⇒ (4/3)πr³ = (1/3)πR²h ⇒ 4 × 6³ = 6² × h ⇒ 4 × 216 = 36 × h ⇒ h = 24 cm."},{topic:"Arithmetic: Speed, Time & Distance (Trains)",text:"A train 180 meters long travelling at 72 km/h completely crosses a platform in 20 seconds. What is the length of the platform?",options:["220 meters","200 meters","250 meters","180 meters"],correct:0,exp:"Speed = 72 × (5/18) = 20 m/s. Total distance = Speed × Time = 20 × 20 = 400m. Platform length = 400 - 180 = 220 meters."},{topic:"Arithmetic: Mixtures & Alligation",text:"In what ratio must water be mixed with milk costing ₹40 per litre so that by selling the mixture at ₹40 per litre there is a profit of 25%?",options:["1 : 4","1 : 5","2 : 5","1 : 3"],correct:0,exp:"Profit 25% means for every 4 parts of milk, 1 part of free water is added. Ratio of Water : Milk = 1 : 4."},{topic:"Statistics & Data Interpretation",text:"Find the median of the following set of observation data: 18, 12, 25, 14, 30, 22, 16.",options:["18","16","20","22"],correct:0,exp:"Sort in ascending order: 12, 14, 16, 18, 22, 25, 30. Total terms N = 7 (odd). Median = ((7+1)/2)th term = 4th term = 18."}],Xl=[{topic:"Grammar: Subject-Verb Agreement",text:'Identify the segment containing an error: "Neither the principal (A) / nor the teachers (B) / was in favor of (C) / postponing the examination (D)."',options:["was in favor of","Neither
