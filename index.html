<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GovOS — India's Exam & Career Navigation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        /* page + surfaces (token names kept for the inline styles that reference them) */
        --bg-dark: #f4f7fb;
        --bg-card: #ffffff;
        --bg-card-hover: #fbfcfe;
        --bg-card-solid: #ffffff;
        --bg-input: #f3f6fb;
        --surface-2: #f6f8fc;
        --surface-3: #eef2f8;
        --border-color: #e6eaf2;
        --border-highlight: rgba(47, 107, 255, 0.35);

        --text-primary: #0f172a;
        --text-secondary: #526079;
        --text-muted: #8a94a8;

        --primary: #2f6bff;
        --primary-soft: #eaf0ff;
        --primary-glow: rgba(47, 107, 255, 0.22);
        --emerald: #16a34a;
        --emerald-soft: #e8f7ee;
        --emerald-glow: rgba(22, 163, 74, 0.22);
        --amber: #d97706;
        --amber-soft: #fff4e0;
        --amber-glow: rgba(217, 119, 6, 0.22);
        --rose: #e11d48;
        --rose-soft: #fde8ec;
        --rose-glow: rgba(225, 29, 72, 0.22);
        --cyan: #0891b2;
        --purple: #7c3aed;

        --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-full: 9999px;

        --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 30px -18px rgba(15, 23, 42, 0.18);
        --shadow-glow: 0 8px 24px -10px var(--primary-glow);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #f8fafc;
        color: var(--text-primary);
        font-family: var(--font-sans);
        min-height: 100vh;
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cfd6e3; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #b7c0d1; }

      a { color: var(--primary); text-decoration: none; transition: all 0.2s ease; }
      a:hover { text-decoration: underline; }

      /* Cards (class name kept from the previous theme) */
      .glass-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: var(--shadow-card);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .glass-card:hover { border-color: #d8dfec; }

      .glass-pill {
        background: var(--surface-2);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-full);
        padding: 4px 12px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* Buttons */
      .btn {
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 0.95rem;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.18s ease;
        line-height: 1.2;
      }
      .btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-glow); }
      .btn-primary:hover { background: #245ae6; transform: translateY(-1px); }
      .btn-emerald { background: var(--emerald); color: #fff; box-shadow: 0 8px 24px -10px var(--emerald-glow); }
      .btn-emerald:hover { background: #15803d; transform: translateY(-1px); }
      .btn-secondary { background: #fff; color: var(--text-primary); border: 1px solid var(--border-color); }
      .btn-secondary:hover { background: var(--surface-2); border-color: #d3dbe8; }
      .btn-outline { background: transparent; color: var(--primary); border: 1px solid rgba(47, 107, 255, 0.45); }
      .btn-outline:hover { background: var(--primary-soft); }
      .btn-amber { background: var(--amber-soft); color: #92400e; border: 1px solid rgba(217, 119, 6, 0.35); }

      /* Badges: light tints, dark text */
      .badge {
        padding: 4px 10px;
        border-radius: var(--radius-full);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        line-height: 1.3;
      }
      .badge-verified { background: var(--emerald-soft); color: #15803d; border: 1px solid rgba(22, 163, 74, 0.25); }
      .badge-changed { background: var(--amber-soft); color: #b45309; border: 1px solid rgba(217, 119, 6, 0.3); }
      .badge-pending { background: #e6f6fb; color: #0e7490; border: 1px solid rgba(8, 145, 178, 0.3); }
      .badge-superseded { background: var(--rose-soft); color: #be123c; border: 1px solid rgba(225, 29, 72, 0.3); }
      .badge-demo { background: #f1ebfe; color: #6d28d9; border: 1px solid rgba(124, 58, 237, 0.3); }

      /* Layout */
      .app-container { max-width: 1400px; margin: 0 auto; padding: 14px 28px 48px; }

      /* Top bar */
      .topbar {
        position: relative;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid #e2e8f0;
        border-radius: 9999px;
        box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.04);
        padding: 8px 24px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: nowrap;
      }
      .topbar nav { flex: 1; min-width: 0; overflow-x: auto; flex-wrap: nowrap !important; scrollbar-width: none; }
      .topbar nav::-webkit-scrollbar { display: none; }
      .brand { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; color: var(--primary); cursor: pointer; }
      .nav-link {
        font-family: var(--font-sans);
        font-size: 0.9rem;
        font-weight: 500;
        color: #334155;
        background: transparent;
        border: none;
        border-radius: 9999px;
        padding: 6px 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: all 0.15s ease;
      }
      .nav-link:hover { background: #f1f5f9; color: #0f172a; }
      .nav-link.active { background: #f1f5f9; color: #2563eb; font-weight: 600; }
      .nav-link.subtle { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
      .avatar {
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--primary); color: #fff; font-weight: 800; font-size: 0.9rem;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .icon-btn {
        width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border-color);
        background: #fff; color: var(--text-secondary); display: inline-flex; align-items: center;
        justify-content: center; cursor: pointer; position: relative;
      }

      /* Hero: natural, seamless landing page integration with frosted glass */
      .hero {
        position: relative;
        background: rgba(255, 255, 255, 0.76);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 24px;
        box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.08), 0 2px 8px rgba(15, 23, 42, 0.03);
        padding: 48px 48px 44px;
        min-height: 420px;
        display: flex;
        align-items: center;
        overflow: hidden;
        isolation: isolate;
      }
      .hero-content,
      .hero > div:first-child {
        position: relative;
        z-index: 2;
        max-width: 540px;
        width: 100%;
      }
      .hero h1 {
        font-size: 2.65rem;
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text-primary);
      }
      .hero h1 .accent { color: var(--primary); }
      .hero-art {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 65%;
        z-index: 1;
        margin: 0;
        pointer-events: none;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to right,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.03) 12%,
          rgba(0, 0, 0, 0.25) 28%,
          rgba(0, 0, 0, 0.75) 48%,
          rgba(0, 0, 0, 0.96) 65%,
          #000000 78%
        );
        mask-image: linear-gradient(to right,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.03) 12%,
          rgba(0, 0, 0, 0.25) 28%,
          rgba(0, 0, 0, 0.75) 48%,
          rgba(0, 0, 0, 0.96) 65%,
          #000000 78%
        );
      }
      .hero-art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 84% 54%;
      }
      /* Soft atmospheric mist blending the image edges smoothly into the card surface */
      .hero-art::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(to right, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.2) 30%, rgba(255, 255, 255, 0) 55%),
          linear-gradient(to top, rgba(246, 249, 255, 0.35) 0%, transparent 25%);
      }
      @media (max-width: 1100px) {
        .hero-art { width: 58%; }
        .hero-content,
        .hero > div:first-child { max-width: 480px; }
      }
      @media (max-width: 900px) {
        .hero {
          flex-direction: column;
          align-items: stretch;
          padding: 36px 24px 0;
          min-height: 0;
        }
        .hero-content,
        .hero > div:first-child {
          max-width: none;
          margin-bottom: 8px;
        }
        .hero-art {
          position: relative;
          width: calc(100% + 48px);
          height: 250px;
          margin: 16px -24px 0;
          -webkit-mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.3) 15%,
            rgba(0, 0, 0, 0.85) 35%,
            #000000 50%
          );
          mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.3) 15%,
            rgba(0, 0, 0, 0.85) 35%,
            #000000 50%
          );
        }
        .hero-art img { object-position: 78% 54%; }
        .hero-art::after {
          background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9) 0%, transparent 40%);
        }
      }
      .search-bar {
        display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #d6deea;
        border-radius: 14px; padding: 6px 6px 6px 16px; box-shadow: 0 2px 6px rgba(15,23,42,0.04);
      }
      .search-bar input { flex: 1; border: none; outline: none; font-family: var(--font-sans); font-size: 1rem; color: var(--text-primary); background: transparent; }
      .search-bar input::placeholder { color: var(--text-muted); }
      .chip {
        background: #fff; border: 1px solid var(--border-color); color: var(--text-secondary);
        border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans);
      }
      .chip:hover { border-color: var(--primary); color: var(--primary); }

      .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
      .feature-card {
        background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 20px;
        box-shadow: var(--shadow-card); cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; text-align: left;
        font-family: var(--font-sans);
      }
      .feature-card:hover { transform: translateY(-2px); border-color: #cfd9ee; }
      .feature-icon { width: 46px; height: 46px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
      .feature-card h4 { font-size: 1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
      .feature-card p { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.45; }

      .quote-strip {
        display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
        background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 22px 26px; box-shadow: var(--shadow-card);
      }
      @media (max-width: 700px) { .quote-strip { grid-template-columns: 1fr; } }

      /* Exam page: independent dual-pane separate scrolling layout */
      .exam-layout {
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr);
        gap: 20px;
        align-items: stretch;
      }

      /* Desktop: sidebar and content each have independent, separate scroll areas */
      @media (min-width: 961px) {
        .exam-layout {
          height: calc(100vh - 110px);
          height: calc(100dvh - 110px);
          min-height: 520px;
        }

        .side-nav {
          height: 100%;
          max-height: 100%;
          overflow-y: auto;
          overflow-x: hidden;
          overscroll-behavior: contain;
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 14px;
          scrollbar-width: thin;
          scrollbar-color: #cfd6e3 transparent;
        }

        .exam-main-content {
          height: 100%;
          max-height: 100%;
          overflow-y: auto;
          overflow-x: hidden;
          overscroll-behavior: contain;
          padding-right: 6px;
          scrollbar-width: thin;
          scrollbar-color: #cfd6e3 transparent;
        }
      }

      /* Mobile: natural stacked layout with scrollable sidebar tray */
      @media (max-width: 960px) {
        .exam-layout {
          grid-template-columns: 1fr;
          height: auto;
          gap: 16px;
        }
        .side-nav {
          max-height: 380px;
          overflow-y: auto;
          overflow-x: hidden;
          margin-bottom: 8px;
          padding: 14px;
        }
        .exam-main-content {
          overflow-y: visible;
          padding-right: 0;
        }
      }

      /* Keep sidebar buttons from shrinking so full list scrolls seamlessly */
      .side-nav > * {
        flex-shrink: 0;
      }

      .side-link {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: none; background: transparent;
        color: var(--text-secondary); font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: left; width: 100%;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }
      .side-link:hover { background: var(--surface-2); color: var(--text-primary); }
      .side-link.active { background: var(--primary-soft); color: var(--primary); }
      .side-link.minor { font-size: 0.82rem; font-weight: 500; padding: 7px 12px; }
      .side-heading { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 10px 12px 4px; flex-shrink: 0; }

      /* Sleek scrollbars for both independently scrolling panes */
      .side-nav::-webkit-scrollbar,
      .exam-main-content::-webkit-scrollbar {
        width: 6px;
      }
      .side-nav::-webkit-scrollbar-track,
      .exam-main-content::-webkit-scrollbar-track {
        background: transparent;
      }
      .side-nav::-webkit-scrollbar-thumb,
      .exam-main-content::-webkit-scrollbar-thumb {
        background: #cfd6e3;
        border-radius: 6px;
      }
      .side-nav::-webkit-scrollbar-thumb:hover,
      .exam-main-content::-webkit-scrollbar-thumb:hover {
        background: #b7c0d1;
      }
      .stat-tile {
        background: #fff; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center;
        box-shadow: var(--shadow-card);
      }
      .stat-tile .tile-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .stat-tile .tile-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
      .stat-tile .tile-value { font-size: 1rem; color: var(--text-primary); font-weight: 800; }
      .exam-logo {
        width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #ffe7c2, #ffd08a); color: #7c2d12;
        display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.02em; flex-shrink: 0;
      }
      .exam-banner {
        border-radius: 16px; padding: 26px 30px; min-height: 130px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
        background:
          radial-gradient(circle at 85% 30%, #ffe7c2 0%, transparent 30%),
          linear-gradient(120deg, #eaf1ff 0%, #f6f9ff 50%, #e9f3e6 100%);
        border: 1px solid var(--border-color);
      }
      .info-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
      .info-row:last-child { border-bottom: none; }
      .info-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

      /* Stepper (kept) */
      .stepper-container { display: flex; align-items: center; justify-content: space-between; gap: 8px; overflow-x: auto; padding: 16px 8px; margin-bottom: 24px; }
      .step-item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 90px; cursor: pointer; opacity: 0.7; transition: all 0.2s ease; }
      .step-item.active { opacity: 1; }
      .step-number { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
      .step-item.active .step-number { border-color: var(--primary); background: var(--primary); color: white; }
      .step-item.completed .step-number { border-color: var(--emerald); background: var(--emerald); color: white; }
      .step-title { font-size: 0.75rem; font-weight: 600; text-align: center; white-space: nowrap; }

      .corrigendum-bar {
        background: var(--amber-soft);
        border: 1px solid rgba(217, 119, 6, 0.35);
        border-radius: var(--radius-md);
        padding: 14px 20px; margin-bottom: 20px;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
      }

      /* Modals */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px;
      }
      .modal-content {
        background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-lg);
        max-width: 650px; width: 100%; padding: 28px; box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.35);
        position: relative; max-height: 90vh; overflow-y: auto;
      }

      .taxonomy-tag { font-family: var(--font-mono); font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
      .taxonomy-fact { background: var(--emerald-soft); color: #15803d; }
      .taxonomy-interp { background: #e8f0ff; color: #1d4ed8; }
      .taxonomy-explain { background: #f1ebfe; color: #6d28d9; }
      .taxonomy-recom { background: var(--amber-soft); color: #b45309; }

      .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
      .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }

      input, select, textarea { font-family: var(--font-sans); }
      input[type="text"], input[type="number"], input[type="email"], input[type="date"], select, textarea { color: var(--text-primary); }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes pulseTrickGlow {
        0% { box-shadow: 0 0 12px rgba(217, 119, 6, 0.18); border-color: rgba(217, 119, 6, 0.4); }
        50% { box-shadow: 0 0 22px rgba(217, 119, 6, 0.35); border-color: rgba(217, 119, 6, 0.8); }
        100% { box-shadow: 0 0 12px rgba(217, 119, 6, 0.18); border-color: rgba(217, 119, 6, 0.4); }
      }
      .trick-card-animated { animation: pulseTrickGlow 2.5s infinite ease-in-out; }
      @keyframes shimmerEffect { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      .shimmer-badge { position: relative; overflow: hidden; }
      .shimmer-badge::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shimmerEffect 2s infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin { animation: spin 1s linear infinite; }

      /* ===================================================
         GOVOS HOMEPAGE — SINGLE CONTINUOUS HERO ENVIRONMENT
         =================================================== */

      @keyframes govosBlueFloat {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(18px, 12px, 0) scale(1.04);
        }
        100% {
          transform: translate3d(-10px, 8px, 0) scale(0.98);
        }
      }

      @keyframes govosGoldFloat {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(-14px, 12px, 0) scale(1.04);
        }
        100% {
          transform: translate3d(8px, -8px, 0) scale(0.98);
        }
      }

      @keyframes govosTealFloat {
        0% {

        /* One subtle base gradient + maximum two very soft ambient glow areas */

          radial-gradient(
            ellipse 60% 55% at 8% 22%,
            rgba(219, 234, 254, 0.48) 0%,
            rgba(224, 231, 255, 0.18) 42%,
            transparent 70%
          ),
          /* 2. Soft warm gold ambient glow (upper right) */
          radial-gradient(
            ellipse 52% 50% at 94% 18%,
            rgba(254, 243, 199, 0.38) 0%,
            rgba(253, 230, 138, 0.14) 40%,
            transparent 68%

          /* Subtle base ambient gradient */
          linear-gradient(
            180deg,
            #f9fbff 0%,
            #f6f9fe 55%,
            transparent 100%
          );

        -webkit-mask-image:
          linear-gradient(
            to bottom,
            #000 0%,
            #000 82%,
            transparent 100%
          );

        mask-image:
          linear-gradient(
            to bottom,
            #000 0%,
            #000 82%,
            transparent 100%

      /* actual illustration */

      .hero-art-seamless img {
        position: relative;

        z-index: 1;

        width: 100%;

        max-width: 680px;

        object-fit: cover;

        object-position: 84% 54%;

        /*
          THIS IS THE IMPORTANT PART.

          The image fades mainly from the LEFT

        -webkit-mask-image:
          linear-gradient(
            to right,
            transparent 0%,
            rgba(0, 0, 0, 0.08) 8%,

            #000 52%,
            #000 100%
          );

        -webkit-mask-composite: source-over;
        mask-composite: add;

        filter:
          saturate(1.02)

      /* soft integration layer */

      .hero-art-seamless::after {
        content: "";

      /* ===================================================
         GOVOS INTERACTIVE CANVAS PARTICLE SYSTEM
         =================================================== */
      .govos-particle-canvas {

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        // GovOS Interactive Ambient Canvas Particle System (Unified Architecture)
        let canvas = null;
        let ctx = null;
        let animId = null;
        let particles = [];
        let width = 0;
        let height = 0;
        let dpr = 1;
        let mouseX = -9999;
        let mouseY = -9999;
        let isHovering = false;
        let prefersReducedMotion = false;
        let isRunning = false;

        const COLOR_PALETTE = [
          { r: 59,  g: 130, b: 246 }, // soft blue
          { r: 96,  g: 165, b: 250 }, // light azure
          { r: 99,  g: 102, b: 241 }, // subtle indigo/purple
          { r: 129, g: 140, b: 248 }, // soft violet
          { r: 245, g: 158, b: 11  }, // warm amber/gold
          { r: 251, g: 191, b: 36  }  // gentle golden sun
        ];

        function getTargetParticleCount(w, h) {
          const widthVal = w || window.innerWidth;
          const heightVal = h || 600;
          const area = widthVal * heightVal;
          if (widthVal > 1024) {
            // Desktop: 45 to 60 particles depending on available area
            return Math.min(60, Math.max(45, Math.round(area / 16000)));
          } else if (widthVal > 640) {
            // Tablet: 25 to 35 particles
            return Math.min(35, Math.max(25, Math.round(area / 22000)));
          } else {
            // Mobile: 12 to 20 particles
            return Math.min(20, Math.max(12, Math.round(area / 28000)));
          }
        }

        function createParticle(w, h) {
          const colorObj = COLOR_PALETTE[Math.floor(Math.random() * COLOR_PALETTE.length)];
          // Slightly increased visibility: base alpha 0.30 - 0.58
          const baseAlpha = 0.30 + Math.random() * 0.28;
          const radius = 1.4 + Math.random() * 1.4;
          const angle = Math.random() * Math.PI * 2;
          const speed = 0.20 + Math.random() * 0.25;

          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;

          return {
            x: Math.random() * (w || 800),
            y: Math.random() * (h || 600),
            vx: vx,
            vy: vy,
            naturalVx: vx,
            naturalVy: vy,
            radius: radius,
            color: colorObj,
            alpha: baseAlpha,
            baseAlpha: baseAlpha,
            pulseOffset: Math.random() * Math.PI * 2,
            pulseSpeed: 0.018 + Math.random() * 0.02
          };
        }

        function initParticles() {
          const count = getTargetParticleCount(width, height);
          particles = [];
          for (let i = 0; i < count; i++) {
            particles.push(createParticle(width, height));
          }
        }

        function resize() {
          if (!canvas) return;
          const parent = canvas.parentElement;
          if (!parent) return;

          // Dynamically adjust parent height to match hero section naturally
          const heroEl = document.querySelector('.hero-seamless');
          if (heroEl) {
            const computedHeroHeight = Math.max(540, heroEl.offsetHeight + 36);
            parent.style.height = computedHeroHeight + 'px';
          }

          const rect = parent.getBoundingClientRect();
          width = rect.width || window.innerWidth;
          height = rect.height || 650;

          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);

          if (ctx) {
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }

          const targetCount = getTargetParticleCount(width, height);
          while (particles.length < targetCount) {
            particles.push(createParticle(width, height));
          }
          if (particles.length > targetCount) {
            particles.length = targetCount;
          }
        }

        function renderFrame() {
          if (!ctx || !canvas) return;

          ctx.clearRect(0, 0, width, height);

          if (prefersReducedMotion) {
            for (let i = 0; i < particles.length; i++) {
              drawParticle(particles[i]);
            }
            return;
          }

          // Clean, subtle constellation links between nearby particles
          const maxLinkDist = 65;
          ctx.lineWidth = 0.8;
          for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
              const dx = particles[i].x - particles[j].x;
              const dy = particles[i].y - particles[j].y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < maxLinkDist) {
                const linkAlpha = (1 - dist / maxLinkDist) * 0.12;
                ctx.strokeStyle = `rgba(147, 197, 253, ${linkAlpha})`;
                ctx.beginPath();
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
              }
            }
          }

          // Update & draw particles with smooth physical cursor response
          const mouseRadius = 150;
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            // Gentle natural pulsing
            p.pulseOffset += p.pulseSpeed;
            p.alpha = p.baseAlpha + Math.sin(p.pulseOffset) * 0.08;

            // Cursor proximity interaction with smooth physical deflection
            if (isHovering) {
              const dx = p.x - mouseX;
              const dy = p.y - mouseY;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < mouseRadius && dist > 0) {
                const factor = 1 - dist / mouseRadius;
                const force = factor * factor * 0.45;
                p.vx += (dx / dist) * force;
                p.vy += (dy / dist) * force;
                p.alpha = Math.min(p.baseAlpha + factor * 0.32, 0.88);
              }
            }

            // Smoothly dampen velocity back towards natural calm drift
            p.vx = p.vx * 0.95 + p.naturalVx * 0.05;
            p.vy = p.vy * 0.95 + p.naturalVy * 0.05;

            p.x += p.vx;
            p.y += p.vy;

            // Boundary wrapping
            if (p.x < -10) p.x = width + 10;
            if (p.x > width + 10) p.x = -10;
            if (p.y < -10) p.y = height + 10;
            if (p.y > height + 10) p.y = -10;

            drawParticle(p);
          }

          animId = requestAnimationFrame(renderFrame);
        }

        function drawParticle(p) {
          ctx.save();
          // Core particle
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${p.alpha})`;
          ctx.fill();

          // Delicate micro glow for soft luminescence
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * 2.2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color.r}, ${p.color.g}, ${p.color.b}, ${p.alpha * 0.22})`;
          ctx.fill();
          ctx.restore();
        }

        function handlePointerMove(e) {
          if (!canvas) return;
          const rect = canvas.getBoundingClientRect();
          mouseX = e.clientX - rect.left;
          mouseY = e.clientY - rect.top;
          isHovering = (
            mouseX >= -60 && mouseX <= rect.width + 60 &&
            mouseY >= -60 && mouseY <= rect.height + 60
          );
        }

        function handlePointerLeave() {
          isHovering = false;
          mouseX = -9999;
          mouseY = -9999;
        }

        function startAnimation() {
          if (isRunning) return;
          isRunning = true;
          if (!prefersReducedMotion) {
            animId = requestAnimationFrame(renderFrame);
          } else {
            renderFrame();
          }
        }

        function stopAnimation() {
          isRunning = false;
          if (animId) {
            cancelAnimationFrame(animId);
            animId = null;
          }
        }

        function mountCanvas() {
          const bgLayer = document.querySelector('.homepage-bg-layer');
          if (!bgLayer) {
            if (canvas && canvas.parentElement) {
              canvas.parentElement.removeChild(canvas);
            }
            stopAnimation();
            return;
          }

          if (canvas && canvas.parentElement === bgLayer) {
            if (!isRunning) startAnimation();
            return;
          }

          if (!canvas) {
            canvas = document.createElement('canvas');
            canvas.className = 'govos-particle-canvas';
            canvas.setAttribute('aria-hidden', 'true');
            ctx = canvas.getContext('2d');
          }

          bgLayer.insertBefore(canvas, bgLayer.firstChild);
          resize();
          initParticles();
          startAnimation();
        }

        const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        prefersReducedMotion = motionQuery.matches;
        motionQuery.addEventListener('change', (e) => {
          prefersReducedMotion = e.matches;
          if (prefersReducedMotion) stopAnimation();
          else startAnimation();
        });

        window.addEventListener('pointermove', handlePointerMove, { passive: true });
        window.addEventListener('pointerleave', handlePointerLeave, { passive: true });
        window.addEventListener('resize', () => {
          resize();
        }, { passive: true });

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) stopAnimation();
          else if (document.querySelector('.homepage-bg-layer')) startAnimation();
        });

        const observer = new MutationObserver(() => {
          mountCanvas();
        });

        function bootstrap() {
          mountCanvas();
          observer.observe(document.body, { childList: true, subtree: true });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', bootstrap);
        } else {
          bootstrap();
        }
      })();
    </script>
  </body>
</html>
