      .cmp-card { padding: 6px 24px 14px; }
      .cmp-matrix { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
      .cmp-matrix thead th {
        padding: 20px 16px 14px; font-family: var(--font-display); font-size: 1.05rem; letter-spacing: -0.02em; color: var(--ink);
        border-bottom: 2px solid var(--ink); vertical-align: bottom;
      }
      .cmp-matrix thead th.cmp-attr { font-family: var(--font-sans); font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted); width: 24%; }
      .cmp-dot { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 10px; vertical-align: 1px; }
      .cmp-matrix tbody th, .cmp-matrix tbody td { padding: 16px; vertical-align: top; border-bottom: 1px solid var(--hairline); font-size: 0.95rem; line-height: 1.5; color: var(--text-primary); }
      .cmp-matrix tbody th { font-weight: 700; color: var(--text-secondary); font-size: 0.9rem; }
      .cmp-matrix tbody tr { transition: background-color 0.25s var(--ease-energy); }
      .cmp-matrix tbody tr:hover { background: var(--surface-2); }
      .cmp-matrix tr.cmp-actions th, .cmp-matrix tr.cmp-actions td { border-bottom: none; }
      .cmp-matrix tr.cmp-actions:hover { background: transparent; }
      @media (max-width: 760px) {
        .vs-deck { grid-template-columns: minmax(0, 1fr); }
        .vs-disc { margin: -16px auto; }
        .vs-pass { min-height: 230px; }
        .cmp-card { padding: 4px 18px 10px; }
        .cmp-matrix, .cmp-matrix tbody, .cmp-matrix tr, .cmp-matrix th, .cmp-matrix td { display: block; width: auto; }
        .cmp-matrix thead { display: none; }
        .cmp-matrix tbody tr { padding: 16px 0; border-bottom: 1px solid var(--hairline); }
        .cmp-matrix tbody tr:hover { background: transparent; }
        .cmp-matrix tbody th, .cmp-matrix tbody td { border: none; padding: 3px 0; }
        .cmp-matrix tbody th { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); padding-bottom: 8px; }
        .cmp-matrix tbody td::before { content: attr(data-exam); display: block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--saffron-text); margin-bottom: 2px; }
        .cmp-matrix tbody td + td { margin-top: 10px; }
      }

      /* --- My Timeline: each tracked exam on its tone, its milestones as stops on a line --- */
      .tl-exam { background: #fff; border: 1px solid var(--hairline); border-radius: 28px; overflow: hidden; box-shadow: var(--shadow-card); }
      .tl-exam-head { position: relative; isolation: isolate; color: #fff; padding: clamp(20px, 3vw, 30px); display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
      .tl-exam-id { min-width: 0; flex: 1 1 380px; }
      .tl-exam-id h3 { font-family: var(--font-display); font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.3rem); letter-spacing: -0.04em; line-height: 1.04; color: #fff; margin: 6px 0 12px; }
      .tl-exam-badges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
      .tl-exam-crucial { font-size: 0.8rem; color: rgba(255, 255, 255, 0.92); }
      .tl-exam-crucial strong { color: #fff; }
      .tl-exam-next { text-align: right; display: flex; flex-direction: column; gap: 2px; min-width: 160px; }
      .tl-exam-next .exam-hero-next-label { color: rgba(255, 255, 255, 0.92); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
      .tl-exam-next-value { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; line-height: 1.05; }
      .tl-exam-next-what { font-size: 0.85rem; color: rgba(255, 255, 255, 0.88); max-width: 32ch; margin-left: auto; }
      .tl-exam-body { padding: clamp(18px, 2.6vw, 28px); }
      .tl-exam-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
      .tl-exam-bar h4 { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin: 0; }
      .tl-exam-note { padding: 14px 16px; border-radius: 14px; background: var(--surface-2); color: var(--text-secondary); font-size: 0.88rem; margin: 0 0 12px; }
      .tl-track {
        list-style: none; margin: 0; padding: 4px 2px 8px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(210px, 1fr);
        overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: thin;
      }
      .tl-stop { position: relative; padding: 32px 20px 4px 0; display: flex; flex-direction: column; gap: 3px; scroll-snap-align: start; min-width: 0; }
      .tl-stop::before { content: ''; position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--hairline); }
      .tl-stop-dot { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px var(--tag, var(--primary)); }
      .tl-stop.is-next .tl-stop-dot { background: var(--tag); box-shadow: 0 0 0 6px color-mix(in srgb, var(--tag) 18%, transparent); }
      .tl-stop.is-past .tl-stop-dot { box-shadow: inset 0 0 0 3px #c4ccda; }
      .tl-stop-type { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--tag); }
      .tl-stop-label { font-size: 0.92rem; font-weight: 700; color: var(--ink); line-height: 1.3; }
      .tl-stop-when { font-family: var(--font-display); font-size: 0.98rem; font-weight: 700; color: var(--ink); }
      .tl-stop-rel { font-size: 0.78rem; color: var(--text-secondary); }
      .tl-stop.is-past .tl-stop-type { color: var(--text-muted); }
      .tl-stop.is-past .tl-stop-label, .tl-stop.is-past .tl-stop-when { color: var(--text-secondary); }
      .tag-close { --tag: #b71f1f; } .tag-admit { --tag: #6d28d9; } .tag-exam { --tag: #a55a05; } .tag-result { --tag: #147a3a; } .tag-other { --tag: #2b62eb; }
      @media (prefers-reduced-motion: no-preference) {
        .tl-exam.rv-seen .tl-stop { animation: heroRise 0.5s var(--ease-energy) backwards; }
        .tl-exam.rv-seen .tl-stop:nth-child(2) { animation-delay: 0.07s; }
        .tl-exam.rv-seen .tl-stop:nth-child(3) { animation-delay: 0.14s; }
        .tl-exam.rv-seen .tl-stop:nth-child(n+4) { animation-delay: 0.21s; }
      }

      /* --- The all-exams calendar as a month agenda --- */
      .agenda-filters { display: flex; flex-direction: column; gap: 14px; }
      .agenda-months { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
      .agenda-months::-webkit-scrollbar { display: none; }
      .agenda-months .chip { white-space: nowrap; flex-shrink: 0; }
      .agenda-months .chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
      .agenda { padding: clamp(18px, 3vw, 32px); }
      .agenda-head h3 { font-family: var(--font-display); font-size: clamp(1.4rem, 1.1rem + 1vw, 2rem); letter-spacing: -0.035em; color: var(--ink); margin: 0 0 6px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .agenda-count { font-size: 0.9rem; padding: 2px 12px; border-radius: 999px; background: var(--ink); color: #fff; letter-spacing: 0; }
      .agenda-head p { font-size: 0.86rem; color: var(--text-secondary); margin: 0 0 18px; max-width: 72ch; }
      .agenda-month { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; padding: 18px 0; border-top: 1px solid var(--hairline); }
      .agenda-month-label { position: sticky; top: 100px; align-self: start; margin: 0; font-family: var(--font-display); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.03em; color: var(--ink); }
      .agenda-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
      .agenda-row {
        display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 14px 16px;
        border-radius: 18px; background: var(--surface-2); border: 1px solid transparent;
        transition: background-color 0.3s var(--ease-energy), border-color 0.3s var(--ease-energy), box-shadow 0.4s var(--ease-energy);
      }
      .agenda-row:hover { background: #fff; border-color: var(--hairline); box-shadow: var(--shadow-card); }
      .agenda-row.is-tracked { background: #fff; border-color: rgba(43, 98, 235, 0.3); }
      .agenda-date { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 64px; border-radius: 14px; background: #fff; box-shadow: inset 0 0 0 1px var(--hairline); padding: 6px; text-align: center; }
      .agenda-day { font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; letter-spacing: -0.05em; line-height: 1; color: var(--ink); }
      .agenda-mon { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.14em; color: var(--saffron-text); margin-top: 2px; }
      .agenda-printed { font-size: 0.72rem; font-weight: 700; color: var(--ink); line-height: 1.25; }
      .agenda-row.is-superseded .agenda-day, .agenda-row.is-superseded .agenda-printed, .agenda-row.is-superseded .agenda-label { text-decoration: line-through; color: #b71f1f; }
      .agenda-tags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 4px; }
      .agenda-exam { color: #fff; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.08em; padding: 3px 9px; border-radius: 8px; text-transform: uppercase; }
      .agenda-type { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--tag); }
      .agenda-state { font-size: 0.68rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
      .agenda-state.is-verified { background: var(--emerald-soft); color: var(--emerald); }
      .agenda-state.is-pending { background: var(--amber-soft); color: #a55a05; }
      .agenda-state.is-muted { background: var(--surface-3); color: var(--text-secondary); }
      .agenda-state.is-superseded { background: var(--rose-soft); color: #b71f1f; }
      .agenda-label { font-size: 1rem; font-weight: 700; color: var(--ink); line-height: 1.3; }
      .agenda-sub { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
      .agenda-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
      @media (max-width: 760px) {
        .agenda-month { grid-template-columns: minmax(0, 1fr); gap: 10px; }
        .agenda-month-label { position: static; }
        .agenda-row { grid-template-columns: 64px minmax(0, 1fr); }
        .agenda-actions { grid-column: 1 / -1; justify-content: flex-start; }
        .tl-track { grid-auto-columns: 74%; }
        .tl-exam-next { text-align: left; }
        .tl-exam-next-what { margin-left: 0; }
      }

      /* --- Ask GovOS AI --- */
      .ask-context { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; }
      .ask-context-label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255, 255, 255, 0.74); }
      .ask-context-exam { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28); }
      .ask-context-hint { font-size: 0.82rem; color: rgba(255, 255, 255, 0.82); flex: 1 1 320px; min-width: 0; }
      .glass-card.chat-card { padding: 0; display: flex; flex-direction: column; height: min(660px, calc(100vh - 150px)); min-height: 520px; overflow: hidden; }
      .chat-feed { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding: 26px 26px 12px; background: linear-gradient(180deg, var(--paper), #fff 160px); }
      .chat-turn { display: flex; gap: 12px; align-items: flex-end; max-width: 86%; min-width: 0; }
      .chat-turn.from-user { align-self: flex-end; flex-direction: row-reverse; }
      .chat-turn.from-ai { align-self: flex-start; }
      .chat-avatar { flex-shrink: 0; width: 34px; height: 34px; border-radius: 12px; background: var(--ink); color: #fff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px -12px rgba(11, 20, 48, 0.6); }
      .chat-bubble { min-width: 0; padding: 16px 20px; line-height: 1.6; font-size: 0.95rem; border-radius: 22px; }
      .from-ai .chat-bubble { background: #fff; color: var(--text-primary); border: 1px solid var(--hairline); border-bottom-left-radius: 6px; box-shadow: 0 14px 30px -24px rgba(11, 20, 48, 0.5); }
      .from-user .chat-bubble { background: var(--ink); color: #fff; border-bottom-right-radius: 6px; }
      .chat-who { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--saffron-text); }
      .from-user .chat-who { color: rgba(255, 255, 255, 0.86); }
      .chat-prompts { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px 26px 0; border-top: 1px solid var(--hairline); }
      .chat-input {
        display: flex; align-items: center; gap: 10px; margin: 14px 26px 22px; padding: 6px 6px 6px 20px; border-radius: 999px;
        background: var(--surface-2); border: 1px solid var(--hairline);
        transition: border-color 0.3s var(--ease-energy), box-shadow 0.4s var(--ease-energy), background-color 0.3s;
      }
      .chat-input:focus-within { border-color: var(--primary); box-shadow: 0 0 0 5px rgba(43, 98, 235, 0.12); background: #fff; }
      .chat-input input { flex: 1; min-width: 0; border: none; background: transparent; outline: none; font-family: var(--font-sans); font-size: 0.98rem; color: var(--text-primary); padding: 10px 0; }
      .chat-input input:focus-visible { outline: none; }
      .chat-send {
        flex-shrink: 0; height: 46px; padding: 0 20px; border-radius: 999px; border: none; cursor: pointer;
        background: var(--ink); color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 0.98rem;
        display: inline-flex; align-items: center; gap: 8px; transition: background-color 0.2s;
      }
      .chat-send:hover { background: var(--ink-2); }
      .chat-send svg { transition: transform 0.45s var(--ease-bounce); }
      .chat-send:hover svg { transform: translate(2px, -2px); }
      @media (prefers-reduced-motion: no-preference) {
        .chat-turn { animation: heroRise 0.5s var(--ease-energy) backwards; }
      }
      @media (max-width: 600px) {
        .chat-feed { padding: 18px 14px 10px; }
        .chat-turn { max-width: 100%; }
        .chat-avatar { display: none; }
        .chat-bubble { padding: 14px 16px; }
        .chat-prompts { padding: 12px 14px 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
        .chat-prompts .chip { flex-shrink: 0; white-space: nowrap; }
        .chat-input { margin: 12px 14px 16px; padding-left: 16px; }
        .chat-send-text { display: none; }
        .chat-send { width: 46px; padding: 0; justify-content: center; }
      }

      /* --- The exam page: where a part sits, the corrigendum in force, turning the page --- */
      .exam-section-card h3 { font-family: var(--font-display); letter-spacing: -0.03em; line-height: 1.2; }
      /* Eligibility rules as a numbered ledger: one style for every card, each as tall as its own words */
      .rule-ledger { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; align-items: start; }
      .rule-card {
        position: relative; display: flex; flex-direction: column; gap: 8px; padding: 20px 20px 18px;
        background: #fff; border: 1px solid var(--hairline); border-radius: 20px; box-shadow: 0 16px 34px -30px rgba(11, 20, 48, 0.45);
      }
      .rule-card-num { font-family: var(--font-display); font-size: 0.8rem; font-weight: 800; color: var(--saffron-text); letter-spacing: 0.04em; }
      .rule-card-title { font-family: var(--font-display); font-size: 1.12rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); margin: 0; text-transform: none; }
      .rule-card-title::first-letter { text-transform: uppercase; }
      .rule-card-body { font-size: 0.9rem; color: var(--text-secondary); margin: 0; line-height: 1.6; }
      .part-mast { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; margin: -4px 0 22px; padding-bottom: 16px; border-bottom: 1px dashed var(--hairline); }
      .part-mast-label { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
      .part-mast-label strong { font-family: var(--font-display); color: var(--saffron-text); font-size: 0.95rem; letter-spacing: 0.02em; }
      .part-progress { display: flex; gap: 4px; align-items: center; }
      .part-step {
        width: 22px; height: 18px; padding: 6px 0; border: none; border-radius: 6px; cursor: pointer;
        background: #d6dded; background-clip: content-box; transition: background-color 0.3s var(--ease-energy), width 0.6s var(--ease-elastic);
      }
      .part-step.is-done { background-color: #8aa6ea; }
      .part-step.is-on { width: 40px; background-color: var(--ink); }
      .part-step:hover { background-color: var(--primary); }
      .part-step:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
      .part-pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 32px; padding-top: 22px; border-top: 1px solid var(--hairline); flex-wrap: wrap; }
      .part-pager-btn {
        display: inline-flex; align-items: center; gap: 14px; text-align: left; max-width: 100%;
        background: var(--surface-2); border: 1px solid transparent; border-radius: 18px; padding: 14px 18px; cursor: pointer; color: var(--ink);
        font-family: var(--font-display); font-size: 1.08rem; font-weight: 800; letter-spacing: -0.02em;
        transition: background-color 0.3s var(--ease-energy), border-color 0.3s var(--ease-energy), box-shadow 0.4s var(--ease-energy);
      }
      .part-pager-btn small { display: block; font-family: var(--font-sans); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
      .part-pager-btn.is-next { margin-left: auto; text-align: right; background: var(--ink); color: #fff; }
      .part-pager-btn.is-next small { color: rgba(255, 255, 255, 0.76); }
      .part-pager-btn:hover { border-color: var(--hairline); background: #fff; box-shadow: var(--shadow-card); }
      .part-pager-btn.is-next:hover { background: var(--ink-2); border-color: transparent; }
      .part-pager-btn svg { flex-shrink: 0; transition: transform 0.45s var(--ease-bounce); }
      .part-pager-btn:hover svg { transform: translateX(-4px); }
      .part-pager-btn.is-next:hover svg { transform: translateX(4px); }
      .corrigendum-bar.notice-ribbon {
        position: relative; overflow: hidden; margin: 0; display: flex; align-items: center; gap: 14px 16px; flex-wrap: wrap;
        padding: 16px 18px 16px 20px; border-radius: 22px; background: #fff; border: 1px solid rgba(192, 72, 10, 0.28);
        box-shadow: 0 18px 40px -32px rgba(192, 72, 10, 0.6);
      }
      .notice-ribbon::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--saffron); }
      .notice-ribbon-mark { flex-shrink: 0; width: 40px; height: 40px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 122, 47, 0.14); color: var(--saffron-text); }
      .notice-ribbon-copy { flex: 1 1 360px; min-width: 0; }
      .notice-ribbon-eyebrow { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--saffron-text); }
      .notice-ribbon-text { font-size: 0.9rem; color: var(--text-primary); line-height: 1.5; margin-top: 3px; }
      .notice-ribbon-btn { flex-shrink: 0; font-size: 0.82rem; padding: 8px 14px; }
      @media (prefers-reduced-motion: no-preference) {
        .notice-ribbon-mark svg { animation: ribbonTurn 1.1s var(--ease-osmo) 0.5s backwards; }
      }
      @keyframes ribbonTurn { from { rotate: -200deg; opacity: 0; } to { rotate: 0deg; opacity: 1; } }
      .side-help {
        margin-top: 14px; width: 100%; display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px;
        border-radius: 18px; border: none; cursor: pointer; background: var(--ink); color: #fff; font-family: var(--font-sans); flex-shrink: 0;
        transition: background-color 0.3s var(--ease-energy);
      }
      .side-help:hover { background: var(--ink-2); }
      .side-help-mark { width: 34px; height: 34px; border-radius: 12px; background: var(--saffron); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .side-help-title { display: block; font-family: var(--font-display); font-weight: 800; font-size: 0.98rem; }
      .side-help-text { display: inline-flex; align-items: center; gap: 4px; font-size: 0.78rem; color: rgba(255, 255, 255, 0.84); }
      @media (max-width: 960px) { .side-nav .side-help { display: none; } }
      @media (max-width: 600px) {
        .page-stage { border-radius: 24px; margin-left: -6px; margin-right: -6px; }
        .page-stage-stats { gap: 12px 28px; }
        .seg { display: flex; width: 100%; flex-wrap: nowrap; border-radius: 22px; }
        .seg button { flex: 1 1 0; min-width: 0; justify-content: center; padding: 9px 8px; font-size: 0.82rem; gap: 6px; }
        .seg:not(.seg-light) { flex-direction: column; }
        .seg:not(.seg-light) button { flex: 0 0 auto; }
        .part-progress { display: none; }
        .part-pager-btn { width: 100%; }
        .part-pager-btn.is-next { margin-left: 0; justify-content: space-between; }
      }

      /* A long unbroken token (a clause reference, a URL) wraps instead of widening its card on a phone. */
      body { overflow-wrap: break-word; }

      /* A phone's top bar keeps the bell and the avatar; the greeting wrapped onto two lines there. */
      @media (max-width: 520px) { .topbar .profile-name { display: none; } }

      /* =====================================================================================
         CLUB: flat colour fields, wavy grounds, stacked display type, handwritten asides and pills.
         Overrides the earlier system; every colour below is a token here.
         ===================================================================================== */
      :root {
        --c-violet: #3b308f; --c-yellow: #ffd24a; --c-pale-yellow: #faed8f; --c-orange: #f9a220; --c-pale-orange: #fbbe63;
        --c-magenta: #ff008c; --c-pink: #fd48f2; --c-pale-pink: #feb6fa; --c-soft-pink: #ffdbfd;
        --c-cyan: #1ce8ed; --c-pale-blue: #a4f6f8; --c-soft-blue: #ddfcfc;
        --c-green: #2de124; --c-pale-green: #8dec7e; --c-soft-green: #caf7c8;
        --c-periwinkle: #9982de; --c-pale-periwinkle: #c2b4eb; --c-soft-periwinkle: #d7cdf1;
        --c-soft-orange: #fddaa6; --c-soft-grey: #f2f2f2; --c-teal: #17a99a;
        --font-hand: 'Caveat Brush', 'Comic Sans MS', cursive;
        --primary: #3b308f; --primary-soft: #ebe6fa; --primary-glow: rgba(59, 48, 143, 0.35);
        --ink: #000; --ink-2: #26214f; --saffron: #ff008c; --saffron-text: #3b308f;
        --paper: #ffffff; --hairline: #e8e5ee;
        --font-accent: var(--font-hand);
      }
      body { background-color: #fff; }
      .glass-card { border-radius: 28px; box-shadow: none; }
      .accent-serif { font-family: var(--font-hand); font-style: normal; font-weight: 400; letter-spacing: 0; color: var(--c-violet); }
      .btn { border-radius: 999px; }
      .btn-primary { background: var(--c-violet); color: #fff; box-shadow: none; }
      .btn-primary:hover { background: #2c2370; }
      .btn-outline { color: var(--c-violet); border-color: rgba(59, 48, 143, 0.45); }
      .btn-secondary { border-color: #d9d4e6; }
      .chip { border-radius: 999px; }
      .chip.active, .chip:hover { border-color: #000; color: #000; }

      /* The bar: no tray of its own at the top of a page; small pills; a white pill once the page scrolls. */
      .topbar { background: transparent; border-color: transparent; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
      .topbar[data-scrolled="true"] { background: rgba(255, 255, 255, 0.92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 10px 30px -18px rgba(0, 0, 0, 0.35); }
      .topbar nav { gap: 6px; }
      .nav-link {
        font-size: 0.82rem; font-weight: 700; color: #000; padding: 7px 14px;
        background: rgba(255, 255, 255, 0.72); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
      }
      .nav-link:hover { background: var(--c-pale-yellow); color: #000; }
      .nav-link.active { background: #000; color: #fff; box-shadow: none; }
      .nav-link.active svg { color: #fff; }
      .app-container[data-view="FINDER"] > .topbar:not([data-scrolled="true"]) .brand > span { opacity: 0; }
      .app-container[data-view="FINDER"] > .topbar:not([data-scrolled="true"]) .icon-btn { background: rgba(255, 255, 255, 0.72); border-color: transparent; }

      /* Full-bleed fields inside the content column (the homepage clips the overhang). */
      .bleed { width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
      /* The clip that keeps a bleed from scrolling the page sideways sits on the full-width root, not on the
         content column (which would cut the fields off at its own edges). clip, not hidden: no scroll container. */
      #root { overflow-x: clip; }
      .homepage { overflow-x: visible; }
      .app-container[data-view="FINDER"] > .topbar { margin-bottom: 0; }
      .app-container[data-view="FINDER"] { padding-bottom: 0; }
      .app-container[data-view="FINDER"] main { padding-bottom: 0 !important; }

      /* --- First-visit intro: violet field, the mark pops, a ribbon sweeps off --- */
      .club-intro { position: fixed; inset: 0; z-index: 6000; pointer-events: none; }
      .club-intro svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .club-intro-ribbon {
        fill: none; stroke: var(--c-violet); stroke-width: 260; stroke-linecap: round;
        stroke-dasharray: 100 140; stroke-dashoffset: 0;
        animation: ribbonOff 1.25s cubic-bezier(0, 0.55, 0.45, 1) 0.65s forwards;
      }
      @keyframes ribbonOff { 95% { stroke-width: 26; } to { stroke-dashoffset: -100; stroke-width: 20; } }
      .club-intro-logo {
        position: absolute; left: 50%; top: 50%; margin: -46px 0 0 -46px; color: #fff; display: block;
        animation: logoIn 0.65s var(--ease-elastic) 0.05s backwards, logoOut 0.6s cubic-bezier(0.6, -0.4, 0.7, 0) 0.5s forwards;
      }
      @keyframes logoIn { from { scale: 0; rotate: -64deg; opacity: 0; } }
      @keyframes logoOut { to { scale: 0; rotate: 64deg; opacity: 0; } }
      html.intro-run { --intro-delay: 1.15s; }
      @media (prefers-reduced-motion: no-preference) {
        html.intro-run .topbar { animation: barIn 0.5s var(--ease-energy) 1.5s backwards; }
      }

      /* --- Hand-lettered asides --- */
      .handwritten { font-family: var(--font-hand); font-weight: 400; line-height: 1.05; color: #000; display: inline-block; }
      .hw-word { display: inline-block; white-space: nowrap; }
      .hw-char { display: inline-block; }
      @media (prefers-reduced-motion: no-preference) {
        .hw-char { animation: hwIn 0.75s var(--ease-elastic) backwards; animation-delay: calc(var(--intro-delay, 0s) + 0.6s + var(--ci, 0) * 16ms); }
        .club-shelf-note .hw-char, .club-cat-eyebrow .hw-char, .club-band-note .hw-char { animation-delay: calc(0.2s + var(--ci, 0) * 16ms); }
      }
      @keyframes hwIn { from { opacity: 0; transform: translate(-0.25em, 0.5em) rotate(22deg); } }

      /* --- The opening field --- */
      .club-hero {
        position: relative; isolation: isolate; overflow: hidden; background: var(--c-yellow); color: #000;
        margin-top: -86px; padding: 128px 0 0; min-height: min(100vh, 900px);
      }
      @media (min-width: 992px) and (prefers-reduced-motion: no-preference) {
        .club-hero { animation: heroClip 1.1s cubic-bezier(0, 0.55, 0.45, 1) calc(var(--intro-delay, 0s) * 0.9) backwards; }
      }
      @keyframes heroClip { from { clip-path: ellipse(20% 0% at 100% 100%); } to { clip-path: ellipse(150% 130% at 100% 100%); } }
      .club-corner { position: absolute; right: -50px; top: -70px; width: 300px; height: 210px; background: var(--c-teal); border-radius: 0 0 0 150px; rotate: 10deg; z-index: -1; }
      .club-waves { position: absolute; left: 0; bottom: 0; width: 100%; height: 44%; z-index: -1; }
      .club-waves .w1 { fill: var(--c-pale-yellow); }
      .club-waves .w2 { fill: var(--c-pale-orange); }
      .club-waves .w3 { fill: var(--c-orange); }
      .club-hero-inner {
        max-width: 1400px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px) clamp(140px, 16vw, 220px);
        display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 0.65fr); gap: clamp(20px, 3vw, 40px); align-items: center;
      }
      .club-hero-copy { min-width: 0; position: relative; z-index: 2; }
      .club-title {
        font-size: clamp(2.9rem, 1.2rem + 5vw, 5.9rem) !important; line-height: 0.86 !important; letter-spacing: -0.05em !important;
        font-weight: 800 !important; color: #000 !important; margin: 0 0 26px !important;
      }
      @media (prefers-reduced-motion: no-preference) {
        .club-hero .hero-title .split-word { animation-delay: calc(var(--intro-delay, 0s) + 0.15s + var(--wi, 0) * 88ms); }
        .club-in { animation: heroRise 0.5s var(--ease-energy) backwards; animation-delay: calc(var(--intro-delay, 0s) + 0.45s + var(--hi, 0) * 70ms); }
      }
      .club-lede { font-size: clamp(1rem, 0.94rem + 0.3vw, 1.15rem); line-height: 1.5; max-width: 36ch; margin: 0 0 22px; color: rgba(0, 0, 0, 0.82); font-weight: 500; }
      .club-search {
        display: flex; align-items: center; gap: 10px; max-width: 30rem; height: 56px; padding: 0 20px; margin-bottom: 18px;
        background: #fff; border-radius: 999px; color: rgba(0, 0, 0, 0.6); box-shadow: 0 0 0 2px #000;
      }
      .club-search:focus-within { box-shadow: 0 0 0 3px #000, 6px 6px 0 3px #000; }
      .club-search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: var(--font-sans); font-size: 1rem; color: #000; }
      .club-search input::placeholder { color: rgba(0, 0, 0, 0.55); }
      .club-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      .btn.club-cta {
        height: 52px; padding: 0 26px; border: none; background: var(--c-magenta); color: #000;
        font-family: var(--font-display); font-size: 1.02rem; font-weight: 800; letter-spacing: -0.01em;
      }
      .btn.club-cta:hover { background: var(--c-pink); }
      .btn.club-ghost { height: 52px; padding: 0 22px; background: transparent; color: #000; border: 2px solid #000; font-weight: 800; }
      .btn.club-ghost:hover { background: #000; color: #fff; }
      .club-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
      .chip.club-chip { background: rgba(255, 255, 255, 0.6); border-color: transparent; color: #000; font-weight: 700; }
      .chip.club-chip:hover { background: #fff; border-color: #000; }
      .club-figures { display: flex; gap: 8px 28px; flex-wrap: wrap; margin: 26px 0 0; }
      .club-figures div { display: flex; align-items: baseline; gap: 6px; }
      .club-figures dt { order: 2; font-size: 0.86rem; font-weight: 700; color: rgba(0, 0, 0, 0.75); }
      .club-figures dd { order: 1; margin: 0; font-family: var(--font-display); font-size: 1.9rem; font-weight: 800; letter-spacing: -0.04em; }
      .club-hero-visual { position: relative; min-height: 470px; z-index: 1; }
      .club-book {
        position: absolute; left: 50%; top: 50%; width: clamp(180px, 16vw, 240px); aspect-ratio: 0.72; margin-left: calc(clamp(180px, 16vw, 240px) / -2);
        translate: calc(var(--mx, 0) * 14px) calc(-50% + var(--my, 0) * 10px); transition: translate 0.9s var(--ease-osmo);
      }
      .club-book-body { position: absolute; inset: 0; rotate: -18deg; }
      @media (prefers-reduced-motion: no-preference) {
        .club-book-body { animation: bookDrop 0.8s var(--ease-elastic) calc(var(--intro-delay, 0s) + 0.45s) backwards; }
      }
      @keyframes bookDrop { from { opacity: 0; translate: 0 5em; rotate: -43deg; } }
      .club-book-pages { position: absolute; inset: 6px -14px -12px 10px; z-index: -1; border-radius: 4px 14px 14px 4px; background: repeating-linear-gradient(0deg, #fffaf0 0 3px, #eadfc6 3px 4px); box-shadow: 18px 26px 40px -16px rgba(0, 0, 0, 0.45); }
      .club-book-cover {
        position: absolute; inset: 0; border-radius: 6px 14px 14px 6px; overflow: hidden; color: #fff;
        background: var(--c-violet); padding: 22px 20px 20px 34px; display: flex; flex-direction: column; gap: 4px;
        box-shadow: inset -8px 0 0 rgba(0, 0, 0, 0.12);
      }

      .club-book-code { position: relative; font-family: var(--font-display); font-size: clamp(1.5rem, 1rem + 1.1vw, 2.1rem); font-weight: 800; line-height: 0.88; letter-spacing: -0.04em; }
      .club-book-auth { position: relative; font-size: 0.8rem; font-weight: 700; opacity: 0.92; }
      .club-note { position: absolute; left: -4%; top: 2%; font-size: 1.5rem; max-width: 8em; rotate: -7deg; text-align: center; z-index: 2; }

      /* --- Section titles --- */
      .club-section-title { font-family: var(--font-display); font-size: clamp(2.2rem, 1.2rem + 3.6vw, 4.6rem); line-height: 0.92; letter-spacing: -0.05em; font-weight: 800; color: #000; margin: 0; max-width: 16ch; }

      /* --- The exams as colour cards --- */
      .club-shelf { margin-top: clamp(80px, 9vw, 130px); }

      .club-shelf-note { font-size: 1.5rem; rotate: -4deg; color: var(--c-violet); }
      .club-cards { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 22px; padding: 10px 0 40px; }
      .popular-exam-card.club-card {

      .club-cover {

      .club-cover-badge {
        width: 52px; height: 52px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; text-align: center;
        background: var(--card-on); color: var(--card-cover); font-size: 0.66rem; font-weight: 800; letter-spacing: 0.02em; line-height: 1;
      }
      .club-cover-code { margin-top: auto; font-family: var(--font-display); font-size: clamp(1.9rem, 1.2rem + 1.5vw, 2.9rem); font-weight: 800; line-height: 0.86; letter-spacing: -0.045em; text-transform: uppercase; overflow-wrap: anywhere; }
      .club-cover-sub { font-size: 0.76rem; font-weight: 700; line-height: 1.25; }
      .club-card-tags { display: flex; gap: 5px; flex-wrap: wrap; }
      .club-card-tags span { font-size: 0.68rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #fff; color: #000; }
      .club-card-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em; padding: 0 6px; }
      .club-card-next { font-size: 0.82rem; line-height: 1.35; color: rgba(0, 0, 0, 0.78); padding: 0 6px; }
      .club-card-next strong { color: #000; }
      .club-card-pop {
        position: absolute; top: -12px; right: -10px; z-index: 3; display: inline-flex; align-items: center; gap: 4px;
        padding: 7px 12px; border-radius: 999px; background: #000; color: #fff; font-size: 0.78rem; font-weight: 800;
        scale: 0; rotate: -24deg; transition: scale 0.5s var(--ease-elastic), rotate 0.5s var(--ease-elastic);
      }
      .popular-exam-card.club-card:is(:hover, :focus-visible) .club-card-pop { scale: 1; rotate: 6deg; }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        .popular-exam-card.club-card:hover { transform: translateY(var(--drop, 0)) rotate(var(--tilt, 0deg)); translate: 0 -10px; rotate: calc(var(--tilt, 0deg) * -0.6); box-shadow: none; }
        .popular-exam-card.club-card:hover .club-cover { translate: 0 -1.2em; }
      }
      .club-violet { --card-frame: var(--c-pale-periwinkle); --card-cover: var(--c-violet); --card-on: #fff; --card-accent: var(--c-magenta); }
      .club-yellow { --card-frame: var(--c-pale-yellow); --card-cover: var(--c-yellow); --card-on: #000; --card-accent: var(--c-orange); }
      .club-green  { --card-frame: var(--c-soft-green); --card-cover: var(--c-green); --card-on: #000; --card-accent: var(--c-pale-green); }
      .club-pink   { --card-frame: var(--c-soft-pink); --card-cover: var(--c-pink); --card-on: #000; --card-accent: var(--c-pale-pink); }
      .club-cyan   { --card-frame: var(--c-soft-blue); --card-cover: var(--c-cyan); --card-on: #000; --card-accent: var(--c-pale-blue); }
      .club-blank  { --card-frame: var(--c-soft-grey); --card-cover: #fff; --card-on: #000; --card-accent: var(--c-soft-grey); }
      .club-blank .club-cover { box-shadow: inset 0 0 0 2px #000; }

      /* --- "Choose from": every exam and authority, stacked on a bright field, moving with the scroll --- */
      .club-categories {
        position: relative; z-index: 2; isolation: isolate; overflow: hidden; margin-top: clamp(60px, 8vw, 110px);
        background: var(--c-pink); color: #000; text-align: center; padding: 70px 20px 90px; border-radius: 0 0 64px 64px;
        view-timeline: --cats block;
      }
      .club-cat-eyebrow { font-size: 1.9rem; }
      .club-cat-window {
        position: relative; height: clamp(360px, 54vh, 540px); overflow: hidden; margin: 10px auto 0; max-width: 1000px;
        -webkit-mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent); mask-image: linear-gradient(transparent, #000 16%, #000 84%, transparent);

      .club-cat-reel { list-style: none; margin: 0; padding: 40px 0; }

      .club-mini {
        position: absolute; width: clamp(84px, 9vw, 128px); aspect-ratio: 0.72; border-radius: 12px; padding: 10px;

      .club-mini-0 { left: 5%; top: 14%; rotate: -10deg; --k: 1.4; }
      .club-mini-1 { right: 6%; top: 10%; rotate: 8deg; --k: 0.8; }
      .club-mini-2 { left: 10%; top: 56%; rotate: 6deg; --k: 1.1; }
      .club-mini-3 { right: 9%; top: 52%; rotate: -7deg; --k: 1.6; }

      /* --- The cyan band --- */
      .club-band { position: relative; z-index: 1; margin-top: -64px; padding: 130px 0 110px; background: var(--c-pale-blue); color: #000; overflow: hidden; }
      .club-band-inner { max-width: 1300px; margin: 0 auto; padding: 0 clamp(20px, 4vw, 56px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(28px, 5vw, 80px); align-items: center; }
      .club-label-title { margin: 0 0 22px; font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 1.3rem + 4.2vw, 5.4rem); line-height: 1.12; letter-spacing: -0.045em; }
      .club-label-title span { padding: 0 0.16em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
      .club-label-title span:first-child { background: #fff; color: #000; }
      .club-label-title span:last-of-type { background: #000; color: #fff; }
      .club-band-copy p { font-size: 1.08rem; line-height: 1.55; max-width: 40ch; margin: 0 0 24px; }
      .club-band-frame { position: relative; margin: 0; rotate: 4deg; border-radius: 34px; box-shadow: 14px 14px 0 var(--c-violet); }
      .club-band-frame img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; object-position: 82% 50%; border-radius: 34px; border: 4px solid #000; }
      .club-band-note { position: absolute; left: -18px; bottom: -34px; font-size: 1.7rem; rotate: -8deg; background: var(--c-yellow); padding: 4px 14px; border-radius: 12px; }

      /* --- Questions, by category --- */
      .club-faq { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: clamp(24px, 5vw, 72px); margin-top: clamp(90px, 10vw, 150px); }
