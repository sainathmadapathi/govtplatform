<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GovOS — India's Exam & Career Navigation Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Serif:ital@1&family=Caveat+Brush&display=swap" rel="stylesheet">
    <style>
      :root {
        /* page + surfaces (token names kept for the inline styles that reference them) */
        --bg-dark: #f4f7fb;
        --bg-card: #ffffff;
        --bg-card-hover: #fbfcfe;
        --bg-card-solid: #ffffff;
        --bg-input: #f3f6fb;
        --surface-2: #f6f8fc;
        --surface-3: #eef2f8;
        --border-color: #e6eaf2;
        --border-highlight: rgba(47, 107, 255, 0.35);

        --text-primary: #0f172a;
        --text-secondary: #526079;
        --text-muted: #656f81;

        --primary: #2b62eb;
        --primary-soft: #eaf0ff;
        --primary-glow: rgba(47, 107, 255, 0.22);
        --emerald: #147a3a;
        --emerald-soft: #e8f7ee;
        --emerald-glow: rgba(21, 128, 61, 0.22);
        --amber: #a55a05;
        --amber-soft: #fff4e0;
        --amber-glow: rgba(217, 119, 6, 0.22);
        --rose: #e11d48;
        --rose-soft: #fde8ec;
        --rose-glow: rgba(225, 29, 72, 0.22);
        --cyan: #067590;
        --purple: #7c3aed;

        --font-sans: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --radius-sm: 10px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-full: 9999px;

        --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 10px 30px -18px rgba(15, 23, 42, 0.18);
        --shadow-glow: 0 8px 24px -10px var(--primary-glow);
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #f8fafc;
        color: var(--text-primary);
        font-family: var(--font-sans);
        min-height: 100vh;
        line-height: 1.5;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cfd6e3; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #b7c0d1; }

      a { color: var(--primary); text-decoration: none; transition: all 0.2s ease; }
      a:hover { text-decoration: underline; }

      /* Cards (class name kept from the previous theme) */
      .glass-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 16px;
        box-shadow: var(--shadow-card);
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .glass-card:hover { border-color: #d8dfec; }

      .glass-pill {
        background: var(--surface-2);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-full);
        padding: 4px 12px;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* Buttons */
      .btn {
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 0.95rem;
        padding: 10px 18px;
        border-radius: 12px;
        border: 1px solid transparent;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.18s ease;
        line-height: 1.2;
      }
      .btn-primary { background: var(--primary); color: #fff; box-shadow: var(--shadow-glow); }
      .btn-primary:hover { background: #245ae6; transform: translateY(-1px); }
      .btn-emerald { background: var(--emerald); color: #fff; box-shadow: 0 8px 24px -10px var(--emerald-glow); }
      .btn-emerald:hover { background: #166534; transform: translateY(-1px); }
      .btn-secondary { background: #fff; color: var(--text-primary); border: 1px solid var(--border-color); }
      .btn-secondary:hover { background: var(--surface-2); border-color: #d3dbe8; }
      .btn-outline { background: transparent; color: var(--primary); border: 1px solid rgba(47, 107, 255, 0.45); }
      .btn-outline:hover { background: var(--primary-soft); }
      .btn-amber { background: var(--amber-soft); color: #92400e; border: 1px solid rgba(217, 119, 6, 0.35); }

      /* Badges: light tints, dark text */
      .badge {
        padding: 4px 10px;
        border-radius: var(--radius-full);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        line-height: 1.3;
      }
      .badge-verified { background: var(--emerald-soft); color: #137638; border: 1px solid rgba(22, 163, 74, 0.25); }
      .badge-changed { background: var(--amber-soft); color: #af5109; border: 1px solid rgba(217, 119, 6, 0.3); }
      .badge-pending { background: #e6f6fb; color: #0e7490; border: 1px solid rgba(8, 145, 178, 0.3); }
      .badge-superseded { background: var(--rose-soft); color: #be123c; border: 1px solid rgba(225, 29, 72, 0.3); }
      .badge-demo { background: #f1ebfe; color: #6d28d9; border: 1px solid rgba(124, 58, 237, 0.3); }

      /* Layout */
      .app-container { max-width: 1400px; margin: 0 auto; padding: 14px 28px 48px; }

      /* Top bar */
      .topbar {
        position: relative;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.94);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid #e2e8f0;
        border-radius: 9999px;
        box-shadow: 0 4px 20px -4px rgba(15, 23, 42, 0.04);
        padding: 8px 24px;
        margin-bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: nowrap;
      }
      .topbar nav {
        flex: 1; min-width: 0; overflow-x: auto; flex-wrap: nowrap !important; scrollbar-width: none;
        -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
                mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent 100%);
      }
      .topbar nav::-webkit-scrollbar { display: none; }
      .brand { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.02em; color: var(--primary); cursor: pointer; }
      .nav-link {
        font-family: var(--font-sans);
        font-size: 0.9rem;
        font-weight: 500;
        color: #334155;
        background: transparent;
        border: none;
        border-radius: 9999px;
        padding: 6px 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        transition: all 0.15s ease;
      }
      .nav-link:hover { background: #f1f5f9; color: #0f172a; }
      .nav-link.active { background: #f1f5f9; color: #235ddd; font-weight: 600; }
      .nav-link.subtle { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
      .avatar {
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--primary); color: #fff; font-weight: 800; font-size: 0.9rem;
        display: inline-flex; align-items: center; justify-content: center;
      }
      .icon-btn {
        width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border-color);
        background: #fff; color: var(--text-secondary); display: inline-flex; align-items: center;
        justify-content: center; cursor: pointer; position: relative;
      }

      /* Hero: natural, seamless landing page integration with frosted glass */
      .hero {
        position: relative;
        background: rgba(255, 255, 255, 0.76);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.88);
        border-radius: 24px;
        box-shadow: 0 10px 30px -10px rgba(37, 99, 235, 0.08), 0 2px 8px rgba(15, 23, 42, 0.03);
        padding: 48px 48px 44px;
        min-height: 420px;
        display: flex;
        align-items: center;
        overflow: hidden;
        isolation: isolate;
      }
      .hero-content,
      .hero > div:first-child {
        position: relative;
        z-index: 2;
        max-width: 540px;
        width: 100%;
      }
      .hero h1 {
        font-size: 2.65rem;
        line-height: 1.14;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: var(--text-primary);
      }
      .hero h1 .accent { color: var(--primary); }
      .hero-art {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 65%;
        z-index: 1;
        margin: 0;
        pointer-events: none;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to right,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.03) 12%,
          rgba(0, 0, 0, 0.25) 28%,
          rgba(0, 0, 0, 0.75) 48%,
          rgba(0, 0, 0, 0.96) 65%,
          #000000 78%
        );
        mask-image: linear-gradient(to right,
          rgba(0, 0, 0, 0) 0%,
          rgba(0, 0, 0, 0.03) 12%,
          rgba(0, 0, 0, 0.25) 28%,
          rgba(0, 0, 0, 0.75) 48%,
          rgba(0, 0, 0, 0.96) 65%,
          #000000 78%
        );
      }
      .hero-art img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 84% 54%;
      }
      /* Soft atmospheric mist blending the image edges smoothly into the card surface */
      .hero-art::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(to right, rgba(255, 255, 255, 0.75) 0%, rgba(255, 255, 255, 0.2) 30%, rgba(255, 255, 255, 0) 55%),
          linear-gradient(to top, rgba(246, 249, 255, 0.35) 0%, transparent 25%);
      }
      @media (max-width: 1100px) {
        .hero-art { width: 58%; }
        .hero-content,
        .hero > div:first-child { max-width: 480px; }
      }
      @media (max-width: 900px) {
        .hero {
          flex-direction: column;
          align-items: stretch;
          padding: 36px 24px 0;
          min-height: 0;
        }
        .hero-content,
        .hero > div:first-child {
          max-width: none;
          margin-bottom: 8px;
        }
        .hero-art {
          position: relative;
          width: calc(100% + 48px);
          height: 250px;
          margin: 16px -24px 0;
          -webkit-mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.3) 15%,
            rgba(0, 0, 0, 0.85) 35%,
            #000000 50%
          );
          mask-image: linear-gradient(to bottom,
            rgba(0, 0, 0, 0) 0%,
            rgba(0, 0, 0, 0.3) 15%,
            rgba(0, 0, 0, 0.85) 35%,
            #000000 50%
          );
        }
        .hero-art img { object-position: 78% 54%; }
        .hero-art::after {
          background: linear-gradient(to bottom, rgba(255, 255, 255, 0.9) 0%, transparent 40%);
        }
      }
      .search-bar {
        display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid #d6deea;
        border-radius: 14px; padding: 6px 6px 6px 16px; box-shadow: 0 2px 6px rgba(15,23,42,0.04);
      }
      .search-bar input { flex: 1; border: none; outline: none; font-family: var(--font-sans); font-size: 1rem; color: var(--text-primary); background: transparent; }
      .search-bar input::placeholder { color: var(--text-muted); }
      .chip {
        background: #fff; border: 1px solid var(--border-color); color: var(--text-secondary);
        border-radius: 999px; padding: 6px 12px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans);
      }
      .chip:hover { border-color: var(--primary); color: var(--primary); }

      .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
      .feature-card {
        background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 20px;
        box-shadow: var(--shadow-card); cursor: pointer; transition: transform 0.15s ease, border-color 0.15s ease; text-align: left;
        font-family: var(--font-sans);
      }
      .feature-card:hover { transform: translateY(-2px); border-color: #cfd9ee; }
      .feature-icon { width: 46px; height: 46px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; }
      .feature-card h4 { font-size: 1rem; font-weight: 800; color: var(--text-primary); margin-bottom: 4px; }
      .feature-card p { font-size: 0.84rem; color: var(--text-secondary); line-height: 1.45; }

      .quote-strip {
        display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center;
        background: #fff; border: 1px solid var(--border-color); border-radius: 16px; padding: 22px 26px; box-shadow: var(--shadow-card);
      }
      @media (max-width: 700px) { .quote-strip { grid-template-columns: 1fr; } }

      /* Exam page: independent dual-pane separate scrolling layout */
      .exam-layout {
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr);
        gap: 20px;
        align-items: stretch;
      }

      /* Desktop: sidebar and content each have independent, separate scroll areas */
      @media (min-width: 961px) {
        .exam-layout {
          height: calc(100vh - 110px);
          height: calc(100dvh - 110px);
          min-height: 520px;
        }

        .side-nav {
          height: 100%;
          max-height: 100%;
          overflow-y: auto;
          overflow-x: hidden;
          overscroll-behavior: contain;
          display: flex;
          flex-direction: column;
          gap: 4px;
          padding: 14px;
          scrollbar-width: thin;
          scrollbar-color: #cfd6e3 transparent;
        }

        .exam-main-content {
          height: 100%;
          max-height: 100%;
          overflow-y: auto;
          overflow-x: hidden;
          overscroll-behavior: contain;
          padding-right: 6px;
          scrollbar-width: thin;
          scrollbar-color: #cfd6e3 transparent;
        }
      }

      /* Mobile: natural stacked layout with scrollable sidebar tray */
      @media (max-width: 960px) {
        .exam-layout {
          grid-template-columns: 1fr;
          height: auto;
          gap: 16px;
        }
        /* On a narrow screen the 18-item vertical list pushed the exam itself off the
           first screen, so it becomes one horizontally scrolling row of chips instead.
           Same buttons, same handlers — only the direction changes. */
        .side-nav {
          display: flex;
          flex-direction: row;
          flex-wrap: nowrap;
          align-items: center;
          gap: 6px;
          max-height: none;
          overflow-x: auto;
          overflow-y: hidden;
          margin-bottom: 4px;
          padding: 10px 12px;
          scrollbar-width: none;
        }
        .side-nav::-webkit-scrollbar { display: none; }
        .side-nav .side-link { white-space: nowrap; width: auto; }
        .side-nav .side-heading {
          margin: 0 2px;
          padding: 0 10px 0 6px;
          border-left: 1px solid var(--border-color);
          white-space: nowrap;
          align-self: center;
        }
        /* "Ask GovOS AI" has its own place in the top bar; in the chip row the card would be a
           third copy and it stretched the row. The card carries an inline `display: flex`, so
           the override has to win over it. */
        .side-nav > div:last-child { display: none !important; }
        .exam-main-content {
          overflow-y: visible;
          padding-right: 0;
        }
      }

      /* Keep sidebar buttons from shrinking so full list scrolls seamlessly */
      .side-nav > * {
        flex-shrink: 0;
      }

      .side-link {
        display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: none; background: transparent;
        color: var(--text-secondary); font-family: var(--font-sans); font-size: 0.9rem; font-weight: 600; cursor: pointer; text-align: left; width: 100%;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }
      .side-link:hover { background: var(--surface-2); color: var(--text-primary); }
      .side-link.active { background: var(--primary-soft); color: var(--primary); }
      .side-link.minor { font-size: 0.82rem; font-weight: 500; padding: 7px 12px; }
      .side-heading { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); padding: 10px 12px 4px; flex-shrink: 0; }

      /* Sleek scrollbars for both independently scrolling panes */
      .side-nav::-webkit-scrollbar,
      .exam-main-content::-webkit-scrollbar {
        width: 6px;
      }
      .side-nav::-webkit-scrollbar-track,
      .exam-main-content::-webkit-scrollbar-track {
        background: transparent;
      }
      .side-nav::-webkit-scrollbar-thumb,
      .exam-main-content::-webkit-scrollbar-thumb {
        background: #cfd6e3;
        border-radius: 6px;
      }
      .side-nav::-webkit-scrollbar-thumb:hover,
      .exam-main-content::-webkit-scrollbar-thumb:hover {
        background: #b7c0d1;
      }
      .stat-tile {
        background: #fff; border: 1px solid var(--border-color); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center;
        box-shadow: var(--shadow-card);
      }
      .stat-tile .tile-icon { width: 36px; height: 36px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
      .stat-tile .tile-label { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
      .stat-tile .tile-value { font-size: 1rem; color: var(--text-primary); font-weight: 800; }
      .exam-logo {
        width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #ffe7c2, #ffd08a); color: #7c2d12;
        display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.95rem; letter-spacing: 0.02em; flex-shrink: 0;
      }
      .exam-banner {
        border-radius: 16px; padding: 26px 30px; min-height: 130px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
        /* Without this the description and the nowrap Ask button cannot both fit a phone's
           content box, and the button is pushed past the viewport edge. */
        flex-wrap: wrap;
        background:
          radial-gradient(circle at 85% 30%, #ffe7c2 0%, transparent 30%),
          linear-gradient(120deg, #eaf1ff 0%, #f6f9ff 50%, #e9f3e6 100%);
        border: 1px solid var(--border-color);
      }
      .info-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-color); }
      .info-row:last-child { border-bottom: none; }
      .info-icon { width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); color: var(--primary); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

      /* Stepper (kept) */
      .stepper-container { display: flex; align-items: center; justify-content: space-between; gap: 8px; overflow-x: auto; padding: 16px 8px; margin-bottom: 24px; }
      .step-item { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 90px; cursor: pointer; opacity: 0.7; transition: all 0.2s ease; }
      .step-item.active { opacity: 1; }
      .step-number { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; }
      .step-item.active .step-number { border-color: var(--primary); background: var(--primary); color: white; }
      .step-item.completed .step-number { border-color: var(--emerald); background: var(--emerald); color: white; }
      .step-title { font-size: 0.75rem; font-weight: 600; text-align: center; white-space: nowrap; }

      .corrigendum-bar {
        background: var(--amber-soft);
        border: 1px solid rgba(217, 119, 6, 0.35);
        border-radius: var(--radius-md);
        padding: 14px 20px; margin-bottom: 20px;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
      }

      /* Modals */
      .modal-overlay {
        position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px;
      }
      .modal-content {
        background: #fff; border: 1px solid var(--border-color); border-radius: var(--radius-lg);
        max-width: 650px; width: 100%; padding: 28px; box-shadow: 0 30px 60px -20px rgba(15, 23, 42, 0.35);
        position: relative; max-height: 90vh; overflow-y: auto;
      }

      .taxonomy-tag { font-family: var(--font-mono); font-size: 0.75rem; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
      .taxonomy-fact { background: var(--emerald-soft); color: #137638; }
      .taxonomy-interp { background: #e8f0ff; color: #1d4ed8; }
      .taxonomy-explain { background: #f1ebfe; color: #6d28d9; }
      .taxonomy-recom { background: var(--amber-soft); color: #af5109; }

      /* min(320px, 100%) so a track can still shrink on a narrow phone: a bare minmax(320px, 1fr)
         cannot go below 320px and pushes its container off the screen under ~360px of content. */
      .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 20px; }
      .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 20px; }

      input, select, textarea { font-family: var(--font-sans); }
      input[type="text"], input[type="number"], input[type="email"], input[type="date"], select, textarea { color: var(--text-primary); }

      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes pulseTrickGlow {
        0% { box-shadow: 0 0 12px rgba(217, 119, 6, 0.18); border-color: rgba(217, 119, 6, 0.4); }
        50% { box-shadow: 0 0 22px rgba(217, 119, 6, 0.35); border-color: rgba(217, 119, 6, 0.8); }
        100% { box-shadow: 0 0 12px rgba(217, 119, 6, 0.18); border-color: rgba(217, 119, 6, 0.4); }
      }
      .trick-card-animated { animation: pulseTrickGlow 2.5s infinite ease-in-out; }
      @keyframes shimmerEffect { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      .shimmer-badge { position: relative; overflow: hidden; }
      .shimmer-badge::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent); animation: shimmerEffect 2s infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .animate-spin { animation: spin 1s linear infinite; }

      /* ===================================================
         GOVOS PREMIUM DYNAMIC LIGHT BACKGROUND & AMBIENT GLOW
         =================================================== */




      .homepage {
        position: relative;
        min-height: 100vh;
        width: 100%;
        /* clip, not hidden: the decorative glow and the illustration bleed a little past the
           content column and must never turn that bleed into a horizontal scrollbar, but
           `clip` keeps this from becoming a scroll container (sticky children still work). */
        overflow-x: clip;
      }

      /* Base Responsive Background Layer */
      .homepage-bg-layer {
        position: absolute;
        top: 0;
        left: -28px;
        right: -28px;
        bottom: 0;
        pointer-events: none;
        overflow: hidden;
        z-index: 0;
      }

      /* Coordinated Ambient Light Fields: Sky Blue (Left) & Golden Sunlight (Right) */
      .bg-mesh-sky {
        position: absolute;
        top: -60px;
        left: -60px;
        width: 680px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(circle at 45% 45%, rgba(186, 220, 255, 0.65) 0%, rgba(147, 197, 253, 0.35) 38%, rgba(219, 234, 254, 0.15) 65%, transparent 75%);
        filter: blur(55px);
        pointer-events: none;
        /* static: a decorative glow that repaints forever costs battery and jank */
      }

      .bg-mesh-sun {
        position: absolute;
        top: -70px;
        right: -50px;
        width: 640px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 50%, rgba(254, 240, 138, 0.65) 0%, rgba(253, 230, 138, 0.35) 35%, rgba(251, 191, 36, 0.16) 55%, transparent 75%);
        filter: blur(48px);
        pointer-events: none;
        transform: none;
      }


      /* Ensure content containers sit relative above background */
      .homepage-content-layer {
        position: relative;
        z-index: 2;
      }

      /* ===================================================
         UNBOXED SEAMLESS HERO & INTEGRATED ILLUSTRATION
         =================================================== */

      .hero-seamless {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 480px;
        padding: 8px 0 20px;
        overflow: visible;
      }

      .hero-content-seamless {
        position: relative;
        z-index: 2;
        max-width: 580px;
        width: 100%;
      }

      .hero-art-seamless {
        position: absolute;
        top: -15px;
        right: -30px;
        bottom: -15px;
        width: 58%;
        pointer-events: none;
        overflow: hidden;
        z-index: 1;
        -webkit-mask-image:
          linear-gradient(to right, transparent 0%, rgba(0,0,0,0.04) 10%, rgba(0,0,0,0.35) 24%, rgba(0,0,0,0.85) 42%, #000 60%),
          linear-gradient(to bottom, transparent 0%, #000 8%, #000 76%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-image:
          linear-gradient(to right, transparent 0%, rgba(0,0,0,0.04) 10%, rgba(0,0,0,0.35) 24%, rgba(0,0,0,0.85) 42%, #000 60%),
          linear-gradient(to bottom, transparent 0%, #000 8%, #000 76%, transparent 100%);
        mask-composite: intersect;
      }

      .hero-art-seamless img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 84% 54%;
      }

      /* 4 Action Cards */
      .feature-grid-4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
        margin-top: 4px;
      }

      .feature-action-card {
        border-radius: 20px;
        padding: 22px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 130px;
        border: 1px solid rgba(0, 0, 0, 0.04);
        box-shadow: 0 4px 15px -3px rgba(15, 23, 42, 0.03);
        cursor: pointer;
        text-align: left;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        position: relative;
      }
      .feature-action-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 24px -4px rgba(15, 23, 42, 0.08);
      }

      /* "How GovOS Works": the steps card and the quote card, side by side while there is room */
      .how-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 20px;
        align-items: stretch;
      }
      @media (max-width: 1100px) { .how-grid { grid-template-columns: minmax(0, 1fr); } }

      /* Popular Exams Grid */
      .popular-exams-row {
        display: grid;
        /* minmax(0,…) so a long authority name wraps inside its card instead of
           widening the track and pushing the page into a horizontal scroll. */
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 16px;
      }

      .popular-exam-card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        cursor: pointer;
        text-align: left;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        transition: all 0.2s ease;
      }
      .popular-exam-card > * { min-width: 0; }
      .popular-exam-card:hover {
        transform: translateY(-2px);
        border-color: #3b82f6;
        box-shadow: 0 6px 18px -2px rgba(59, 130, 246, 0.12);
      }

      @media (max-width: 1024px) {
        .feature-grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .popular-exams-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .hero-art-seamless { opacity: 0.55; width: 65%; }
      }
      @media (max-width: 768px) {
        .hero-seamless {
          flex-direction: column;
          align-items: stretch;
          min-height: auto;
          padding-bottom: 24px;
        }
        .hero-content-seamless {
          max-width: 100%;
        }
        .hero-art-seamless {
          position: relative;
          top: 0;
          right: 0;
          bottom: 0;
          width: 100%;
          height: 260px;
          margin-top: 12px;
          opacity: 0.85;
          -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0%, #000 15%, #000 85%, transparent 100%);
        }
        .feature-grid-4 { grid-template-columns: minmax(0, 1fr); }
        .popular-exams-row { grid-template-columns: minmax(0, 1fr); }
      }

      /* =====================================================================================
         MOTION & TYPE
         One easing family for the whole app (see ANIMATION_REVERSE_ENGINEERING.md, section O):
         osmo for travel, energy for small UI, an elastic for anything that lands, a bounce for
         hover recoveries. Durations stay under a second; nothing loops; all of it stands down for
         prefers-reduced-motion, and hover effects only run on a fine pointer.
         ===================================================================================== */
      :root {
        --font-display: 'Bricolage Grotesque', 'Plus Jakarta Sans', 'Inter', sans-serif;
        --font-accent: 'Instrument Serif', Georgia, serif;

        --ease-osmo: cubic-bezier(0.625, 0.05, 0, 1);
        --ease-energy: cubic-bezier(0.32, 0.72, 0, 1);
        --ease-bounce: cubic-bezier(0.34, 1.57, 0.64, 1);
        --ease-soft-overshoot: cubic-bezier(0.59, 1, 0.88, 1.01);
        --ease-circ-out: cubic-bezier(0, 0.55, 0.45, 1);
        --ease-elastic: linear(0, 0.0226 0.3%, 0.0691 1%, 0.1337 1.9%, 0.2135 3%, 0.3057 4.2%, 0.4072 5.7%, 0.514 7.3%, 0.6218 9%, 0.7263 10.9%, 0.8231 12.9%, 0.9086 15%, 0.98 17.2%, 1.0357 19.6%, 1.0753 22.1%, 1.0992 24.6%, 1.1094 27.3%, 1.108 30.1%, 1.0981 33%, 1.0826 36%, 1.0644 39%, 1.0459 42.2%, 1.0289 45.5%, 1.0148 48.8%, 1.004 52.3%, 0.9967 55.8%, 0.9926 59.4%, 0.991 63.1%, 0.9913 66.9%, 0.9926 70.8%, 0.9945 74.7%, 0.9964 78.7%, 0.9981 82.8%, 0.9994 87%, 1.0002 91.3%, 1.0006 95.6%, 1);
        --ease-elastic-tight: linear(0, 0.0234 0.3%, 0.0768 1%, 0.1598 1.9%, 0.2734 3%, 0.4149 4.2%, 0.5775 5.7%, 0.7497 7.3%, 0.9173 9%, 1.0649 10.9%, 1.179 12.9%, 1.25 15%, 1.2747 17.2%, 1.2565 19.6%, 1.2053 22.1%, 1.1352 24.6%, 1.0615 27.3%, 0.998 30.1%, 0.954 33%, 0.9334 36%, 0.934 39%, 0.9496 42.2%, 0.9721 45.5%, 0.9938 48.8%, 1.0093 52.3%, 1.0165 55.8%, 1.0162 59.4%, 1.0111 63.1%, 1.0045 66.9%, 0.9991 70.8%, 0.9962 74.7%, 0.9958 78.7%, 0.9971 82.8%, 0.9989 87%, 1.0004 91.3%, 1.001 95.6%, 1);

        --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px -22px rgba(15, 23, 42, 0.22);
        --shadow-stage: 0 2px 4px rgba(15, 23, 42, 0.03), 0 28px 56px -30px rgba(15, 23, 42, 0.32);
      }

      /* Display type: the two biggest heading levels only, so dense UI keeps the reading face. */
      h1, h2, .display { font-family: var(--font-display); font-optical-sizing: auto; letter-spacing: -0.02em; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      .accent-serif { font-family: var(--font-accent); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }

      /* Keyboard focus is always visible. */
      :is(button, a, input, select, textarea, [tabindex]):focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }

      .glass-card { border-radius: 18px; transition: border-color 0.3s var(--ease-energy), box-shadow 0.4s var(--ease-energy); }

      /* --- Buttons: squash fast, recover with overshoot (scale and its exact inverse transform) --- */
      .btn, .chip, .icon-btn, .nav-link {
        transition: scale 0.15s var(--ease-soft-overshoot), transform 0.35s 0.15s var(--ease-bounce),
                    background-color 0.2s var(--ease-energy), color 0.2s var(--ease-energy),
                    border-color 0.2s var(--ease-energy), box-shadow 0.3s var(--ease-energy);
      }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        .btn:is(:hover, :focus-visible):not(:disabled),
        .icon-btn:is(:hover, :focus-visible),
        .chip:is(:hover, :focus-visible) {
          scale: 0.965 0.94;
          transform: scale(1.0363, 1.0638);
        }
        .btn-primary:hover, .btn-emerald:hover { box-shadow: 0 14px 28px -14px var(--primary-glow); }
      }
      .btn:active:not(:disabled), .icon-btn:active, .chip:active { scale: 0.95; transform: none; transition-duration: 0.1s; }

      /* Letters of a CTA label jiggle once on hover: squash down, then spring back. */
      .jiggle { display: inline-flex; }
      .jiggle-char { display: inline-block; transform-origin: center; will-change: transform; }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        :is(button, a):is(:hover, :focus-visible) .jiggle-char {
          animation: charJiggle 0.725s both;
          animation-delay: calc(var(--ci, 0) * 225ms);
        }
      }
      @keyframes charJiggle {
        0%   { transform: none; animation-timing-function: cubic-bezier(0.55, 0, 1, 0.45); }
        20%  { transform: translateY(55%) scaleY(0.3) rotate(17deg); animation-timing-function: var(--ease-elastic-tight); }
        100% { transform: none; }
      }

      /* --- Interactive cards: lift with a bounce, land with a deeper "stage" shadow --- */
      .popular-exam-card, .feature-action-card, .feature-card, .stat-tile {
        transition: transform 0.45s var(--ease-bounce), box-shadow 0.4s var(--ease-energy), border-color 0.25s var(--ease-energy);
      }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        .popular-exam-card:hover, .feature-action-card:hover, .feature-card:hover {
          transform: translateY(-4px) rotate(-0.4deg);
          box-shadow: var(--shadow-stage);
        }
        .stat-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-stage); }
      }

      /* --- Entrance reveal (bound by installRevealObserver; only ever hidden while it runs) --- */
      html.motion-ok .rv-wait { opacity: 0; transform: translateY(22px) scale(0.985); }
      .rv-in {
        animation: rvIn 0.8s var(--ease-osmo) backwards;
        animation-delay: calc(var(--rv-i, 0) * 55ms);
      }
      @keyframes rvIn {
        from { opacity: 0; transform: translateY(22px) scale(0.985); }
        to   { opacity: 1; transform: none; }
      }

      /* --- View and section changes: the new content settles in from just below --- */
      @media (prefers-reduced-motion: no-preference) { .view-enter { animation: viewIn 0.55s var(--ease-osmo) backwards; } }
      @media (prefers-reduced-motion: no-preference) { .section-enter { animation: viewIn 0.5s var(--ease-osmo) backwards; } }
      @keyframes viewIn {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: none; }
      }

      /* --- The shell arrives once, from above --- */
      @media (prefers-reduced-motion: no-preference) { .topbar { animation: barIn 0.6s var(--ease-energy) 0.1s backwards; } }
      @keyframes barIn {
        from { opacity: 0; transform: translateY(-120%); }
        to   { opacity: 1; transform: none; }
      }
      .nav-link.active, .side-link.active { box-shadow: inset 0 0 0 1px rgba(43, 98, 235, 0.14); }
      .side-link { transition: background-color 0.25s var(--ease-energy), color 0.25s var(--ease-energy), padding 0.35s var(--ease-bounce); }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        .side-link:not(.active):hover { padding-left: 16px; }
      }

      /* --- Home hero: words spring in, the rest rises after them, the art opens from its corner --- */
      .hero-title { font-family: var(--font-display); font-weight: 800; }
      .hero-title .accent-serif { font-weight: 400; color: var(--primary); font-size: 1.08em; }
      .split-word { display: inline-block; transform-origin: top left; }
      @media (prefers-reduced-motion: no-preference) { .hero-in { animation: heroRise 0.55s var(--ease-energy) backwards; animation-delay: calc(0.45s + var(--hi, 0) * 75ms); } }
      @keyframes heroRise {
        from { opacity: 0; transform: translateY(-0.6em); }
        to   { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .hero-title .split-word {
          animation: wordSpring 0.875s var(--ease-elastic) backwards, wordFade 0.12s linear backwards;
          animation-delay: calc(0.2s + var(--wi, 0) * 88ms);
        }
      }
      @keyframes wordSpring {
        from { transform: translate(40%, -10%) rotate(8deg) scale(0.85, 0.1); }
        to   { transform: none; }
      }
      @keyframes wordFade { from { opacity: 0; } to { opacity: 1; } }
      @media (min-width: 769px) and (prefers-reduced-motion: no-preference) {
        .hero-art-seamless { animation: artOpen 1.1s var(--ease-circ-out) 0.3s backwards; }
      }
      @keyframes artOpen {
        from { clip-path: ellipse(20% 0% at 100% 100%); }
        to   { clip-path: ellipse(150% 130% at 100% 100%); }
      }
      /* Parallax, scrubbed by the page scroll itself (no script); browsers without scroll timelines show it still. */
      @supports (animation-timeline: scroll()) {
        @media (prefers-reduced-motion: no-preference) {
          .hero-art-seamless img {
            transform-origin: 100% 50%;      /* drift away from the masked left edge, never toward it */
            animation: heroDrift linear both;
            animation-timeline: scroll(root);
            animation-range: 0 640px;
          }
        }
      }
      @keyframes heroDrift {
        from { transform: translateY(0) scale(1.06); }
        to   { transform: translateY(56px) scale(1); }
      }


      /* =====================================================================================
         GOVOS VISUAL SYSTEM
         Ink (#0b1430) and saffron are GovOS's own pair (the wordmark's blue and orange, deepened);
         cards stay white on a cool paper ground. Large type carries hierarchy; colour marks meaning.
         ===================================================================================== */
      :root {
        --ink: #0b1430;
        --ink-2: #13224d;
        --saffron: #ff7a2f;
        --saffron-text: #c0480a;      /* saffron that clears 4.5:1 on white */
        --paper: #f4f6fb;
        --hairline: #e5e9f2;
      }
      body { background-color: var(--paper); }
      .glass-card { border-radius: 22px; border-color: var(--hairline); }

      /* Tones: one per authority (passToneOf), shared by the exam passes and the exam's command stage.
         Each is dark enough for white text at small sizes. */
      .pass-ink     { background: radial-gradient(120% 90% at 100% 0%, #24366f 0%, transparent 55%), linear-gradient(160deg, #16244f 0%, #0b1430 100%); }
      .pass-saffron { background: radial-gradient(120% 90% at 100% 0%, #ae4715 0%, transparent 55%), linear-gradient(160deg, #b13b0b 0%, #7c2d12 100%); }
      .pass-jade    { background: radial-gradient(120% 90% at 100% 0%, #0f746b 0%, transparent 55%), linear-gradient(160deg, #0f766e 0%, #053d37 100%); }
      .pass-plum    { background: radial-gradient(120% 90% at 100% 0%, #7c3aed 0%, transparent 55%), linear-gradient(160deg, #5b21b6 0%, #2e1065 100%); }
      .pass-tide    { background: radial-gradient(120% 90% at 100% 0%, #235edf 0%, transparent 55%), linear-gradient(160deg, #1d4ed8 0%, #172554 100%); }

      /* --- Shell: a floating bar that condenses once the page scrolls --- */
      .topbar {
        position: sticky; top: 12px;
        transition: padding 0.45s var(--ease-osmo), box-shadow 0.45s var(--ease-osmo), background-color 0.3s;
        box-shadow: 0 1px 2px rgba(11, 20, 48, 0.04), 0 12px 32px -24px rgba(11, 20, 48, 0.35);
      }
      .topbar[data-scrolled="true"] {
        padding-top: 5px; padding-bottom: 5px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 1px 2px rgba(11, 20, 48, 0.06), 0 18px 40px -24px rgba(11, 20, 48, 0.45);
      }
      .brand-word { font-family: var(--font-display); font-size: 1.7rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1.02; }
      .brand > span { transition: opacity 0.3s, max-height 0.45s var(--ease-osmo); max-height: 20px; overflow: hidden; }
      .topbar[data-scrolled="true"] .brand > span { opacity: 0; max-height: 0; }
      .nav-link.active { background: var(--ink); color: #fff; box-shadow: none; }
      .nav-link.active svg { color: #fff; }

      /* --- Home: chapters, each opened by a numbered display heading --- */
      .home-chapter { margin-top: clamp(72px, 9vw, 132px); }
      .chapter-header { margin-bottom: 30px; }
      .chapter-eyebrow {
        display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
        font-size: 0.74rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-muted);
      }
      .chapter-index {
        font-family: var(--font-display); letter-spacing: 0.02em; color: var(--saffron-text);
        border: 1px solid rgba(192, 72, 10, 0.35); border-radius: 999px; padding: 2px 10px;
      }
      .chapter-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
      .chapter-title {
        font-size: clamp(2rem, 1.15rem + 2.8vw, 3.6rem); line-height: 1.02; letter-spacing: -0.045em;
        font-weight: 800; color: var(--ink); max-width: 18ch; margin: 0;
      }
      .chapter-title .accent-serif, .journey-title .accent-serif { color: var(--primary); font-size: 1.06em; }
      .chapter-sub { font-size: 1.04rem; color: var(--text-secondary); max-width: 60ch; margin: 14px 0 0; line-height: 1.55; }
      .chapter-link {
        display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
        font-family: var(--font-sans); font-size: 0.95rem; font-weight: 700; color: var(--primary); padding: 6px 0;
      }
      .chapter-link svg { transition: transform 0.45s var(--ease-bounce); }
      .chapter-link:hover svg { transform: translateX(5px); }

      /* --- The opening stage --- */
      .cine-hero {
        position: relative; isolation: isolate; overflow: hidden;
        margin-top: 6px; border-radius: 36px; color: #fff;
        padding: clamp(28px, 5vw, 64px) clamp(22px, 5vw, 64px) clamp(24px, 3.5vw, 40px);
        min-height: clamp(540px, 80vh, 740px);
        display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr); grid-template-rows: 1fr auto;
        column-gap: clamp(24px, 4vw, 56px); row-gap: 32px;
        background:
          radial-gradient(900px 520px at 88% 8%, rgba(255, 122, 47, 0.30), transparent 60%),
          radial-gradient(800px 560px at 6% 104%, rgba(43, 98, 235, 0.42), transparent 62%),
          linear-gradient(165deg, #0b1430 0%, #111f4a 55%, #0a1230 100%);
        box-shadow: 0 50px 90px -60px rgba(11, 20, 48, 0.9);
      }
      .cine-grid {
        position: absolute; inset: -40px; z-index: -1; pointer-events: none;
        background-image: linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
                          linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(70% 70% at 30% 40%, #000 0%, transparent 75%);
                mask-image: radial-gradient(70% 70% at 30% 40%, #000 0%, transparent 75%);
        transform: translate3d(calc(var(--mx, 0) * -10px), calc(var(--my, 0) * -10px), 0);
        transition: transform 0.9s var(--ease-osmo);
      }
      .cine-glow {
        position: absolute; z-index: -1; pointer-events: none; width: 520px; height: 520px; border-radius: 50%;
        right: -120px; top: -160px; background: radial-gradient(circle, rgba(255, 122, 47, 0.35) 0%, transparent 65%);
        transform: translate3d(calc(var(--mx, 0) * 28px), calc(var(--my, 0) * 22px), 0);
        transition: transform 1.2s var(--ease-osmo);
      }
      .cine-copy { align-self: center; position: relative; z-index: 2; min-width: 0; }
      .cine-eyebrow {
        display: inline-flex; align-items: center; gap: 10px;
        font-size: 0.76rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #ffc4a3;
      }
      .cine-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--saffron); box-shadow: 0 0 0 4px rgba(255, 122, 47, 0.22); }
      .cine-title {
        font-size: clamp(2.6rem, 1.2rem + 4.2vw, 4.6rem) !important; line-height: 0.98 !important; letter-spacing: -0.05em !important;
        color: #fff !important; margin: 20px 0 22px !important;
      }
      .cine-title .accent-serif { color: #ffa36e; font-size: 1.08em; letter-spacing: -0.02em; }
      .cine-lede { font-size: clamp(1rem, 0.92rem + 0.35vw, 1.16rem); line-height: 1.6; color: rgba(255, 255, 255, 0.8); max-width: 34rem; margin: 0 0 28px; }
      .cine-search {
        display: flex; align-items: center; gap: 12px; max-width: 34rem; height: 64px; padding: 0 8px 0 22px;
        background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 999px;
        color: rgba(255, 255, 255, 0.75);
        -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
        transition: border-color 0.3s var(--ease-energy), background-color 0.3s var(--ease-energy), box-shadow 0.4s var(--ease-energy);
      }
      .cine-search:focus-within { border-color: rgba(255, 163, 110, 0.9); background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 0 6px rgba(255, 122, 47, 0.16); }
      .cine-search input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #fff; font-family: var(--font-sans); font-size: 1.02rem; }
      .cine-search input::placeholder { color: rgba(255, 255, 255, 0.6); }
      .cine-search input:focus-visible { outline: none; }
      .cine-search-go {
        flex-shrink: 0; width: 48px; height: 48px; border-radius: 50%; border: none; cursor: pointer;
        background: var(--saffron); color: var(--ink); display: inline-flex; align-items: center; justify-content: center;
        transition: transform 0.45s var(--ease-bounce), background-color 0.2s;
      }
      .cine-search-go:hover { transform: rotate(-45deg) scale(1.06); }
      .cine-chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 18px 0 30px; }
      .cine-chips > span { font-size: 0.8rem; font-weight: 700; color: rgba(255, 255, 255, 0.7); margin-right: 4px; }
      .chip.cine-chip { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.2); color: #fff; }
      .chip.cine-chip:hover { border-color: rgba(255, 163, 110, 0.9); color: #fff; background: rgba(255, 255, 255, 0.12); }
      .cine-actions { display: flex; gap: 12px; flex-wrap: wrap; }
      .btn.cine-cta {
        height: 58px; padding: 0 30px; border-radius: 999px; background: var(--saffron); color: var(--ink);
        font-family: var(--font-display); font-size: 1.08rem; font-weight: 800; letter-spacing: -0.01em;
        box-shadow: 0 18px 40px -16px rgba(255, 122, 47, 0.75);
      }
      .btn.cine-ghost {
        height: 58px; padding: 0 26px; border-radius: 999px; background: transparent; color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3); font-size: 1rem; font-weight: 700;
      }
      .btn.cine-ghost:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.55); }
      .cine-visual { position: relative; min-height: 440px; z-index: 1; }
      .cine-window {
        position: absolute; inset: 4% 2% 12% 10%; margin: 0; border-radius: 30px; overflow: hidden;
        box-shadow: 0 50px 100px -40px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.14);
        transform: rotate(-3deg) translate3d(calc(var(--mx, 0) * 14px), calc(var(--my, 0) * 10px), 0);
        transition: transform 1s var(--ease-osmo);
      }
      /* object-position keeps the right of the scene: the reference art carries a stray UI element at its left edge */
      .cine-window img { width: 100%; height: 100%; object-fit: cover; object-position: 82% 50%; display: block; transform: scale(1.04); }
      .cine-milestone {
        position: absolute; z-index: 2; display: flex; flex-direction: column; gap: 2px; text-align: left;
        min-width: 210px; max-width: 250px; padding: 14px 16px; border-radius: 18px; border: none; cursor: pointer;
        background: #fff; color: var(--ink); font-family: var(--font-sans);
        box-shadow: 0 24px 50px -24px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(11, 20, 48, 0.06);
        transform: translate3d(calc(var(--mx, 0) * var(--depth, 20px)), calc(var(--my, 0) * var(--depth, 20px)), 0);
        transition: transform 0.9s var(--ease-osmo), box-shadow 0.4s var(--ease-energy);
      }
      .cine-milestone:hover { box-shadow: 0 30px 60px -24px rgba(0, 0, 0, 0.7), 0 0 0 2px var(--saffron); }
      .cine-milestone-0 { left: 0; top: 10%; --depth: 30px; }
      .cine-milestone-1 { right: -2%; top: 46%; --depth: 46px; }
      .cine-milestone-2 { left: 8%; bottom: 2%; --depth: 22px; }
      .cine-milestone-code { font-family: var(--font-display); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--saffron-text); }
      .cine-milestone-label { font-size: 0.88rem; font-weight: 700; line-height: 1.3; }
      .cine-milestone-when { font-size: 0.8rem; color: var(--text-secondary); }
      .cine-milestone-when strong { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); }
      .cine-stats {
        grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px 56px; margin: 0;
        padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, 0.14); position: relative; z-index: 2;
      }
      .cine-stats dt { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.72); }
      .cine-stats dd { margin: 4px 0 0; font-family: var(--font-display); font-size: clamp(1.8rem, 1.3rem + 1.4vw, 2.6rem); font-weight: 800; letter-spacing: -0.04em; color: #fff; }
      @media (prefers-reduced-motion: no-preference) {
        .cine-milestone { animation: chipPop 0.9s var(--ease-elastic) backwards; animation-delay: calc(0.95s + var(--mi, 0) * 140ms); }
        .cine-window { animation: windowIn 1.2s var(--ease-osmo) 0.25s backwards; }
      }
      @keyframes chipPop {
        from { opacity: 0; scale: 0.6; rotate: -8deg; }
        to   { opacity: 1; scale: 1; rotate: 0deg; }
      }
      @keyframes windowIn {
        from { opacity: 0; translate: 0 60px; rotate: 6deg; scale: 0.92; }
        to   { opacity: 1; translate: 0 0; rotate: 0deg; scale: 1; }
      }
      /* Leaving the stage: the copy drifts up and the window sinks, at two speeds, scrubbed by the scroll itself. */
      @supports (animation-timeline: view()) {
        @media (prefers-reduced-motion: no-preference) {
          .cine-copy { animation: cineCopyOut linear both; animation-timeline: view(); animation-range: exit 0% exit 90%; }
          .cine-visual { animation: cineVisualOut linear both; animation-timeline: view(); animation-range: exit 0% exit 100%; }
        }
      }
      @keyframes cineCopyOut { to { translate: 0 -70px; opacity: 0.25; } }
      @keyframes cineVisualOut { to { translate: 0 90px; } }

      /* --- Exam passes --- */
      .pass-rail { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 18px; }
      .popular-exam-card.pass {
        position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; align-items: stretch;
        min-height: 330px; padding: 22px; border-radius: 26px; border: none; text-align: left; cursor: pointer; color: #fff;
        font-family: var(--font-sans); gap: 0;
        box-shadow: 0 30px 60px -40px rgba(11, 20, 48, 0.75);
        transform: perspective(900px) rotateX(calc(var(--ty, 0) * -5deg)) rotateY(calc(var(--tx, 0) * 7deg));
        transition: transform 0.6s var(--ease-osmo), box-shadow 0.45s var(--ease-energy), translate 0.5s var(--ease-bounce);
      }
      .popular-exam-card.pass::after {
        content: ''; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0;
        background: radial-gradient(circle at calc(50% + var(--tx, 0) * 50%) calc(50% + var(--ty, 0) * 50%), rgba(255, 255, 255, 0.22), transparent 55%);
        transition: opacity 0.4s var(--ease-energy);
      }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        .popular-exam-card.pass:hover { translate: 0 -8px; box-shadow: 0 40px 70px -36px rgba(11, 20, 48, 0.85); }
        .popular-exam-card.pass:hover::after { opacity: 1; }
        .popular-exam-card.pass:hover .pass-arrow { transform: rotate(45deg) scale(1.15); }
      }
      .pass-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .pass-kicker { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255, 255, 255, 0.92); }
      .pass-arrow { transition: transform 0.5s var(--ease-bounce); flex-shrink: 0; }
      .pass-code {
        margin-top: auto; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.05em; line-height: 0.92;
        font-size: clamp(2.1rem, 1.6rem + 1.2vw, 2.9rem);
      }
      .pass-sub { margin-top: 8px; font-size: 0.86rem; line-height: 1.35; color: rgba(255, 255, 255, 0.9); }
      .pass-perf { position: relative; display: block; margin: 20px -22px 16px; border-top: 2px dashed rgba(255, 255, 255, 0.3); }
      .pass-perf::before, .pass-perf::after {
        content: ''; position: absolute; top: -12px; width: 22px; height: 22px; border-radius: 50%; background: var(--paper);
      }
      .pass-perf::before { left: -11px; }
      .pass-perf::after { right: -11px; }
      .pass-foot { display: flex; flex-direction: column; gap: 2px; min-height: 52px; }
      .pass-next-label { font-size: 0.8rem; font-weight: 600; color: rgba(255, 255, 255, 0.92); line-height: 1.35; }
      .pass-next-when { font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; color: #fff; }
      .pass-next-when strong { font-size: 2rem; font-weight: 800; letter-spacing: -0.04em; margin-right: 2px; }
      .popular-exam-card.pass.pass-missing { background: #fff; color: var(--ink); box-shadow: inset 0 0 0 2px #dfe5f0; }
      .pass-missing .pass-kicker, .pass-missing .pass-sub, .pass-missing .pass-next-label { color: var(--text-secondary); }
      .pass-missing .pass-perf { border-top-color: #dfe5f0; }

      /* --- The journey, told as the page scrolls --- */
      .journey {
        margin-top: clamp(80px, 10vw, 150px);
        display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.15fr); gap: clamp(28px, 6vw, 96px);
      }
      .journey-sticky { position: sticky; top: 118px; align-self: start; }
      .journey-title {
        font-size: clamp(2.2rem, 1.2rem + 3.2vw, 4.2rem); line-height: 1; letter-spacing: -0.05em; font-weight: 800;
        color: var(--ink); margin: 0;
      }
      .journey-steps { list-style: none; position: relative; margin: 0; padding: 0 0 0 64px; view-timeline: --journey block; }
      .journey-line { position: absolute; left: 21px; top: 30px; bottom: 30px; width: 2px; background: var(--hairline); border-radius: 2px; overflow: hidden; }
      .journey-line-fill { position: absolute; inset: 0; background: linear-gradient(var(--primary), var(--saffron)); transform-origin: top; }
      .journey-step { position: relative; display: grid; grid-template-columns: 1fr; padding: 26px 0 28px; border-bottom: 1px solid var(--hairline); }
      .journey-step:last-child { border-bottom: none; }
      .journey-num {
        position: absolute; left: -64px; top: 24px; width: 44px; height: 44px; border-radius: 50%;
        display: inline-flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-size: 0.95rem; font-weight: 800; color: var(--ink);
        background: #fff; box-shadow: 0 0 0 1px var(--hairline), 0 10px 24px -14px rgba(11, 20, 48, 0.4);
      }
      .journey-verb { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--saffron-text); }
      .journey-step-title { font-family: var(--font-display); font-size: clamp(1.3rem, 1.1rem + 0.7vw, 1.75rem); font-weight: 800; letter-spacing: -0.03em; color: var(--ink); margin: 6px 0 6px; }
      .journey-text { font-size: 0.98rem; line-height: 1.55; color: var(--text-secondary); margin: 0; max-width: 46ch; }
      .journey-link {
        margin-top: 12px; display: inline-flex; align-items: center; gap: 6px; padding: 0; background: none; border: none; cursor: pointer;
        font-family: var(--font-sans); font-size: 0.92rem; font-weight: 700; color: var(--primary);
      }
      .journey-link svg { transition: transform 0.45s var(--ease-bounce); }
      .journey-link:hover svg { transform: translateX(5px); }
      @supports (animation-timeline: view()) {
        @media (prefers-reduced-motion: no-preference) {
          .journey-line-fill { animation: lineFill linear both; animation-timeline: --journey; animation-range: entry 40% exit 60%; }
          .journey-num { animation: numLight linear both; animation-timeline: view(); animation-range: entry 70% cover 45%; }
        }
      }
      @keyframes lineFill { from { transform: scaleY(0); } to { transform: scaleY(1); } }
      @keyframes numLight {
        from { background: #fff; color: var(--ink); }
        to   { background: var(--ink); color: #fff; box-shadow: 0 0 0 6px rgba(43, 98, 235, 0.14), 0 14px 28px -12px rgba(11, 20, 48, 0.6); }
      }

      /* --- A typographic pause between chapters --- */
      .pull-quote { margin: clamp(80px, 10vw, 140px) auto 0; max-width: 980px; text-align: center; color: var(--ink); }
      .pull-quote svg { color: var(--saffron-text); margin-bottom: 10px; }
      .pull-quote blockquote { margin: 0; font-size: clamp(1.9rem, 1rem + 3.2vw, 3.6rem); line-height: 1.12; letter-spacing: -0.02em; }
      .pq-word { display: inline-block; white-space: pre; }
      @media (prefers-reduced-motion: no-preference) {
        html.motion-ok .pull-quote.rv-wait .pq-word { opacity: 0; }
        .pull-quote.rv-seen .pq-word { animation: pqWord 0.7s var(--ease-osmo) backwards; animation-delay: calc(0.15s + var(--qi, 0) * 55ms); }
      }
      @keyframes pqWord { from { opacity: 0; transform: translateY(0.35em) rotate(2deg); } to { opacity: 1; transform: none; } }

      /* --- The exam's command stage --- */
      .glass-card.exam-hero {
        position: relative; isolation: isolate; overflow: hidden; color: #fff; border: none; border-radius: 30px;
        padding: clamp(22px, 3vw, 36px);
        box-shadow: 0 40px 80px -50px rgba(11, 20, 48, 0.85);
      }
      .exam-hero-grid {
        position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background-image: linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 48px 48px;
        -webkit-mask-image: linear-gradient(105deg, transparent 30%, #000 100%); mask-image: linear-gradient(105deg, transparent 30%, #000 100%);
      }
      .exam-hero-main { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
      .exam-hero-id { display: flex; align-items: center; gap: 18px; min-width: 0; flex: 1 1 420px; }
      .exam-hero .exam-logo {
        width: 68px; height: 68px; border-radius: 20px; font-family: var(--font-display); font-size: 1rem;
        background: rgba(255, 255, 255, 0.12); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
      }
      .exam-hero-kicker { font-size: 0.76rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.85); }
      .exam-hero h2 {
        font-size: clamp(1.7rem, 1.05rem + 2.2vw, 2.9rem); line-height: 1.02; letter-spacing: -0.045em; font-weight: 800;
        color: #fff; margin: 6px 0 12px;
      }
      .exam-hero-badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
      .exam-hero-next { text-align: right; flex: 0 1 auto; min-width: 180px; }
      .exam-hero-next-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255, 255, 255, 0.92); }
      .exam-hero-next-value { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: #fff; line-height: 1.05; margin-top: 4px; }
      .exam-hero-days { font-size: clamp(2.8rem, 2rem + 2.4vw, 4rem); font-weight: 800; letter-spacing: -0.05em; }
      .exam-hero-next-what { font-size: 0.86rem; color: rgba(255, 255, 255, 0.88); margin-top: 6px; max-width: 30ch; margin-left: auto; }
      .exam-stage-rail { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-wrap: wrap; align-items: center; row-gap: 10px; }
      .exam-stage-rail li { display: inline-flex; align-items: center; gap: 8px; font-size: 0.86rem; font-weight: 600; color: rgba(255, 255, 255, 0.92); }
      .exam-stage-rail li + li::before {
        content: ''; width: 30px; height: 2px; margin: 0 12px; background: rgba(255, 255, 255, 0.35); border-radius: 2px; transform-origin: left;
      }
      .exam-stage-dot {
        width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
        font-family: var(--font-display); font-size: 0.72rem; font-weight: 800; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.5);
      }
      .exam-hero-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 26px; }
      .exam-hero .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border-color: rgba(255, 255, 255, 0.24); }
      .exam-hero .btn-secondary:hover { background: rgba(255, 255, 255, 0.18); border-color: rgba(255, 255, 255, 0.45); }
      .exam-hero .icon-btn { border-color: rgba(255, 255, 255, 0.24); }
      @media (prefers-reduced-motion: no-preference) {
        .exam-hero-id, .exam-hero-next { animation: heroRise 0.6s var(--ease-energy) backwards; }
        .exam-hero-next { animation-delay: 0.12s; }
        .exam-stage-rail li { animation: heroRise 0.5s var(--ease-energy) backwards; animation-delay: calc(0.2s + var(--ri, 0) * 90ms); }
        .exam-stage-rail li + li::before { animation: railDraw 0.5s var(--ease-osmo) backwards; animation-delay: calc(0.15s + var(--ri, 0) * 90ms); }
        .exam-hero-actions { animation: heroRise 0.55s var(--ease-energy) 0.3s backwards; }
      }
      @keyframes railDraw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

      /* The exam's description reads as an editorial lead, not a gradient banner */
      .exam-banner {
        background: #fff; border: 1px solid var(--hairline); border-radius: 22px; position: relative; overflow: hidden;
        box-shadow: var(--shadow-card); padding: 24px 28px 24px 34px;
      }
      .exam-banner::before { content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 4px; border-radius: 0 4px 4px 0; background: linear-gradient(var(--primary), var(--saffron)); }
      .exam-banner > div:first-child { font-size: 1.04rem !important; line-height: 1.6 !important; color: var(--text-primary) !important; }

      /* The four milestone tiles read as one ticket strip */
      .tile-strip {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr));
        background: #fff; border: 1px solid var(--hairline); border-radius: 22px; overflow: hidden;
        box-shadow: var(--shadow-card);
      }
      .tile-strip .stat-tile { border: none; border-radius: 0; box-shadow: none; padding: 18px 20px; border-right: 1px dashed var(--hairline); }
      .tile-strip .stat-tile:last-child { border-right: none; }
      .tile-strip .stat-tile .tile-value { font-family: var(--font-display); font-size: 1.22rem; letter-spacing: -0.02em; }
      .tile-strip .stat-tile:hover { transform: none; box-shadow: none; background: var(--surface-2); }

      /* The exam's main pane is a fixed-height flex column on a desktop: its blocks keep their height and the pane
         scrolls (a child with overflow: hidden would otherwise shrink to nothing). */
      .exam-main-content > * { flex-shrink: 0; }

      /* Exam navigation: the current part sits on ink */
      .side-link.active { background: var(--ink); color: #fff; box-shadow: none; }
      .side-link.active svg { color: #fff; }
      .side-nav { border-radius: 24px; }

      /* --- Layout: tablet and phone compositions --- */
      @media (max-width: 1100px) {
        .pass-rail {
          display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: minmax(230px, 30%);
          overflow-x: auto; scroll-snap-type: x mandatory; padding: 6px 4px 18px; margin: 0 -4px; scrollbar-width: none;
        }
        .pass-rail::-webkit-scrollbar { display: none; }
        .popular-exam-card.pass { scroll-snap-align: start; }
      }
      @media (max-width: 900px) {
        .cine-hero { grid-template-columns: minmax(0, 1fr); min-height: 0; border-radius: 28px; }
        .cine-visual { min-height: 360px; }
        .cine-window { inset: 0 4% 18% 4%; }
        .cine-milestone-0 { left: -2%; top: auto; bottom: 22%; }
        .cine-milestone-1 { right: -2%; top: 6%; }
        .cine-milestone-2 { display: none; }
        .journey { grid-template-columns: minmax(0, 1fr); }
        .journey-sticky { position: static; }
      }
      @media (max-width: 600px) {
        .cine-hero { border-radius: 24px; margin-left: -6px; margin-right: -6px; }
        .cine-search { height: 56px; padding-left: 16px; }
        .cine-actions .btn { flex: 1 1 auto; }
        .cine-visual { min-height: 300px; }
        .cine-milestone { min-width: 0; max-width: 72%; padding: 11px 13px; }
        .cine-stats { gap: 14px 28px; }
        .pass-rail { grid-auto-columns: 78%; }
        .popular-exam-card.pass { min-height: 300px; }
        .journey-steps { padding-left: 54px; }
        .journey-num { left: -54px; width: 40px; height: 40px; }
        .journey-line { left: 19px; }
        .exam-hero-id { flex-direction: column; align-items: flex-start; gap: 12px; }
        .exam-hero .exam-logo { width: 54px; height: 54px; border-radius: 16px; }
        .exam-hero-next { text-align: left; }
        .brand > span { display: none; }
        /* The bar wraps: brand and actions on top, the navigation a full-width swipeable row beneath. */
        .topbar { flex-wrap: wrap !important; border-radius: 24px; row-gap: 6px; padding: 8px 14px; }
        .topbar nav { order: 3; flex: 1 0 100%; }
        .exam-hero-next-what { margin-left: 0; }
        .exam-stage-rail li + li::before { width: 16px; margin: 0 8px; }
      }

      /* =====================================================================================
         PAGES: every top-level page opens on the same dark stage; exams keep their tones inside.
         ===================================================================================== */
      .page-stage {
        position: relative; isolation: isolate; overflow: hidden; color: #fff;
        border-radius: 32px; padding: clamp(26px, 4vw, 48px) clamp(22px, 4vw, 52px);
        background:
          radial-gradient(700px 380px at 92% 0%, rgba(255, 122, 47, 0.26), transparent 60%),
          radial-gradient(640px 420px at 0% 110%, rgba(43, 98, 235, 0.40), transparent 62%),
          linear-gradient(165deg, #0b1430 0%, #111f4a 60%, #0a1230 100%);
        box-shadow: 0 40px 80px -56px rgba(11, 20, 48, 0.9);
      }
      .page-stage-grid {
        position: absolute; inset: 0; z-index: -1; pointer-events: none;
        background-image: linear-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.055) 1px, transparent 1px);
        background-size: 56px 56px;
        -webkit-mask-image: linear-gradient(100deg, transparent 35%, #000 100%); mask-image: linear-gradient(100deg, transparent 35%, #000 100%);
      }
      .page-stage-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
      .page-stage-copy { min-width: 0; flex: 1 1 520px; }
      .page-stage-eyebrow {
        display: inline-flex; align-items: center; gap: 10px;
        font-size: 0.76rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #ffc4a3;
      }
      .page-stage-icon { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: rgba(255, 122, 47, 0.18); color: #ffc4a3; }
      .page-stage-title {
        font-family: var(--font-display); font-size: clamp(2.1rem, 1.2rem + 3vw, 3.9rem); line-height: 1; letter-spacing: -0.05em;
        font-weight: 800; color: #fff; margin: 16px 0 14px; max-width: 20ch;
      }
      .page-stage-title .accent-serif { color: #ffa36e; font-size: 1.06em; letter-spacing: -0.02em; }
      .page-stage-lede { font-size: clamp(0.98rem, 0.92rem + 0.3vw, 1.1rem); line-height: 1.6; color: rgba(255, 255, 255, 0.82); max-width: 64ch; margin: 0; }
      .page-stage-actions { display: flex; gap: 10px; flex-wrap: wrap; }
      .page-stage-stats { display: flex; flex-wrap: wrap; gap: 12px 52px; margin: 28px 0 0; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.14); }
      .page-stage-stats dt { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.74); }
      .page-stage-stats dd { margin: 4px 0 0; font-family: var(--font-display); font-size: clamp(1.7rem, 1.3rem + 1.2vw, 2.4rem); font-weight: 800; letter-spacing: -0.04em; color: #fff; }
      .page-stage-foot { margin-top: 24px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.14); }
      .page-stage-stats + .page-stage-foot { border-top: none; padding-top: 0; margin-top: 22px; }
      @media (prefers-reduced-motion: no-preference) {
        .page-stage-eyebrow { animation: heroRise 0.5s var(--ease-energy) 0.05s backwards; }
        .page-stage-title { animation: heroRise 0.7s var(--ease-energy) 0.1s backwards; }
        .page-stage-lede, .page-stage-actions { animation: heroRise 0.6s var(--ease-energy) 0.2s backwards; }
        .page-stage-stats > div { animation: heroRise 0.55s var(--ease-energy) 0.28s backwards; }
        .page-stage-stats > div:nth-child(2) { animation-delay: 0.35s; }
        .page-stage-stats > div:nth-child(3) { animation-delay: 0.42s; }
        .page-stage-foot { animation: heroRise 0.55s var(--ease-energy) 0.4s backwards; }
      }

      /* Buttons that sit on a dark stage or a toned pass */
      .btn.stage-cta {
        height: 48px; padding: 0 22px; border: none; border-radius: 999px; background: var(--saffron); color: var(--ink);
        font-family: var(--font-display); font-size: 0.98rem; font-weight: 800; box-shadow: 0 16px 34px -16px rgba(255, 122, 47, 0.75);
      }
      .btn.stage-cta:hover { background: #ff8a47; }
      .btn.stage-ghost {
        height: 48px; padding: 0 20px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3); font-size: 0.92rem; font-weight: 700;
      }
      .btn.stage-ghost:hover { background: rgba(255, 255, 255, 0.15); border-color: rgba(255, 255, 255, 0.55); }
      .btn.stage-ghost.is-on { background: #fff; color: var(--ink); border-color: transparent; }

      /* A segmented switch: on the stage (light text) and on paper (.seg-light) */
      .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.18); max-width: 100%; }
      .seg button {
        display: inline-flex; align-items: center; gap: 8px; border: none; background: transparent; cursor: pointer;
        color: rgba(255, 255, 255, 0.86); font-family: var(--font-sans); font-weight: 700; font-size: 0.9rem; padding: 10px 18px; border-radius: 999px;
        transition: background-color 0.35s var(--ease-energy), color 0.35s var(--ease-energy);
      }
      .seg button:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
      .seg button.on { background: #fff; color: var(--ink); }
      .seg-count { font-family: var(--font-display); font-size: 0.78rem; padding: 1px 8px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); }
      .seg button.on .seg-count { background: var(--ink); color: #fff; }
      .seg.seg-light { background: #fff; border-color: var(--hairline); box-shadow: var(--shadow-card); align-self: flex-start; }
      .seg.seg-light button { color: var(--text-secondary); }
      .seg.seg-light button:hover { color: var(--ink); background: var(--surface-2); }
      .seg.seg-light button.on { background: var(--ink); color: #fff; }
      .seg.seg-light .seg-count { background: var(--surface-3); color: var(--text-secondary); }
      .seg.seg-light button.on .seg-count { background: rgba(255, 255, 255, 0.2); color: #fff; }

      /* An empty page says what to do next, large */
      .empty-stage { text-align: center; padding: clamp(40px, 6vw, 72px) 24px; background: #fff; border: 1.5px dashed #cfd7e6; border-radius: 28px; }
      .empty-stage-mark {
        width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center;
        background: var(--ink); color: #fff; rotate: -6deg; box-shadow: 0 18px 30px -16px rgba(11, 20, 48, 0.6);
      }
      .empty-stage h3 { font-family: var(--font-display); font-size: clamp(1.4rem, 1.1rem + 1vw, 1.9rem); letter-spacing: -0.03em; color: var(--ink); margin: 0 0 8px; }
      .empty-stage p { color: var(--text-secondary); max-width: 48ch; margin: 0 auto 22px; line-height: 1.55; }

      /* --- My Exams: the shelf of passes --- */
      .shelf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 20px; }
      .shelf-pass {
        position: relative; isolation: isolate; overflow: hidden; color: #fff; border-radius: 26px; padding: 22px;
        display: flex; flex-direction: column; min-height: 340px; box-shadow: 0 30px 60px -40px rgba(11, 20, 48, 0.75);
        transition: translate 0.5s var(--ease-bounce), box-shadow 0.45s var(--ease-energy);
      }
      .shelf-pass-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
      .shelf-pass-top .pass-kicker { letter-spacing: 0.1em; line-height: 1.35; min-width: 0; }
      .shelf-pass-flags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; flex-shrink: 0; max-width: 55%; }
      .shelf-flag { display: inline-flex; align-items: center; gap: 4px; font-size: 0.68rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); color: #fff; white-space: nowrap; }
      .shelf-flag-on { background: #fff; color: var(--ink); }
      .shelf-pass-code { margin-top: auto; padding-top: 28px; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.05em; line-height: 0.92; font-size: clamp(2.2rem, 1.7rem + 1.3vw, 3.1rem); }
      .shelf-pass-next { display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
      .shelf-pass-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
      .shelf-pass-actions .btn { height: 42px; font-size: 0.88rem; }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        .shelf-pass:hover { translate: 0 -6px; box-shadow: 0 40px 70px -36px rgba(11, 20, 48, 0.85); }
      }

      /* --- Compare: two passes facing each other, then the matrix --- */
      .vs-deck { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: stretch; }
      .vs-pass {
        position: relative; isolation: isolate; overflow: hidden; color: #fff; border-radius: 26px; padding: 22px 24px;
        display: flex; flex-direction: column; min-height: 270px; min-width: 0; box-shadow: 0 30px 60px -40px rgba(11, 20, 48, 0.75);
      }
      .vs-disc {
        align-self: center; position: relative; z-index: 2; width: 64px; height: 64px; margin: 0 -18px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center; background: #fff; color: var(--ink);
        font-family: var(--font-accent); font-style: italic; font-size: 1.6rem; box-shadow: 0 0 0 7px var(--paper), 0 14px 30px -14px rgba(11, 20, 48, 0.5);
      }
      .vs-select { position: relative; display: flex; flex-direction: column; gap: 8px; }
      .vs-select select {
        appearance: none; -webkit-appearance: none; width: 100%; padding: 11px 40px 11px 14px; border-radius: 14px; cursor: pointer;
        background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff;
        font-family: var(--font-sans); font-weight: 700; font-size: 0.92rem;
      }
      .vs-select select:hover { background: rgba(255, 255, 255, 0.16); }
      .vs-select select:focus-visible { outline: 2px solid #ffa36e; outline-offset: 2px; }
      .vs-select option { color: var(--ink); background: #fff; }
      .vs-select svg { position: absolute; right: 14px; bottom: 14px; pointer-events: none; }
      .vs-code { margin-top: auto; padding-top: 24px; font-family: var(--font-display); font-weight: 800; letter-spacing: -0.05em; line-height: 0.92; font-size: clamp(2.2rem, 1.6rem + 1.6vw, 3.3rem); }
      .vs-foot { display: flex; flex-direction: column; gap: 2px; }
