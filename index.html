      .btn.stage-ghost.is-on { background: var(--tone-fg, #000); color: var(--c-violet); }
      .pass-saffron .btn.stage-ghost:hover, .pass-jade .btn.stage-ghost:hover, .pass-plum .btn.stage-ghost:hover, .pass-tide .btn.stage-ghost:hover,
      .pass-saffron .btn.stage-ghost.is-on, .pass-jade .btn.stage-ghost.is-on, .pass-plum .btn.stage-ghost.is-on, .pass-tide .btn.stage-ghost.is-on { color: #fff; }
      .vs-select select { background: color-mix(in srgb, var(--tone-fg) 10%, transparent); border: 2px solid var(--tone-fg); color: var(--tone-fg); }
      .vs-select select:focus-visible { outline: 3px solid var(--c-magenta); }
      .vs-disc { box-shadow: 0 0 0 7px #fff, 0 0 0 9px #000; font-family: var(--font-hand); font-style: normal; font-size: 1.8rem; }
      .agenda-exam, .ask-context-exam { color: var(--tone-fg); box-shadow: none; }
      .shelf-pass, .vs-pass { border: 2px solid #000; }
      .glass-card.exam-hero { border: 2px solid #000; border-radius: 34px; }
      .tl-exam { border: 2px solid #000; border-radius: 30px; box-shadow: none; }

      /* --- Page stages: a flat colour field with a wavy foot, black type --- */
      .page-stage { color: #000; background: var(--stage-bg, var(--c-yellow)); box-shadow: none; border-radius: 36px; padding-bottom: clamp(70px, 8vw, 110px); }
      .page-stage-grid { display: none; }
      .stage-waves { position: absolute; left: 0; bottom: 0; width: 100%; height: 46%; z-index: -1; }
      .stage-waves .w1 { fill: color-mix(in srgb, var(--stage-bg) 55%, #fff); }
      .stage-waves .w2 { fill: color-mix(in srgb, var(--stage-bg) 82%, #000 18%); opacity: 0.35; }
      .stage-waves .w3 { fill: color-mix(in srgb, var(--stage-bg) 70%, #000 30%); opacity: 0.3; }
      .stage-yellow { --stage-bg: var(--c-yellow); }
      .stage-pink { --stage-bg: var(--c-pale-pink); }
      .stage-cyan { --stage-bg: var(--c-pale-blue); }
      .stage-periwinkle { --stage-bg: var(--c-pale-periwinkle); }
      .stage-green { --stage-bg: var(--c-pale-green); }
      .page-stage-eyebrow { color: #000; }
      .page-stage-eyebrow .cine-dot { background: #000; box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.14); }
      .page-stage-icon { background: #000; color: #fff; }
      .page-stage-title { color: #000; font-size: clamp(2.3rem, 1.2rem + 3.6vw, 4.6rem); line-height: 0.92; }
      .page-stage-title .accent-serif { color: var(--c-violet); font-size: 1.1em; }
      .page-stage-lede { color: rgba(0, 0, 0, 0.82); }
      .page-stage-stats { border-top-color: rgba(0, 0, 0, 0.16); }
      .page-stage-stats dt { color: rgba(0, 0, 0, 0.72); }
      .page-stage-stats dd { color: #000; }
      .page-stage-foot { border-top-color: rgba(0, 0, 0, 0.16); }
      .page-stage .btn.stage-ghost { color: #000; border-color: #000; }
      .page-stage .btn.stage-ghost:hover { background: #000; color: #fff; }
      .seg { background: rgba(255, 255, 255, 0.55); border: 2px solid #000; }
      .seg button { color: #000; }
      .seg button:hover { color: #000; background: rgba(255, 255, 255, 0.7); }
      .seg button.on { background: #000; color: #fff; }
      .seg-count { background: rgba(0, 0, 0, 0.1); }
      .seg button.on .seg-count { background: var(--c-yellow); color: #000; }
      .seg.seg-light { background: #fff; border: 2px solid #000; box-shadow: none; }
      .seg.seg-light button { color: #000; }
      .seg.seg-light button.on { background: #000; color: #fff; }
      .seg.seg-light .seg-count { background: var(--c-soft-grey); color: #000; }
      .seg.seg-light button.on .seg-count { background: var(--c-yellow); color: #000; }
      .ask-context-label { color: rgba(0, 0, 0, 0.72); }
      .ask-context-hint { color: rgba(0, 0, 0, 0.8); }
      .empty-stage { border: 2px dashed #000; }
      .empty-stage-mark { background: var(--c-yellow); color: #000; box-shadow: 4px 4px 0 #000; }

      /* --- Exam page and shared surfaces in the club palette --- */
      .side-nav { border-radius: 28px; }
      .side-link.active { background: #000; color: #fff; }
      .side-help { background: var(--c-violet); }
      .side-help-mark { background: var(--c-yellow); }
      .part-mast-label strong { color: var(--c-violet); }
      .part-step.is-done { background-color: var(--c-pale-periwinkle); }
      .part-step.is-on { background-color: #000; }
      .part-pager-btn.is-next { background: #000; }
      .part-pager-btn.is-next:hover { background: var(--c-violet); }
      .corrigendum-bar.notice-ribbon { border: 2px solid #000; box-shadow: 5px 5px 0 #000; background: var(--c-soft-orange); }
      .notice-ribbon::before { background: var(--c-orange); }
      .notice-ribbon-mark { background: #fff; color: #000; box-shadow: inset 0 0 0 2px #000; }
      .notice-ribbon-eyebrow { color: #000; }
      .rule-card { border: 2px solid #000; box-shadow: 4px 4px 0 #000; }
      .rule-card-num { color: var(--c-violet); }
      .chat-avatar { background: var(--c-violet); }
      .from-user .chat-bubble { background: #000; }
      .chat-who { color: var(--c-violet); }
      .chat-send { background: #000; }
      .chat-send:hover { background: var(--c-violet); }
      .agenda-count, .agenda-months .chip.active { background: #000; }
      .tile-strip { border: 2px solid #000; box-shadow: none; }
      .exam-banner { border: 2px solid #000; box-shadow: none; }
      .exam-banner::before { background: linear-gradient(var(--c-violet), var(--c-magenta)); }

      @media (max-width: 1100px) {
        .club-cards { display: grid; grid-auto-flow: column; grid-template-columns: none; grid-auto-columns: minmax(220px, 32%); overflow-x: auto; scroll-snap-type: x mandatory; padding: 20px 6px 40px; margin: 0 -6px; scrollbar-width: none; }
        .club-cards::-webkit-scrollbar { display: none; }
        .popular-exam-card.club-card { scroll-snap-align: start; }
      }
      @media (max-width: 900px) {
        .club-hero-inner { grid-template-columns: minmax(0, 1fr); }
        .club-hero-visual { min-height: 400px; }
        .club-sticker-0 { left: 2%; }
        .club-sticker-1 { right: 2%; }
        .club-band-inner { grid-template-columns: minmax(0, 1fr); }
        .club-faq { grid-template-columns: minmax(0, 1fr); }
        .club-faq-cats { position: static; flex-direction: row; flex-wrap: wrap; }
        .club-faq-cats-label { width: 100%; }
      }
      @media (max-width: 600px) {
        .club-hero { margin-top: -120px; padding-top: 150px; }
        .club-cards { grid-auto-columns: 74%; }
        .club-sticker { min-width: 0; max-width: 62%; padding: 10px 12px; }
        .club-sticker-0 { left: 0; bottom: 2%; }
        .club-sticker-1 { right: 0; bottom: auto; top: 2%; }
        .club-note { display: none; }
        .club-mini-2, .club-mini-3, .club-mini-4, .club-mini-5 { display: none; }
        .club-categories { border-radius: 0 0 40px 40px; }
        .club-band-note { left: 0; }
        .page-stage { border-radius: 26px; }
      }

      /* =====================================================================================
         DAWN: GovOS's own theme over the club composition. A navy sky, a saffron sun rising over marigold and
         saffron hills, India green, coral and sky blue; cream paper. "Exams today. A better tomorrow."
         ===================================================================================== */
      :root {
        --d-navy: #13235e; --d-navy-2: #0b1640; --d-saffron: #ff8f1f; --d-saffron-deep: #c2410c; --d-marigold: #ffc53d;
        --d-green: #12a150; --d-emerald: #0f7b45; --d-coral: #ff6b5e; --d-sky: #7cc4ff; --d-cream: #fffaf2;
        --d-saffron-soft: #ffe6cc; --d-saffron-pale: #ffc995; --d-marigold-soft: #fff1c7; --d-marigold-pale: #ffde80;
        --d-green-soft: #d6f5e1; --d-green-pale: #9fe3b9; --d-sky-soft: #e1f1ff; --d-sky-pale: #b6dcff;
        --d-coral-soft: #ffe1dd; --d-coral-pale: #ffb4aa; --d-navy-soft: #e3e7f8; --d-navy-pale: #bcc5ee;
        --primary: var(--d-navy); --primary-soft: #e6e9f8; --primary-glow: rgba(19, 35, 94, 0.35);
        --c-violet: var(--d-navy); --c-yellow: var(--d-marigold); --c-magenta: var(--d-saffron);
        --paper: var(--d-cream); --saffron-text: var(--d-saffron-deep); --saffron: var(--d-saffron);
      }
      body { background-color: var(--d-cream); }
      .accent-serif { color: var(--d-saffron-deep); }

      /* --- The bar takes the colour under it (Header samples it into --bar-rgb / data-surface) --- */
      .topbar { transition: padding 0.45s var(--ease-osmo), box-shadow 0.45s var(--ease-osmo), background-color 0.45s var(--ease-energy); }
      .topbar[data-scrolled="true"] { background: rgba(var(--bar-rgb, 255, 250, 242), 0.9); box-shadow: 0 12px 30px -22px rgba(0, 0, 0, 0.45); }
      .brand-gov { color: #1d4ed8; } .brand-os { color: #c0480a; } .brand-tag { color: #63738a; }
      .brand-gov, .brand-os, .brand-tag { transition: color 0.4s var(--ease-energy); }
      .topbar[data-surface="dark"] .brand-gov { color: #fff; }
      .topbar[data-surface="dark"] .brand-os { color: var(--d-marigold); }
      .topbar[data-surface="dark"] .brand-tag { color: rgba(255, 255, 255, 0.78); }
      .topbar[data-surface="dark"] .nav-link { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.24); }
      .topbar[data-surface="dark"] .nav-link svg { color: #fff; }
      .topbar[data-surface="dark"] .nav-link:hover { background: rgba(255, 255, 255, 0.22); color: #fff; }
      .topbar[data-surface="dark"] .nav-link.active { background: var(--d-marigold); color: var(--d-navy-2); }
      .topbar[data-surface="dark"] .nav-link.active svg { color: var(--d-navy-2); }
      .topbar[data-surface="dark"] .icon-btn { background: rgba(255, 255, 255, 0.12); color: #fff; border-color: rgba(255, 255, 255, 0.28); }
      .app-container[data-view="FINDER"] > .topbar[data-surface="dark"]:not([data-scrolled="true"]) .icon-btn { background: rgba(255, 255, 255, 0.12); }

      /* --- Intro and page wipe: a saffron ribbon --- */
      .club-intro-ribbon { stroke: var(--d-saffron); }
      .club-intro-logo { color: var(--d-navy); }
      .page-wipe { position: fixed; inset: 0; z-index: 5500; pointer-events: none; }
      .page-wipe svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .page-wipe-ribbon {
        fill: none; stroke: var(--d-saffron); stroke-width: 260; stroke-linecap: round; stroke-dasharray: 100 140; stroke-dashoffset: 0;
        animation: ribbonOff 0.8s cubic-bezier(0.3, 0, 0.2, 1) forwards;
      }

      /* --- The opening field at dawn --- */
      .club-hero {
        background-color: var(--d-navy); color: #fff;
        background-image: linear-gradient(180deg, #0b1640 0%, #13235e 42%, #2a2f78 74%, #5b3a7c 100%);
      }
      .club-corner { display: none; }
      .club-stars {
        position: absolute; inset: 0 0 45% 0; z-index: -2; pointer-events: none; opacity: 0.8;
        background-image:
          radial-gradient(1.6px 1.6px at 8% 22%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 18% 64%, #fff 50%, transparent 52%),
          radial-gradient(2px 2px at 27% 12%, #ffe9b0 50%, transparent 52%), radial-gradient(1.2px 1.2px at 41% 40%, #fff 50%, transparent 52%),
          radial-gradient(1.6px 1.6px at 52% 9%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 63% 30%, #ffe9b0 50%, transparent 52%),
          radial-gradient(2px 2px at 71% 14%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 84% 26%, #fff 50%, transparent 52%),
          radial-gradient(1.6px 1.6px at 93% 8%, #fff 50%, transparent 52%), radial-gradient(1.2px 1.2px at 34% 78%, #fff 50%, transparent 52%);
      }
      .club-sun { position: absolute; right: 10%; bottom: 20%; width: clamp(240px, 27vw, 420px); aspect-ratio: 1; z-index: -1; pointer-events: none; }
      .club-sun-disc {
        display: block; width: 100%; height: 100%; border-radius: 50%;
        background: radial-gradient(circle at 50% 45%, #fff1c2 0%, #ffd36b 30%, #ffb02e 56%, #ff8f1f 70%, rgba(255, 143, 31, 0) 71%);
        box-shadow: 0 0 160px 70px rgba(255, 143, 31, 0.34), 0 0 420px 160px rgba(255, 120, 60, 0.18);
      }
      .club-hero .club-waves { height: 34%; }
      .club-hero-inner { padding-bottom: clamp(190px, 21vw, 300px); }
      .exam-hero .exam-logo { text-align: center; line-height: 1.05; font-size: 0.86rem; padding: 4px; }
      .club-waves .w1 { fill: #ffb347; }
      .club-waves .w2 { fill: var(--d-saffron); }
      .club-waves .w3 { fill: var(--d-cream); }
      .club-title { color: #fff !important; }
      .club-title-accent .split-word { color: var(--d-marigold); }
      .club-lede { color: rgba(255, 255, 255, 0.86); }
      .club-search { box-shadow: 0 16px 34px -18px rgba(0, 0, 0, 0.7); color: var(--d-navy); }
      .club-search input { color: var(--d-navy-2); }
      .club-search input::placeholder { color: rgba(11, 22, 64, 0.6); }
      .club-search:focus-within { box-shadow: 0 0 0 3px var(--d-marigold), 6px 8px 0 3px var(--d-saffron); }
      .btn.club-cta { background: var(--d-saffron); color: var(--d-navy-2); }
      .btn.club-cta:hover { background: var(--d-marigold); }
      .club-hero .btn.club-ghost { color: #fff; border-color: #fff; }
      .club-hero .btn.club-ghost:hover { background: #fff; color: var(--d-navy-2); }
      .club-hero .chip.club-chip { background: rgba(255, 255, 255, 0.1); color: #fff; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.26); }
      .club-hero .chip.club-chip:hover { background: #fff; color: var(--d-navy-2); }
      .club-figures dt { color: rgba(255, 255, 255, 0.8); }
      .club-figures dd { color: #fff; }
      .club-note { color: var(--d-marigold); }
      .club-sticker { border: 0; color: var(--d-navy-2); box-shadow: 6px 6px 0 var(--d-saffron); }
      .club-sticker:hover { box-shadow: 9px 9px 0 var(--d-marigold); }
      .club-sticker-code { color: var(--d-saffron-deep); }
      .club-sticker-when { color: rgba(11, 22, 64, 0.72); }
      .club-sticker-when strong { color: var(--d-navy-2); }
      /* the guide book: cream cover, green spine, marigold sun — the colours of the morning it promises */
      .club-book-scroll, .club-book-tilt, .club-book-float { position: absolute; inset: 0; }
      .club-book-tilt { transform: perspective(900px) rotateY(calc(var(--mx, 0) * 14deg)) rotateX(calc(var(--my, 0) * -10deg)); transition: transform 0.8s var(--ease-osmo); }
      .club-book { translate: 0 -50%; }
      .club-book-cover { background: #fff6e5; color: var(--d-navy-2); box-shadow: inset -8px 0 0 rgba(0, 0, 0, 0.06); }
      .club-book-cover::before { background: var(--d-marigold); opacity: 1; }
      .club-book-spine { background: var(--d-green); }
      .club-book-mark { color: var(--d-navy); }
      .club-book-kicker { color: var(--d-saffron-deep); }
      .club-book-pages { background: repeating-linear-gradient(0deg, #fffdf6 0 3px, #e9dcc0 3px 4px); box-shadow: 18px 26px 44px -14px rgba(0, 0, 0, 0.6); }

      @media (prefers-reduced-motion: no-preference) {
        .club-sun-disc { animation: sunRise 1.9s var(--ease-osmo) calc(var(--intro-delay, 0s) + 0.05s) backwards, sunPulse 7s ease-in-out 2s infinite alternate paused; }
        .club-hero[data-live="true"] .club-sun-disc { animation-play-state: running, running; }
        .club-stars { animation: starsIn 2.4s ease-out calc(var(--intro-delay, 0s) + 0.2s) backwards, twinkle 5s ease-in-out 2.5s infinite alternate paused; }
        .club-hero[data-live="true"] .club-stars { animation-play-state: running, running; }
        .club-waves path { animation: waveRise 1.15s var(--ease-osmo) backwards; }
        .club-hero .club-waves .w1 { animation-delay: calc(var(--intro-delay, 0s) + 0.05s); }
        .club-hero .club-waves .w2 { animation-delay: calc(var(--intro-delay, 0s) + 0.16s); }
        .club-hero .club-waves .w3 { animation-delay: calc(var(--intro-delay, 0s) + 0.27s); }
        .club-book-float { animation: bookFloat 6s ease-in-out 1.6s infinite alternate paused; }
        .club-hero[data-live="true"] .club-book-float { animation-play-state: running; }
        .club-sticker { animation: chipPop 0.9s var(--ease-elastic) calc(var(--intro-delay, 0s) + 0.8s) backwards, stickerFloat 5s ease-in-out 2s infinite alternate paused; }
        .club-sticker-1 { animation-delay: calc(var(--intro-delay, 0s) + 0.95s), 2.6s; animation-duration: 0.9s, 6.5s; }
        .club-hero[data-live="true"] .club-sticker { animation-play-state: running, running; }
      }
      @keyframes sunRise { from { transform: translateY(60%) scale(0.82); opacity: 0.2; } }
      @keyframes sunPulse { to { scale: 1.05; } }
      @keyframes starsIn { from { opacity: 0; } }
      @keyframes twinkle { to { opacity: 0.45; } }
      @keyframes waveRise { from { transform: translateY(160px); } }
      @keyframes bookFloat { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-18px) rotate(3deg); } }
      @keyframes stickerFloat { from { transform: translateY(0); } to { transform: translateY(-12px); } }
      /* Scrolling down the field: the sun sets, the hills part, the book lifts away, the words drift up. */
      @supports (animation-timeline: scroll()) {
        @media (prefers-reduced-motion: no-preference) {
          .club-sun { animation: sunSet linear both; animation-timeline: scroll(root); animation-range: 0 760px; }
          .club-hero .club-waves .g1 { animation: hillBack linear both; animation-timeline: scroll(root); animation-range: 0 760px; }
          .club-hero .club-waves .g2 { animation: hillMid linear both; animation-timeline: scroll(root); animation-range: 0 760px; }
          .club-book-scroll { animation: bookLift linear both; animation-timeline: scroll(root); animation-range: 0 760px; }
          .club-hero-copy { animation: copyDrift linear both; animation-timeline: scroll(root); animation-range: 120px 820px; }
        }
      }
      @keyframes sunSet { to { transform: translateY(42%) scale(0.9); } }
      @keyframes hillBack { to { transform: translateY(-70px); } }
      @keyframes hillMid { to { transform: translateY(-34px); } }
      @keyframes bookLift { to { transform: translateY(-140px) rotate(-14deg) scale(1.08); } }
      @keyframes copyDrift { to { transform: translateY(-70px); opacity: 0.35; } }

      /* --- Section titles in navy ink --- */
      .club-section-title, .chapter-title, .journey-title, .journey-step-title { color: var(--d-navy-2); }
      .club-shelf-note { color: var(--d-saffron-deep); }
      .chapter-index { color: var(--d-navy-2); border-color: var(--d-navy-2); }
      .chapter-link, .journey-link, .journey-verb { color: var(--d-saffron-deep); }
      .journey-line-fill { background: linear-gradient(var(--d-saffron), #fff 50%, var(--d-green)); box-shadow: 0 0 0 1px rgba(11, 22, 64, 0.08); }
      @keyframes numLight { from { background: #fff; color: var(--d-navy-2); } to { background: var(--d-marigold); color: var(--d-navy-2); box-shadow: 0 0 0 2px var(--d-navy-2), 4px 4px 0 2px var(--d-saffron); } }

      /* --- The exam cards in the dawn palette, dealt onto the table as they arrive --- */
      .club-violet { --card-frame: var(--d-navy-pale); --card-cover: var(--d-navy); --card-on: #fff; --card-accent: var(--d-saffron); }
      .club-yellow { --card-frame: var(--d-marigold-soft); --card-cover: var(--d-marigold); --card-on: var(--d-navy-2); --card-accent: var(--d-saffron); }
      .club-green  { --card-frame: var(--d-green-soft); --card-cover: var(--d-green); --card-on: var(--d-navy-2); --card-accent: var(--d-marigold); }
      .club-pink   { --card-frame: var(--d-coral-soft); --card-cover: var(--d-coral); --card-on: var(--d-navy-2); --card-accent: var(--d-marigold-pale); }
      .club-cyan   { --card-frame: var(--d-sky-soft); --card-cover: var(--d-sky); --card-on: var(--d-navy-2); --card-accent: #fff; }
      .club-blank  { --card-frame: #f1ece2; }
      .club-card-tags span { color: var(--d-navy-2); }
      .club-card-pop { background: var(--d-saffron); color: var(--d-navy-2); }
      @media (prefers-reduced-motion: no-preference) {
        .club-cards .popular-exam-card.rv-in { animation: cardDeal 1s var(--ease-elastic) backwards; animation-delay: calc(var(--pi, 0) * 95ms); }
      }
      @keyframes cardDeal {
        from { opacity: 0; transform: translateY(160px) rotate(calc(var(--tilt, 0deg) * -8)) scale(0.8); }
        12% { opacity: 1; }
        to { transform: translateY(var(--drop, 0)) rotate(var(--tilt, 0deg)); }
      }

      /* --- "Choose from" on India green --- */
      .club-categories { background: var(--d-emerald); color: #fff; }
      .club-cat-eyebrow, .club-cat-reel button.is-script { color: var(--d-marigold); }
      .club-cat-reel button { color: #fff; }
      .club-cat-reel button:hover { color: var(--d-marigold); }
      .club-cat-reel button.is-script:hover { color: #fff; }
      .club-cat-more { color: #fff; }
      .club-cat-sticker { color: var(--d-navy-2); border-color: var(--d-navy-2); box-shadow: 6px 6px 0 var(--d-saffron); }
      .club-cat-sticker:hover { box-shadow: 9px 9px 0 var(--d-marigold); }
      .club-mini.club-violet { box-shadow: 0 18px 30px -18px rgba(0, 0, 0, 0.6), inset 0 0 0 2px rgba(255, 255, 255, 0.35); }

      /* --- The band under a morning sky --- */
      .club-band { background: #cfe8ff; }
      /* The band is words only: one centred column. */
      .club-band-inner { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
      .club-band-copy { display: flex; flex-direction: column; align-items: center; }
      .club-band-copy p { margin-left: auto; margin-right: auto; }
      .club-band .club-actions { justify-content: center; }
      .club-label-title span:first-child { background: #fff; color: var(--d-navy-2); }
      .club-label-title span:last-of-type { background: var(--d-navy-2); color: #fff; }
      .club-band .btn.club-ghost { color: var(--d-navy-2); border-color: var(--d-navy-2); }
      .club-band .btn.club-ghost:hover { background: var(--d-navy-2); color: #fff; }
      .club-band-frame { box-shadow: 14px 14px 0 var(--d-saffron); }
      .club-band-frame img { border-color: var(--d-navy-2); }
      .club-band-note { background: var(--d-marigold); color: var(--d-navy-2); }
      @media (prefers-reduced-motion: no-preference) {
        .club-label-title.rv-in span { animation: stripIn 0.8s var(--ease-osmo) backwards; }
        .club-label-title.rv-in span:last-of-type { animation-delay: 0.18s; }
      }
      @keyframes stripIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

      /* --- Questions in the dawn colours --- */
      .club-faq-pink, .club-dot-pink { --faq-soft: var(--d-coral-soft); --faq-strong: var(--d-coral-pale); }
      .club-faq-orange, .club-dot-orange { --faq-soft: var(--d-saffron-soft); --faq-strong: var(--d-saffron-pale); }
      .club-faq-green, .club-dot-green { --faq-soft: var(--d-green-soft); --faq-strong: var(--d-green-pale); }
      .club-faq-periwinkle, .club-dot-periwinkle { --faq-soft: var(--d-navy-soft); --faq-strong: var(--d-navy-pale); }
      .club-faq-cyan, .club-dot-cyan { --faq-soft: var(--d-sky-soft); --faq-strong: var(--d-sky-pale); }
      .club-faq-group h3, .club-faq-row > button, .club-faq-answer p { color: var(--d-navy-2); }

      /* --- The last field: night again, the wordmark rising --- */
      .club-footer { background: var(--d-navy); }
      .club-footer-wave path { fill: var(--d-cream); }
      .club-footer-mark, .club-footer-word { color: var(--d-marigold); }
      .cf-char { display: inline-block; transform-origin: bottom left; }
      @media (prefers-reduced-motion: no-preference) {
        html.motion-ok .club-footer-word.rv-wait .cf-char { opacity: 0; }
        .club-footer-word.rv-in .cf-char, .club-footer-word.rv-seen .cf-char { animation: wordSpring 0.95s var(--ease-elastic) backwards, wordFade 0.15s linear backwards; animation-delay: calc(0.1s + var(--ci, 0) * 80ms); }
      }

      /* --- Exam tones: navy, marigold, India green, coral, sky --- */
      .pass-ink     { background: var(--d-navy); --tone-fg: #fff; color: #fff; }
      .pass-saffron { background: var(--d-marigold); --tone-fg: var(--d-navy-2); color: var(--d-navy-2); }
      .pass-jade    { background: var(--d-green-pale); --tone-fg: var(--d-navy-2); color: var(--d-navy-2); }
      .pass-plum    { background: var(--d-coral-pale); --tone-fg: var(--d-navy-2); color: var(--d-navy-2); }
      .pass-tide    { background: var(--d-sky-pale); --tone-fg: var(--d-navy-2); color: var(--d-navy-2); }
      .shelf-flag-on { color: var(--d-navy); }
      .pass-ink .btn.stage-cta { background: var(--d-marigold); color: var(--d-navy-2); }
      .btn.stage-cta { background: var(--d-navy-2); color: #fff; }
      .btn.stage-cta:hover { background: var(--d-saffron); color: var(--d-navy-2); }

      /* --- Page stages: each page its own morning colour --- */
      .stage-yellow { --stage-bg: var(--d-marigold); }
      .stage-pink { --stage-bg: var(--d-coral-pale); }
      .stage-cyan { --stage-bg: var(--d-sky-pale); }
      .stage-periwinkle { --stage-bg: var(--d-navy-pale); }
      .stage-green { --stage-bg: var(--d-green-pale); }
      .page-stage, .page-stage-title, .page-stage-eyebrow, .page-stage-stats dd { color: var(--d-navy-2); }
      .page-stage-title .accent-serif { color: var(--d-saffron-deep); }
      .page-stage-icon { background: var(--d-navy-2); }
      .seg button.on { background: var(--d-navy-2); }
      .seg button.on .seg-count, .seg.seg-light button.on .seg-count { background: var(--d-marigold); color: var(--d-navy-2); }
      .empty-stage-mark { background: var(--d-marigold); color: var(--d-navy-2); box-shadow: 4px 4px 0 var(--d-saffron); }
      .side-help { background: var(--d-navy); }
      .side-help-mark { background: var(--d-marigold); color: var(--d-navy-2); }
      .part-mast-label strong, .rule-card-num, .chat-who { color: var(--d-saffron-deep); }
      .part-step.is-done { background-color: var(--d-saffron-pale); }
      .part-step.is-on { background-color: var(--d-navy-2); }
      .part-pager-btn.is-next { background: var(--d-navy-2); }
      .part-pager-btn.is-next:hover { background: var(--d-saffron-deep); }
      .chat-avatar { background: var(--d-navy); }
      .from-user .chat-bubble, .chat-send { background: var(--d-navy-2); }
      .chat-send:hover { background: var(--d-saffron-deep); }
      .exam-banner::before { background: linear-gradient(var(--d-saffron), #fff 50%, var(--d-green)); }
      .notice-ribbon::before { background: var(--d-saffron); }
      .corrigendum-bar.notice-ribbon { background: var(--d-saffron-soft); }

      /* =====================================================================================
         THE ROAD TO THE GATE: the hero's scene (ClubSkyline). A government building and a gate arch backlit by the
         rising sun, the tricolour on the dome, a road with the four moments of every recruitment, and an official
         notice whose key line is marked and tied to its evidence.
         ===================================================================================== */
      .club-hero .club-sun { display: none; }
      .sky-scene { position: absolute; inset: -30px -24px -40px -96px; }
      .sky-scene svg { width: 100%; height: 100%; overflow: visible; display: block;
        -webkit-mask-image: linear-gradient(#000 74%, transparent 98%), linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(#000 74%, transparent 98%), linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent);
        mask-composite: intersect; }
      .sky-depth { transform: translate(calc(var(--mx, 0) * var(--d, 0) * -1px), calc(var(--my, 0) * var(--d, 0) * -0.6px)); transition: transform 0.9s var(--ease-osmo); }
      .sky-sun, .sky-pin-body, .sky-flag { transform-box: fill-box; }
      .sky-sun { transform-origin: center; }
      .sky-pin-body { transform-origin: 50% 100%; }
      .sky-flag { transform-origin: 0% 50%; }
      .sky-road { stroke-dasharray: 1 1; }
      .sky-pin-label { font-family: var(--font-display); font-weight: 800; font-size: 11px; fill: #fff; letter-spacing: 0.02em; }
      .sky-notice {
        position: absolute; left: 0; top: 2%; z-index: 2; width: clamp(150px, 14vw, 194px); padding: 12px 14px 14px;
        display: flex; flex-direction: column; gap: 7px; background: #fffdf6; border-radius: 12px; rotate: -7deg;
        box-shadow: 6px 8px 0 var(--d-saffron), 0 22px 40px -20px rgba(0, 0, 0, 0.65);
      }
      .sky-notice-head { display: flex; align-items: center; gap: 6px; font-size: 0.66rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--d-navy-2); }
      .sky-notice-seal { display: inline-flex; color: var(--d-saffron-deep); }
      .sky-notice-line { position: relative; display: block; height: 6px; border-radius: 4px; background: #dfe3f2; overflow: hidden; }
      .sky-notice-line.short { width: 62%; }
      .sky-notice-line.is-marked { height: 9px; }
      .sky-notice-mark { position: absolute; inset: 0; background: var(--d-marigold); transform-origin: left; }
      .sky-notice-tag { align-self: flex-start; margin-top: 2px; padding: 3px 9px; border-radius: 999px; background: var(--d-emerald); color: #fff; font-size: 0.66rem; font-weight: 800; }
      /* the note sits under the notice it describes; the date stickers keep to the right */
      .club-note { left: -2%; top: auto; bottom: -16%; right: auto; rotate: -5deg; max-width: 9em; text-align: left; }
      .club-sticker-0 { left: auto; right: -4%; bottom: -14%; top: auto; rotate: -4deg; }
      .club-sticker-1 { left: auto; right: -6%; top: -10%; bottom: auto; rotate: 5deg; }

      @media (prefers-reduced-motion: no-preference) {
        .sky-rise { animation: skyRise 1.1s var(--ease-osmo) backwards; animation-delay: calc(var(--intro-delay, 0s) + 0.15s + var(--ri, 0) * 0.12s); }
        .sky-sun { animation: skySunRise 1.9s var(--ease-osmo) calc(var(--intro-delay, 0s) + 0.05s) backwards, sunPulse 7s ease-in-out 2s infinite alternate paused; }
        .sky-far { animation: starsIn 1.6s ease-out calc(var(--intro-delay, 0s) + 0.3s) backwards; }
        .sky-road { animation: roadDraw 1.4s var(--ease-osmo) calc(var(--intro-delay, 0s) + 0.7s) backwards; }
        .sky-road-line { animation: starsIn 0.6s ease-out calc(var(--intro-delay, 0s) + 1.7s) backwards; }
        .sky-pin-body { animation: pinDrop 0.85s var(--ease-elastic) backwards; animation-delay: calc(var(--intro-delay, 0s) + 1.15s + var(--pi, 0) * 0.18s); }
        .sky-pin.is-goal .sky-pin-body { animation: pinDrop 0.85s var(--ease-elastic) calc(var(--intro-delay, 0s) + 1.69s) backwards, pinBob 1.5s ease-in-out 3s infinite alternate paused; }
        .sky-window { animation: windowsOn 0.5s ease-out backwards, windowGlow 3.2s ease-in-out 3s infinite alternate paused; animation-delay: calc(var(--intro-delay, 0s) + 1.3s + var(--wi, 0) * 0.12s), calc(3s + var(--wi, 0) * 0.4s); }
        .sky-flag { animation: flagWave 1.3s ease-in-out 1.5s infinite alternate paused; }
        .sky-bird { animation: birdFly 16s linear infinite paused; }
        .sky-bird-2 { animation-name: birdFly2; animation-duration: 21s; animation-delay: -7s; }
        .sky-notice { animation: noticeIn 0.9s var(--ease-elastic) calc(var(--intro-delay, 0s) + 0.6s) backwards, noticeFloat 6s ease-in-out 2.4s infinite alternate paused; }
        .sky-notice-mark { animation: markSweep 0.7s var(--ease-osmo) calc(var(--intro-delay, 0s) + 1.9s) backwards; }
        .club-hero[data-live="true"] .sky-sun { animation-play-state: running, running; }
        .club-hero[data-live="true"] .sky-pin.is-goal .sky-pin-body,
        .club-hero[data-live="true"] .sky-window,
        .club-hero[data-live="true"] .sky-notice { animation-play-state: running, running; }
        .club-hero[data-live="true"] .sky-flag,
        .club-hero[data-live="true"] .sky-bird { animation-play-state: running; }
      }
      @keyframes skyRise { from { transform: translateY(70px); opacity: 0; } }
      @keyframes skySunRise { from { transform: translateY(45%) scale(0.85); opacity: 0.3; } }
      @keyframes roadDraw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
      @keyframes pinDrop { from { transform: translateY(-46px) scale(0.3); opacity: 0; } 30% { opacity: 1; } }
      @keyframes pinBob { to { translate: 0 -7px; } }
      @keyframes windowsOn { from { opacity: 0.12; } }
      @keyframes windowGlow { to { opacity: 0.55; } }
      /* a gentle wave from the hoist: it never distorts the stripes or the chakra out of shape */
      @keyframes flagWave { from { transform: skewY(-2.5deg) scaleX(0.97); } to { transform: skewY(1.5deg) scaleX(1); } }
      @keyframes birdFly { from { transform: translate(-40px, 150px); } to { transform: translate(640px, 96px); } }
      @keyframes birdFly2 { from { transform: translate(-40px, 196px); } to { transform: translate(640px, 140px); } }
      @keyframes noticeIn { from { opacity: 0; transform: translateY(-36px) rotate(-18deg); } }
      @keyframes noticeFloat { to { translate: 0 -10px; } }
      @keyframes markSweep { from { transform: scaleX(0); } }
      /* scrolling down: the city sinks behind the hills a little, the notice drifts up */
      @supports (animation-timeline: scroll()) {
        @media (prefers-reduced-motion: no-preference) {
          .sky-scene svg { animation: citySink linear both; animation-timeline: scroll(root); animation-range: 0 760px; }
        }
      }
      @keyframes citySink { to { transform: translateY(70px) scale(0.97); } }

      @media (min-width: 901px) and (max-width: 1200px) {
        .sky-notice, .club-note { display: none; }
      }
      @media (max-width: 900px) {
        .club-note { display: none; }
        .sky-scene { inset: -6px -10px -30px -10px; }
        .club-sticker-0 { bottom: 0; }
        .club-sticker-0 { right: 2%; }
        .club-sticker-1 { right: 2%; }
      }
      @media (max-width: 600px) {
        .sky-notice { display: none; }
        .club-sticker-0 { right: 0; bottom: 0; }
        .club-sticker-1 { right: 0; top: 0; }
      }

      /* =====================================================================================
         SUNRISE: the hero's sky goes from deep indigo through violet to rose at the horizon, over India-green hills
         that continue the scene's lawn; a candidate walks the road to the gate.
         ===================================================================================== */
      .club-hero {
        background-color: #1a1450;
        background-image: linear-gradient(180deg, #1a1450 0%, #2d2272 38%, #4b2d86 60%, #7b3b8e 78%, #c4577c 92%, #f08a6a 100%);
      }
      .club-hero .club-waves .w1 { fill: #3fae7a; }
      .club-hero .club-waves .w2 { fill: #1f8a57; }
      .club-hero .club-waves .w3 { fill: var(--d-cream); }
      .club-stars { inset: 0 0 55% 0; }
      .sky-notice-head { white-space: nowrap; font-size: 0.62rem; letter-spacing: 0.1em; }

      /* the walk: legs and arm swing, the body bobs; only on the moving walker, only while the hero is on screen */
      .boy-leg, .boy-arm { transform-box: fill-box; }
      .boy-leg { transform-origin: 50% 0%; }
      .boy-arm { transform-origin: 50% 6%; }
      @media (prefers-reduced-motion: no-preference) {
        .sky-walker .boy-leg-front { animation: legSwing 0.62s ease-in-out infinite alternate paused; }
        .sky-walker .boy-leg-back { animation: legSwing 0.62s ease-in-out infinite alternate-reverse paused; }
        .sky-walker .boy-arm { animation: armSwing 0.62s ease-in-out infinite alternate-reverse paused; }
        .sky-walker .boy-body { animation: bodyBob 0.31s ease-in-out infinite alternate paused; }
        .club-hero[data-live="true"] .sky-walker .boy-leg,
        .club-hero[data-live="true"] .sky-walker .boy-arm,
        .club-hero[data-live="true"] .sky-walker .boy-body { animation-play-state: running; }

        /* smoother arrivals: longer travel on a soft quint ease */
        .sky-rise { animation-duration: 1.5s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
        .sky-road { animation-duration: 1.9s; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
        .sky-sun { animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1), ease-in-out; }
        .club-waves path { animation-duration: 1.4s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
        .sky-depth { transition-duration: 1.2s; transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
      }
      @keyframes legSwing { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
      @keyframes armSwing { from { transform: rotate(-20deg); } to { transform: rotate(18deg); } }
      @keyframes bodyBob { to { transform: translateY(-1.6px); } }

      /* =====================================================================================
         THE JOURNEY: the hero in its own palette (background #0B1633, hills #173B68 / #245B86, building #101B3D,
         accent blue #3B82F6, gold #F4B942, road #E8EEF5, cards #FFFFFF, text #14213D). One clock in ClubSkyline drives
         the walk, the camera and the road; the milestones light from data-stage, the legs move from data-walking.
         ===================================================================================== */
      .club-hero {
        background-color: #0b1633;
        background-image: linear-gradient(180deg, #0b1633 0%, #0e1c40 55%, #16295a 100%);
      }
      .club-hero .club-waves .w1 { fill: #245b86; }
      .club-hero .club-waves .w2 { fill: #173b68; }
      .club-hero .club-waves .w3 { fill: var(--d-cream); }
      .club-title-accent .split-word { color: #f4b942; }
      .club-hero .btn.club-cta { background: #f4b942; color: #14213d; }
      .club-hero .btn.club-cta:hover { background: #ffd06b; }
      .club-hero .club-search { color: #14213d; }
      .club-hero .club-search input { color: #14213d; }
      .club-hero .club-search:focus-within { box-shadow: 0 0 0 3px #f4b942, 6px 8px 0 3px #3b82f6; }
      .club-note { color: #f4b942; }
      .club-sticker { color: #14213d; box-shadow: 6px 6px 0 #3b82f6; }
      .club-sticker:hover { box-shadow: 9px 9px 0 #f4b942; }
      .club-sticker-code { color: #2563eb; }
      .club-sticker-when { color: rgba(20, 33, 61, 0.75); }
      .club-sticker-when strong { color: #14213d; }
      .sky-notice { box-shadow: 6px 8px 0 #3b82f6, 0 22px 40px -20px rgba(0, 0, 0, 0.65); }
      .sky-notice-head { color: #14213d; }
      .sky-notice-seal { color: #2563eb; }
      .sky-notice-mark { background: #f4b942; }
      .sky-notice-tag { background: #2563eb; }
      .sky-scene svg {
        -webkit-mask-image: linear-gradient(#000 86%, transparent 100%), linear-gradient(90deg, transparent, #000 3%, #000 94%, transparent);
        mask-image: linear-gradient(#000 86%, transparent 100%), linear-gradient(90deg, transparent, #000 3%, #000 94%, transparent);
      }

      /* the road: faint ahead, walked behind him; the centre line flows while he walks */
      .sky-road-travelled { stroke-dasharray: 1 1; stroke-dashoffset: 1; filter: drop-shadow(0 0 6px rgba(232, 238, 245, 0.35)); }
      .sky-road-line { animation: none; opacity: 0.85; }
      @media (prefers-reduced-motion: no-preference) {
        .sky-scene[data-walking="true"] .sky-road-line { animation: dashFlow 0.9s linear infinite; }
      }
      @keyframes dashFlow { to { stroke-dashoffset: -0.055; } }

      /* the milestones: dim until he reaches them, then gold with a ring and a glow */
      .sky-mile-pin { fill: #245b86; transition: fill 0.5s var(--ease-energy); }
      .sky-mile-pill { fill: #101b3d; stroke: #245b86; stroke-width: 1.5; transition: fill 0.5s var(--ease-energy), stroke 0.5s var(--ease-energy); }
      .sky-mile-label { font-family: var(--font-display); font-weight: 800; font-size: 11.5px; letter-spacing: 0.02em; fill: #9db4da; transition: fill 0.5s var(--ease-energy); }
      .sky-mile-glow { opacity: 0; transition: opacity 0.8s var(--ease-osmo); }
      .sky-mile-ring { opacity: 0; }
      .sky-mile-glow, .sky-mile-ring, .sky-mile-body, .sky-spark { transform-box: fill-box; transform-origin: center; }
      .sky-mile-body { transform-origin: 50% 100%; }
      .sky-mile.is-lit .sky-mile-pin { fill: #f4b942; }
      .sky-mile.is-lit .sky-mile-pill { fill: #3b82f6; stroke: #3b82f6; }
      .sky-mile.is-lit .sky-mile-label { fill: #ffffff; }
      .sky-mile.is-lit .sky-mile-glow { opacity: 1; }
      @media (prefers-reduced-motion: no-preference) {
        .sky-mile.is-lit .sky-mile-ring { animation: mileRing 1.3s ease-out both; }
        .sky-mile.is-lit .sky-mile-body { animation: mileLight 0.75s var(--ease-elastic) both; }
        .club-hero[data-live="true"] .sky-mile.is-goal.is-lit .sky-mile-glow { animation: goalPulse 1.6s ease-in-out 1.3s infinite alternate; }
      }
      @keyframes mileRing { from { opacity: 0.95; scale: 0.6; } to { opacity: 0; scale: 2.6; } }
      @keyframes mileLight { from { scale: 1.35; translate: 0 -4px; } }
      @keyframes goalPulse { to { scale: 1.25; } }

      /* the result: the building's windows bloom, its rims brighten, sparks burst */
      .sky-window { fill: #2a3d70; transition: fill 0.8s var(--ease-osmo); animation: none !important; }
      .sky-scene[data-stage="3"] .sky-window { fill: #f4b942; filter: drop-shadow(0 0 4px rgba(244, 185, 66, 0.9)); }
      .sky-rim { stroke-opacity: 0.45; transition: stroke-opacity 0.8s var(--ease-osmo), stroke-width 0.8s var(--ease-osmo); }
      .sky-scene[data-stage="3"] .sky-rim { stroke-opacity: 1; }
      .sky-scene[data-stage="3"] .sky-dome-rim { stroke-width: 3.5; filter: drop-shadow(0 0 6px rgba(244, 185, 66, 0.8)); }
      .sky-spark { opacity: 0; }
      @media (prefers-reduced-motion: no-preference) {
        .sky-scene[data-stage="3"] .sky-spark { animation: sparkPop 1.5s var(--ease-osmo) both; animation-delay: calc(0.15s + var(--si, 0) * 70ms); }
      }
      @keyframes sparkPop { 0% { opacity: 0; scale: 0.2; rotate: 0deg; } 30% { opacity: 1; scale: 1.25; } 100% { opacity: 0; scale: 0.7; rotate: 90deg; } }

      /* the legs move only while he walks; at a milestone he stands */
      .sky-scene:not([data-walking="true"]) .sky-walker .boy-leg,
      .sky-scene:not([data-walking="true"]) .sky-walker .boy-arm,
      .sky-scene:not([data-walking="true"]) .sky-walker .boy-body { animation: none; }

      /* =====================================================================================
         THE DECK: the popular exams as a fanned deck of overlapping cards. Each slot is a flex item that shares the
         row; a card is wider than its slot, so neighbours overlap. The slot under the pointer (or focus) grows until
         its card is fully in view, the card lifts and straightens, and the others tuck under.
         ===================================================================================== */
      .deck { --card-w: clamp(250px, 23vw, 312px); display: flex; align-items: flex-start; padding: 24px 0 56px; }
      .deck-slot {
        flex: 1 1 0; min-width: 0; display: flex; justify-content: center; position: relative; z-index: 1;
        transition: flex-grow 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .deck-slot:first-child { justify-content: flex-start; }
      .deck-slot:last-child { justify-content: flex-end; }
      .popular-exam-card.deck-card {
        position: relative; flex: 0 0 var(--card-w); width: var(--card-w); min-height: 440px; padding: 20px 20px 18px;
        display: flex; flex-direction: column; align-items: stretch; gap: 0; text-align: left; cursor: pointer;
        border: 2.5px solid #14213d; border-radius: 26px; background: var(--deck-fill); color: #14213d;
        font-family: var(--font-sans);
        rotate: var(--tilt, 0deg); translate: 0 var(--lift, 0px); transform: none;
        box-shadow: 0 22px 40px -28px rgba(20, 33, 61, 0.55);
        transition: rotate 0.75s var(--ease-elastic), translate 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                    box-shadow 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .popular-exam-card.deck-card:hover { transform: none; }
      .deck-kicker { font-family: var(--font-hand); font-size: 1.25rem; text-align: center; margin-bottom: 6px; }
      .deck-art { width: 100%; height: auto; aspect-ratio: 180 / 130; margin: 2px 0 12px; overflow: visible; }
      .deck-art-glyph { font-family: var(--font-display); font-weight: 800; font-size: 13px; fill: #14213d; }
      .deck-title { font-family: var(--font-display); font-size: clamp(1.7rem, 1.2rem + 1vw, 2.2rem); font-weight: 800; line-height: 0.95; letter-spacing: -0.045em; margin-top: auto; }
      .deck-sub { font-size: 0.82rem; font-weight: 600; margin-top: 6px; color: rgba(20, 33, 61, 0.85); }
      .deck-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 12px; }
      .deck-tags span { font-size: 0.7rem; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.72); color: #14213d; }
      .deck-next { font-size: 0.8rem; line-height: 1.35; margin-top: 10px; color: rgba(20, 33, 61, 0.9); min-height: 2.7em; }
      .deck-next strong { color: #14213d; }
      .deck-pop {
        position: absolute; top: -14px; right: -10px; z-index: 3; display: inline-flex; align-items: center; gap: 4px;
        padding: 7px 12px; border-radius: 999px; background: #14213d; color: #fff; font-size: 0.78rem; font-weight: 800;
        scale: 0; rotate: -24deg; transition: scale 0.5s var(--ease-elastic), rotate 0.5s var(--ease-elastic);
      }
      .deck-violet { --deck-fill: #8fb0ff; }
      .deck-yellow { --deck-fill: #f4b942; }
      .deck-green  { --deck-fill: #45d08f; }
      .deck-pink   { --deck-fill: #ff8a7a; }
      .deck-cyan   { --deck-fill: #8fd3ff; }
      .deck-blank  { --deck-fill: #e8eef5; border-style: dashed; }

      /* the accordion, on a pointer that hovers; keyboard focus does the same everywhere */
      @media (hover: hover) and (pointer: fine) {
        .deck-slot:hover { flex-grow: 1.85; z-index: 5; }
        .deck-slot:hover .deck-card { rotate: calc(var(--tilt, 0deg) * -0.35); translate: 0 -14px; box-shadow: 0 36px 50px -26px rgba(20, 33, 61, 0.6); }
        .deck-slot:hover .deck-pop { scale: 1; rotate: 6deg; }
        .deck:hover .deck-slot:not(:hover) .deck-card { translate: 0 calc(var(--lift, 0px) + 10px); }
      }
      .deck-slot:focus-within { flex-grow: 1.85; z-index: 5; }
      .deck-slot:focus-within .deck-card { rotate: 0deg; translate: 0 -14px; }
      .deck-slot:focus-within .deck-pop { scale: 1; rotate: 6deg; }

      /* the sketch wakes on hover: ticks are made, the chart climbs, the lamps shine */
      .deck-tick, .deck-chart { stroke-dasharray: 40; stroke-dashoffset: 0; }
      @media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
        .deck-slot:hover .deck-tick { animation: tickDraw 0.5s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
        .deck-slot:hover .deck-tick-1 { animation-delay: 0.15s; }
        .deck-slot:hover .deck-tick-2 { animation-delay: 0.3s; }
        .deck-slot:hover .deck-chart { animation: chartDraw 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
        .deck-slot:hover .deck-lamp { fill: #f4b942; transition: fill 0.3s; }
      }
      .deck-chart { stroke-dasharray: 80; }
      @keyframes tickDraw { from { stroke-dashoffset: 40; } }
      @keyframes chartDraw { from { stroke-dashoffset: 80; } }

      /* dealt onto the table as they arrive */
      @media (prefers-reduced-motion: no-preference) {
        .deck .popular-exam-card.rv-in { animation: deckDeal 1s var(--ease-elastic) backwards; animation-delay: calc(var(--pi, 0) * 95ms); }
        .deck-slot { --pi: 0; }
      }
      @keyframes deckDeal { from { opacity: 0; translate: 0 160px; rotate: calc(var(--tilt, 0deg) * -6); scale: 0.82; } 14% { opacity: 1; } }

      /* touch and narrow screens: a swipeable rail with no overlap */
      @media (max-width: 1100px), (hover: none) {
        .deck { overflow-x: auto; scroll-snap-type: x mandatory; gap: 18px; padding: 22px 8px 48px; margin: 0 -8px; scrollbar-width: none; }
        .deck::-webkit-scrollbar { display: none; }
        .deck-slot, .deck-slot:first-child, .deck-slot:last-child { flex: 0 0 auto; justify-content: center; scroll-snap-align: start; }
        .deck-slot:focus-within { flex-grow: 0; }
        .popular-exam-card.deck-card { --card-w: 270px; }
      }
      @media (max-width: 600px) { .popular-exam-card.deck-card { --card-w: 76vw; min-height: 420px; } }

      /* =====================================================================================
         CHOOSE FROM, PINNED: the section is tall and its stage sticks to the screen while the page's scroll moves the
         list one line at a time (ClubCategories writes the reel's transform, --p and each line's distance --d).
         ===================================================================================== */
      .club-categories.cat-scene {
        view-timeline: none; padding: 0; text-align: center;
        overflow: clip;   /* hidden would make it a scroll container and the sticky stage would never stick */
        height: calc(100svh + var(--lines, 10) * 34svh);
      }
      .cat-stage {
        position: sticky; top: 0; height: 100svh; min-height: 560px; overflow: hidden; isolation: isolate;
        display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 84px 20px 64px;
      }
      .cat-scene .club-cat-window {
        position: relative; width: 100%; max-width: 1100px; height: min(48svh, 420px); margin: 8px auto 0; overflow: hidden;
        -webkit-mask-image: linear-gradient(transparent 0%, #000 22%, #000 78%, transparent 100%);
                mask-image: linear-gradient(transparent 0%, #000 22%, #000 78%, transparent 100%);
      }
      .cat-scene .club-cat-reel { position: absolute; left: 0; right: 0; top: 0; padding: 0; animation: none !important; will-change: transform; }
      .cat-scene .club-cat-reel li { --d: 2; padding: 6px 0; }
      .cat-scene .club-cat-reel button {
        display: inline-block; line-height: 1.02; transform-origin: 50% 50%;
        opacity: calc(1 - min(var(--d), 1.4) * 0.55); scale: calc(1 - min(var(--d), 1.5) * 0.2);
        filter: blur(calc(max(var(--d) - 0.6, 0) * 1.6px));
      }
      .cat-scene .club-cat-reel li[data-active] button { text-shadow: 0 6px 30px rgba(0, 0, 0, 0.25); }
      .cat-scene .club-mini { animation: none !important; translate: 0 calc((0.5 - var(--p, 0.5)) * 260px * var(--k, 1)); }
      .cat-scene .club-cat-eyebrow { position: relative; z-index: 2; }
      .cat-scene .club-cat-more { margin-top: 18px; }
      /* reduced motion: an ordinary block with every line, nothing pinned or moved */
      .club-categories.cat-scene[data-motion="off"] { height: auto; }
      .cat-scene[data-motion="off"] .cat-stage { position: static; height: auto; min-height: 0; overflow: visible; }
      .cat-scene[data-motion="off"] .club-cat-window { height: auto; -webkit-mask-image: none; mask-image: none; }
      .cat-scene[data-motion="off"] .club-cat-reel { position: static; }
      .cat-scene[data-motion="off"] .club-cat-reel button { opacity: 1; scale: 1; filter: none; }
      .cat-scene[data-motion="off"] .club-mini { translate: none; }
      @media (max-width: 600px) {
        .club-categories.cat-scene { height: calc(100svh + var(--lines, 10) * 26svh); }
        .cat-stage { padding: 96px 12px 48px; }
        .cat-scene .club-cat-window { height: min(44svh, 340px); }
      }

      /* Reduced motion: everything above lands immediately. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-delay: 0ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
